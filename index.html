<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1519" />
    <link rel="icon" type="image/svg+xml" href="/brand/termfleet-vessel-master.svg" />
    <link rel="mask-icon" href="/brand/termfleet-vessel-master.svg" color="#17313f" />
    <title>TermFleet</title>
    <style>
      #termfleet-startup{position:fixed;inset:0;z-index:100;display:grid;place-items:center;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 42%,#18333b 0,#0b1519 42%,#071014 100%);color:#edf2ef;font-family:"Rubik","Segoe UI",sans-serif;opacity:1;transition:opacity 180ms cubic-bezier(.7,0,.84,0)}
      #termfleet-startup[data-startup-state="ready"]{opacity:0;pointer-events:none}
      #termfleet-startup::before{position:absolute;top:50%;left:50%;width:min(520px,76vw);aspect-ratio:1;border:1px solid rgba(151,207,213,.1);border-radius:50%;content:"";transform:translate(-50%,-50%);animation:startup-ring 3600ms cubic-bezier(.37,0,.63,1) infinite}
      #termfleet-startup::after{position:absolute;top:50%;left:50%;width:min(420px,70vw);height:1px;background:linear-gradient(90deg,transparent,rgba(151,207,213,.22),transparent);content:"";transform:translate(-50%,-50%) scaleX(.3);animation:startup-scan 2800ms cubic-bezier(.22,1,.36,1) infinite}
      .termfleet-startup__lockup{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:min(360px,calc(100vw - 48px));transform:translateY(-4vh)}
      .termfleet-startup__mark{display:block;width:180px;height:180px;overflow:visible;filter:drop-shadow(0 20px 34px rgba(0,0,0,.28));animation:mark-settle 900ms cubic-bezier(.16,1,.3,1) both,mark-float 3600ms cubic-bezier(.37,0,.63,1) 900ms infinite}
      .termfleet-loader__halo{fill:none;stroke:#9bd0d1;stroke-opacity:.26;stroke-width:.8;transform-box:fill-box;transform-origin:center;animation:halo-pulse 2400ms cubic-bezier(.37,0,.63,1) infinite}
      .termfleet-loader__hull{fill:#f1eee6}.termfleet-loader__stern{fill:#d9e7e4}.termfleet-loader__stack{fill:#f1eee6}.termfleet-loader__terminal{fill:none;stroke:#17313f;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .termfleet-loader__prompt{fill:none;stroke:#9bd0d1;stroke-width:2;stroke-linecap:round;opacity:.9;stroke-dasharray:3 8;animation:prompt-drift 1600ms linear infinite}.termfleet-loader__cursor{display:none}
      .termfleet-startup__copy{display:grid;justify-items:center;gap:13px;margin-top:15px;text-align:center;animation:copy-arrive 700ms cubic-bezier(.16,1,.3,1) 240ms both}
      .termfleet-startup__name{display:block;margin:0;color:#f1f4f0;font-size:2.25rem;font-weight:400;letter-spacing:.11em;line-height:1;text-transform:uppercase}.termfleet-startup__letter{display:inline}
      .termfleet-startup__status{margin:0;color:#9db9ba;font-size:.7rem;font-weight:400;letter-spacing:.22em;line-height:1.4;text-transform:uppercase}
      .termfleet-startup__progress{position:relative;width:152px;height:2px;margin-top:14px;overflow:hidden;background:rgba(155,208,209,.16)}
      .termfleet-startup__progress::after{position:absolute;inset:0 auto 0 -60%;width:60%;background:linear-gradient(90deg,transparent,#b3d9d7,transparent);content:"";animation:progress-sweep 1800ms cubic-bezier(.22,1,.36,1) infinite}
      @keyframes mark-settle{from{transform:translateY(12px) scale(.94)}72%{transform:translateY(-2px) scale(1.015)}to{transform:translateY(0) scale(1)}}
      @keyframes mark-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes copy-arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes halo-pulse{0%,100%{opacity:.45;transform:scale(.97)}50%{opacity:.95;transform:scale(1.03)}}
      @keyframes startup-ring{0%,100%{opacity:.34;transform:translate(-50%,-50%) scale(.96)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.02)}}
      @keyframes startup-scan{0%,100%{opacity:0;transform:translate(-50%,-50%) scaleX(.3)}32%,68%{opacity:1;transform:translate(-50%,-50%) scaleX(1)}}
      @keyframes prompt-drift{to{stroke-dashoffset:-22}}@keyframes progress-sweep{to{transform:translateX(270%)}}
      @media (max-width:520px){.termfleet-startup__mark{width:140px;height:140px}.termfleet-startup__name{font-size:1.75rem}}
      @media (prefers-reduced-motion:reduce){#termfleet-startup,#termfleet-startup *{animation:none!important;transition:none!important}}
    </style>
  </head>
  <body>
    <div id="termfleet-startup" data-startup-state="starting" role="status" aria-live="polite" aria-label="Starting TermFleet">
      <div class="termfleet-startup__lockup">
        <svg class="termfleet-startup__mark" viewBox="0 0 100 100" role="presentation" aria-hidden="true">
          <circle class="termfleet-loader__halo" cx="50" cy="50" r="42" />
          <path class="termfleet-loader__prompt" d="M21 83h58" />
          <path class="termfleet-loader__hull" d="M26 37h61c2.4 0 4 2.4 3 4.6L75 75.5c-.8 1.8-2.6 2.9-4.6 2.9H27c-2.8 0-5-2.2-5-5V42c0-2.8 1.2-5 4-5Z" />
          <g class="termfleet-loader__stern"><rect x="13" y="44" width="13" height="8" rx="2"/><rect x="16" y="56" width="10" height="8" rx="2"/><rect x="19" y="68" width="7" height="8" rx="2"/></g>
          <g class="termfleet-loader__stack"><rect x="38" y="24" width="23" height="8" rx="2"/><rect x="45" y="13" width="9" height="8" rx="2"/></g>
          <path class="termfleet-loader__terminal" d="m57 48 13 10-13 10" />
        </svg>
        <div class="termfleet-startup__copy">
          <p class="termfleet-startup__name" aria-label="TermFleet"><span class="termfleet-startup__letter" aria-hidden="true">T</span><span class="termfleet-startup__letter" aria-hidden="true">e</span><span class="termfleet-startup__letter" aria-hidden="true">r</span><span class="termfleet-startup__letter" aria-hidden="true">m</span><span class="termfleet-startup__letter" aria-hidden="true">F</span><span class="termfleet-startup__letter" aria-hidden="true">l</span><span class="termfleet-startup__letter" aria-hidden="true">e</span><span class="termfleet-startup__letter" aria-hidden="true">e</span><span class="termfleet-startup__letter" aria-hidden="true">t</span></p>
          <p class="termfleet-startup__status">Starting TermFleet</p>
          <div class="termfleet-startup__progress" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
