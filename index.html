<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10191d" />
    <link rel="icon" type="image/svg+xml" href="/brand/termfleet-vessel-master.svg" />
    <link rel="mask-icon" href="/brand/termfleet-vessel-master.svg" color="#17313f" />
    <title>TermFleet</title>
    <style>
      #termfleet-startup {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 100dvh;
        overflow: hidden;
        background: #10191d;
        color: #e6e9ec;
        font-family: "Rubik", "Segoe UI", "Cantarell", sans-serif;
        opacity: 1;
        transition: opacity 140ms cubic-bezier(0.7, 0, 0.84, 0);
      }

      #termfleet-startup[data-startup-state="ready"] {
        opacity: 0;
        pointer-events: none;
      }

      .termfleet-startup__lockup {
        position: relative;
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        align-items: center;
        gap: 27px;
        width: min(430px, calc(100vw - 48px));
        opacity: 0;
        transform: translateY(calc(-3vh + 3px));
        animation: termfleet-lockup-arrive 360ms cubic-bezier(0.22, 1, 0.36, 1) 40ms both;
      }

      .termfleet-startup__mark {
        width: 92px;
        height: 92px;
        overflow: visible;
      }

      .termfleet-startup__copy {
        display: grid;
        gap: 9px;
        min-width: 0;
      }

      .termfleet-startup__name {
        margin: 0;
        color: #e6e9ec;
        font-size: 1.875rem;
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .termfleet-startup__status {
        position: absolute;
        top: calc(100% + 13px);
        left: 119px;
        margin: 0;
        color: #aab2b8;
        font-size: 0.8125rem;
        font-weight: 300;
        line-height: 1.45;
        opacity: 0;
        transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #termfleet-startup[data-startup-slow="true"] .termfleet-startup__status {
        opacity: 1;
      }

      @keyframes termfleet-lockup-arrive {
        from {
          opacity: 0;
          transform: translateY(calc(-3vh + 3px));
        }
        to {
          opacity: 1;
          transform: translateY(-3vh);
        }
      }

      @media (max-width: 520px) {
        .termfleet-startup__lockup {
          grid-template-columns: 64px minmax(0, 1fr);
          gap: 17px;
          width: min(310px, calc(100vw - 40px));
        }

        .termfleet-startup__mark {
          width: 64px;
          height: 64px;
        }

        .termfleet-startup__status {
          left: 81px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #termfleet-startup {
          transition-duration: 1ms;
        }

        .termfleet-startup__lockup {
          animation: none;
          opacity: 1;
          transform: translateY(-3vh);
        }
      }
    </style>
  </head>
  <body>
    <div
      id="termfleet-startup"
      data-startup-state="starting"
      role="status"
      aria-live="polite"
      aria-label="Starting TermFleet"
    >
      <div class="termfleet-startup__lockup">
        <img
          class="termfleet-startup__mark"
          src="/brand/termfleet-vessel-master.svg"
          alt=""
          aria-hidden="true"
        >
        <div class="termfleet-startup__copy">
          <p class="termfleet-startup__name">TermFleet</p>
          <p class="termfleet-startup__status">Starting TermFleet</p>
        </div>
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
