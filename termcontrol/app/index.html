<!doctype html>
<html lang="en">
<!-- TermControl: map-owned fleet, native conversation actions, local theme. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#141312">
<title>TermFleet</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/app/favicon-32.png">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TermFleet">
<style>
  :root{
    color-scheme:dark;
    --bg:#141413; --surface:#1c1c1a; --surface-2:#232320; --line:#2f2f2b;
    --text:#f0eee6; --muted:#9a9993; --dim:#8b8a85;
    --accent:#d97757; --waiting:#e0a458; --working:#7aa2a0; --idle:#63625d;
    --radius:14px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  }
  @supports not (height: 100dvh){ body{height:100vh} }
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);
    font-size:15px;line-height:1.5;overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top);
  }
  header{
    flex:none;z-index:5;background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:56px;
  }
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sub{font-size:12px;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{
    appearance:none;background:none;border:0;color:var(--accent);
    font-size:15px;min-width:56px;min-height:44px;padding:8px 10px;margin:-8px -10px;
    cursor:pointer;font-family:var(--ui);text-align:left;
  }
  main{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    overflow-anchor:auto;
    -webkit-overflow-scrolling:touch;
    padding:12px 12px 20px;max-width:720px;width:100%;margin:0 auto;
  }

  :focus-visible{
    outline:none;
    box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    border-radius:10px;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }

  .pane{
    position:relative;display:block;width:100%;text-align:left;appearance:none;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:8px;color:inherit;font:inherit;
    transition:background .15s ease;
  }
  .pane:active{background:var(--surface-2)}

  .attention-panel{
    margin:0 0 14px;border:1px solid #6b5029;border-radius:var(--radius);
    background:#1e1c17;overflow:hidden;
  }
  .attention-panel summary{
    min-height:48px;padding:11px 14px;display:flex;align-items:center;gap:9px;
    cursor:pointer;list-style:none;color:var(--waiting);font-weight:600;
  }
  .attention-panel summary::-webkit-details-marker{display:none}
  .attention-panel summary::after{
    content:'›';margin-left:auto;color:var(--muted);font-size:20px;line-height:1;
    transform:rotate(90deg);transition:transform .15s ease;
  }
  .attention-panel:not([open]) summary::after{transform:rotate(0)}
  .attention-count{
    min-width:22px;height:22px;padding:0 7px;border-radius:11px;
    display:inline-grid;place-items:center;background:var(--waiting);color:#211a0d;
    font-size:12px;font-weight:700;
  }
  .attention-list{border-top:1px solid #49391f;max-height:42dvh;overflow-y:auto}
  .attention-item{
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
    padding:10px 12px;border-bottom:1px solid #393025;
  }
  .attention-item:last-child{border-bottom:0}
  .attention-copy{min-width:0}
  .attention-project{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attention-reason{
    margin-top:2px;color:var(--muted);font-size:12px;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .attention-review{
    min-width:72px;min-height:44px;padding:9px 13px;border:1px solid #76592d;
    border-radius:10px;background:#2a2216;color:#f2c57c;font:600 13px var(--ui);cursor:pointer;
  }
  .attention-review:active{transform:translateY(1px);background:#352a19}

  /* Waiting: the only card that should stop your thumb. */
  .pane.waiting{
    border-color:#6b5029;
    background:linear-gradient(180deg,#26200f,#1e1c17);
    padding-left:19px;
  }
  .pane.waiting::before{
    content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
    border-radius:0 3px 3px 0;background:var(--waiting);
  }
  .pane.waiting .project{color:#fff}

  /* Idle: present, but quieter than everything above it. */
  .pane.idle{background:transparent;border-color:#262622}
  .pane.idle .project{color:var(--muted);font-weight:500}
  .pane.idle .task{color:var(--dim)}
  .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .emoji{font-size:17px;line-height:1;flex:none}
  .titleEmoji{font-size:15px;margin-right:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.waiting{background:var(--waiting);box-shadow:0 0 0 3px rgba(224,164,88,.16)}
  .dot.working{background:var(--working)}

  /* A terminal that is genuinely producing output right now. The pulse is the
     only motion in the app, and it stops the moment the output does. */
  .dot.producing{
    background:var(--working);
    box-shadow:0 0 0 0 rgba(122,162,160,.55);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 7px rgba(122,162,160,0)}
    100%{box-shadow:0 0 0 0 rgba(122,162,160,0)}
  }
  @media (prefers-reduced-motion: reduce){ .dot.producing{animation:none} }

  /* The terminal's own last line, changing as it prints. */
  .tail{
    display:flex;align-items:center;gap:8px;margin-top:9px;
    font-family:var(--mono);font-size:12px;color:var(--working);
    overflow:hidden;white-space:nowrap;
  }
  .tail .text{overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* A trace of how much output arrived over the last minute. */
  .trace{display:flex;align-items:flex-end;gap:2px;height:14px;flex:none}
  .trace i{
    display:block;width:3px;border-radius:1px;background:var(--working);
    opacity:.5;transition:height .3s ease, opacity .3s ease;
  }
  .trace i.on{opacity:1}

  .headtail{
    display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;
    color:var(--working);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .livemark{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;color:var(--working);
  }
  .livemark.quiet{color:var(--dim);font-weight:500}
  .livemark.gone{color:var(--waiting)}
  .agentstatus{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;color:var(--dim);font-size:12px}
  .agentstatus .workingtime{color:var(--working);font-weight:600}
  .agentstatus .quota{white-space:nowrap}
  .chatstatus:empty{display:none}
  .chatstatus .agentstatus{margin-top:3px;gap:3px 8px;font-size:12px}

  .headlive{
    display:inline-flex;align-items:center;gap:5px;margin-left:8px;
    font-size:12px;font-weight:600;color:var(--working);vertical-align:middle;
  }
  .headlive.quiet{color:var(--dim);font-weight:500}
  .dot.idle{background:var(--idle)}
  .project{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .badge{
    margin-left:auto;font-size:12px;color:var(--dim);font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
  }
  .task{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .task.none{color:var(--dim);font-style:italic}
  .state{
    display:inline-block;margin-top:9px;padding:3px 9px;border-radius:99px;
    font-size:12px;font-weight:600;letter-spacing:.01em;
    background:rgba(224,164,88,.15);color:var(--waiting);
  }
  .runmark{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:12px;font-weight:500;color:var(--working);
  }

  .switch{
    display:flex;gap:2px;padding:3px;margin:2px 2px 14px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line);
  }
  .switch button{
    flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;
    color:var(--muted);font:600 13px var(--ui);cursor:pointer;
  }
  .switch button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}

  /* Sort and activity filters. Chips, not menus: the list refreshes itself and
     would close an open menu. */
  .fleetbar{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
  /* Plan usage left: one quiet line per provider, read from this PC only. */
  .usagebar{display:flex;flex-direction:column;gap:3px;margin:0 0 10px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font:400 12.5px var(--ui);color:var(--muted)}
  .usage-row{display:grid;grid-template-columns:52px 1fr;align-items:baseline;gap:0 8px}
  .usage-windows{display:flex;flex-direction:column;gap:1px}
  .usage-name{font-weight:500;color:var(--text);min-width:46px}
  .usage-window b{font-weight:500;color:var(--text)}
  .usage-window.low b{color:var(--danger,#d66)}
  .fleetbar .chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
  .fleetbar .chips::-webkit-scrollbar{display:none}
  .fleetbar .lbl{flex:none;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;min-width:38px}
  .fleetbar button{
    flex:none;appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
    font:600 12px var(--ui);padding:6px 11px;border-radius:12px;min-height:32px;cursor:pointer;
  }
  .fleetbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#191512}
  .projgroup{margin-bottom:22px}
  .projhead{
    display:flex;align-items:center;gap:8px;margin:0 4px 9px;
    font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em;
  }
  .projhead .pemoji{font-size:16px}
  .projhead .count{
    margin-left:auto;font-size:12px;color:var(--dim);background:var(--surface-2);
    padding:2px 8px;border-radius:99px;font-weight:600;
  }
  .projhead.needs .count{background:rgba(224,164,88,.16);color:var(--waiting)}

  .rowwrap{display:flex;align-items:stretch;gap:8px}
  .rowwrap .pane{flex:1;min-width:0}
  .moves{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
  .moves button{
    width:44px;flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--muted);font:600 16px var(--ui);cursor:pointer;
  }
  .moves button:disabled{opacity:.35}

  h2.section{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    margin:20px 4px 9px;font-weight:600;
  }
  h2.section .count{
    font-size:12px;color:var(--dim);background:var(--surface-2);
    padding:1px 7px;border-radius:99px;font-weight:600;letter-spacing:0;
  }
  h2.section:first-child{margin-top:4px}

  .msg{margin-bottom:18px}
  .msg.mine .bubble{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;
  }
  .msg.mine.pendingmsg .bubble{opacity:.72;border-style:dashed}
  .msg.mine .who .when{color:var(--dim)}
  .who{
    display:flex;align-items:baseline;gap:8px;
    font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:6px;font-weight:600;
  }
  .who .when{text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim)}
  .msg.user .bubble{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;
  }
  .msg.assistant .bubble{padding:0 2px;font-size:15.5px;line-height:1.55;color:var(--text)}
  .bubble{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .richbubble{white-space:normal}
  .rich > *{margin:0 0 10px}
  .rich > *:last-child{margin-bottom:0}
  .rich p{white-space:pre-wrap}
  .rich ul, .rich ol{padding-inline-start:22px}
  .rich li{margin:0 0 4px}
  .rich h4{font-size:15.5px;font-weight:600;margin-top:14px}
  .rich hr{border:0;border-top:1px solid var(--line)}
  .rich a{color:var(--accent)}
  .rich code{
    font-family:var(--mono);font-size:.88em;background:var(--surface-2);
    border:1px solid var(--line);border-radius:5px;padding:0 4px;
  }
  .rich pre{
    font-family:var(--mono);font-size:12.5px;line-height:1.45;background:#0f0f0e;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch;
  }
  .rich pre code{background:none;border:0;padding:0;font-size:inherit}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  /* Words never split mid-word; a wide table scrolls sideways instead, the way
     chat apps show tables on a phone. */
  .rich table{border-collapse:collapse;width:max-content;min-width:100%;font-size:14px;line-height:1.4}
  .rich th, .rich td{
    padding:8px 10px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line);
    overflow-wrap:normal;word-break:normal;min-width:4.5em;max-width:15em;unicode-bidi:isolate;
  }
  .rich td code{white-space:nowrap}
  @media (max-width:640px){
    .stacked{border:0;overflow:visible}
    .stacked table{width:100%;min-width:0}
    .stacked thead{display:none}
    .stacked tr{
      display:block;margin:0 0 10px;padding:10px 12px;
      background:var(--surface);border:1px solid var(--line);border-radius:10px;
    }
    .stacked td{display:block;max-width:none;min-width:0;padding:3px 0;border:0;overflow-wrap:break-word}
    .stacked td:has(> div:empty){display:none}
    .stacked td::before{
      content:attr(data-label);display:block;
      font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;
    }
    .stacked td:first-child{font-weight:600}
  }
  .rich code{unicode-bidi:plaintext}
  .rich th{background:var(--surface-2);font-weight:600;white-space:nowrap}
  .rich tr:last-child td{border-bottom:0}
  .tool{
    font-family:var(--mono);font-size:13px;color:var(--muted);
    background:transparent;border:0;border-left:2px solid #33332e;
    border-radius:0;padding:5px 0 5px 11px;margin:0 0 4px 2px;
    overflow-x:auto;white-space:nowrap;
  }
  .tool b{color:var(--muted);font-weight:500}
  .tool + .tool{margin-top:-2px}
  .msg + .tool{margin-top:10px}
  .tool + .msg{margin-top:14px}
  .pending{border-left-color:var(--working);color:var(--working)}
  .pending b{color:var(--working)}
  .empty{color:var(--dim);text-align:center;padding:48px 24px;font-size:14px}

  .earlier, .start{overflow-anchor:none}
  .earlier{
    display:block;width:100%;min-height:44px;margin:0 0 14px;
    border:1px solid var(--line);border-radius:12px;background:var(--surface);
    color:var(--muted);font:600 13px var(--ui);cursor:pointer;
  }
  .earlier:disabled{opacity:.6}
  .start{text-align:center;color:var(--dim);font-size:12.5px;margin:0 0 14px}

  /* The terminal's own screen. Menus an agent draws live only here. */
  .note{
    color:var(--muted);font-size:12.5px;line-height:1.4;
    margin:0 0 10px;padding:9px 11px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
  }
  .screen{
    font-family:var(--mono);font-size:12px;line-height:1.45;color:var(--text);
    background:#0f0f0e;border:1px solid var(--line);border-radius:12px;
    padding:12px;margin:0 0 12px;white-space:pre;overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .modeswitch{
    display:flex;gap:2px;padding:3px;border-radius:10px;flex:none;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .modeswitch button{
    min-width:56px;min-height:44px;padding:0 10px;border:0;border-radius:7px;
    background:transparent;color:var(--muted);font:600 12px var(--ui);cursor:pointer;
  }
  .modeswitch button[aria-pressed="true"]{background:var(--accent);color:#191512}

  /* The row that carries the view switch: always on screen, above the
     keyboard, because a sticky header is not reachable once a phone keyboard
     is open. */
  .toolrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .toolrow .keys{margin:0;flex:1;min-width:0}

  .composer{
    flex:none;z-index:6;background:var(--bg);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:flex-end;
    max-width:720px;width:100%;margin:0 auto;
  }
  .composer textarea{
    /* The stack around it is the flexible one; the box sets its own height as
       you type, so it must not be stretched to fit. */
    flex:none;width:100%;resize:none;min-height:44px;max-height:140px;
    padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font:16px/1.4 var(--ui);
  }
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer .attach{
    flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .composer input[type=file]{display:none}

  .attached{
    display:flex;align-items:center;gap:8px;margin:0 0 8px;
    padding:5px 5px 5px 8px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);
  }
  .attached img{width:30px;height:30px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2)}
  .attached img:not([src]){display:none}
  /* `display:flex` above beats the hidden attribute, which left an empty box
     sitting above the reply row with nothing in it. */
  .attached[hidden]{display:none}
  .attached .name{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attached button{
    flex:none;width:44px;height:44px;border:0;border-radius:8px;background:transparent;
    color:var(--muted);font-size:17px;cursor:pointer;
  }
  .composer .stack{flex:1;min-width:0;display:flex;flex-direction:column}

  /* The characters a phone keyboard hides behind two taps, and the keys a
     terminal needs. One tap each. */
  .keys{
    display:none;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .composer.typing .keys,
  .composer.always .keys{display:flex}
  .keys::-webkit-scrollbar{display:none}
  .keys button{
    flex:none;min-width:44px;height:44px;padding:0 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--surface);
    color:var(--text);font:600 15px var(--mono);cursor:pointer;
  }
  .keys button.wide{font-family:var(--ui);font-size:13px}
  .keys button:active{background:var(--surface-2)}

  /* The command list, the way an agent shows it: above what you are typing,
     narrowing as you go. */
  .cmdlist{
    max-height:44vh;overflow-y:auto;margin:0 0 8px;padding:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    -webkit-overflow-scrolling:touch;
  }
  .cmdlist[hidden]{display:none}
  .cmdlist button{
    display:block;width:100%;text-align:left;min-height:52px;padding:9px 12px;
    border:0;border-radius:9px;background:transparent;color:var(--text);
    font:inherit;cursor:pointer;
  }
  .cmdlist button:active{background:var(--surface-2)}
  .cmdlist .cmd{font-family:var(--mono);font-size:14.5px;color:var(--accent)}
  .cmdlist .what{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:3px;
    overflow:hidden;
  }
  .cmdlist .path{font-family:var(--mono);font-size:14px;color:var(--text)}
  .cmdlist .dir{color:var(--muted)}
  .cmdlist .hint{padding:12px;color:var(--muted);font-size:13px;line-height:1.45}
  .cmdlist .none{padding:14px 12px;color:var(--dim);font-size:13.5px}
  /* Desktop: a compact one-line-per-command popover, not the phone's tall list. */

<noscript><p style="padding:24px;text-align:center;color:#9a9993">TermControl needs JavaScript to show your terminals.</p></noscript>

<script type="module">

const shortTask=text=>{let t=String(text||'').replace(/\s+/g,' ').trim();if(!t)return '';if(/^(?:Read|Open)\s+\//i.test(t))return ui('Continuing from a handoff','ממשיך מהעברה');t=t.replace(/^[-–•*>\s]+/,'').replace(/\/[\w.\-\/]{6,}/g,'').replace(/\s+/g,' ').trim();let first=t.split(/(?<=[.!?:])\s/)[0]||t;if(first.length<20&&first.endsWith(':'))first=t;return first.length>46?first.slice(0,44).replace(/\s+\S*$/,'')+'…':first;};

const chatGestureExcluded=target=>!target?.closest || Boolean(target.closest('.composer,button,a,input,textarea,select,summary,details,.askbox,pre,code,.tablewrap,.screen,[contenteditable]'));

const continuationEnvelope=text=>/^Read \/[^\n]+\/HANDOFF[^\n/]*\.md\. It is a handoff from the previous instance: continue exactly where it left off\. First confirm what you understood: quote the newest messages and the first next step in full\. Do that first step before any side investigation: a failing test or odd finding on the way is a sub-step of it, never a replacement for it\.$/.test(String(text || '').trim());
const secondaryEvent=event=>event.kind==='tool' || (event.kind==='notice' && event.technical===true) || (event.kind==='user' && continuationEnvelope(event.text));
function conversationHtml(events,renderMessage){
  const out=[];let activity=[];
  const flush=()=>{if(!activity.length)return;const first=activity[0],key=`${first.kind}:${first.at || ''}:${first.text || first.summary || ''}`;out.push(`<details class="activity-details" data-detail-key="${esc(key)}"><summary>${ui('Details','פרטים')} <small>${esc(activity.length)}</small></summary>${activity.map(event=>renderMessage(event.kind==='tool'?{...event,text:[event.name,event.summary,event.text].filter(Boolean).join('\n')}:event)).join('')}</details>`);activity=[];};
  for(const event of events){if(secondaryEvent(event)){activity.push(event);continue;}flush();out.push(renderMessage(event));}flush();return out.join('');
}

const teammateHandoff=text=>{const t=String(text || '');let m=/^\[Message from the agent in "([^"]*)" terminal \(([^)]*)\), sent through TermFleet\.\] ([\s\S]*?)(?:\n\n\(Answer in this conversation as usual;[^)]*\))?\s*$/.exec(t);if(m)return {project:m[1],id:m[2],body:m[3]};m=/^\[Message from the bot "([^"]*)" \(([^)]*)\), sent through TermFleet\.\] ([\s\S]*?)(?:\n\n\(Answer in this conversation as usual;[^)]*\))?\s*$/.exec(t);return m?{project:m[1],id:m[2],body:m[3],bot:true}:null;};

// Read a reply aloud with the device's own voice (nothing leaves the phone).
function speakableText(text){
  return String(text || '')
    .replace(/```[\s\S]*?```/g,' ')            // code blocks are not worth hearing
    .replace(/`([^`]+)`/g,'$1')
    .replace(/!?\[([^\]]+)\]\([^)]+\)/g,'$1')   // links: keep the words
    .replace(/https?:\/\/\S+/g,'')
    .replace(/^\s*[#>*\-•|]+\s*/gm,'')
    .replace(/[*_~]+/g,'')
    .replace(/\s+/g,' ').trim();
}
main.addEventListener('click',event=>{
  const button=event.target.closest('.speak-message');if(!button)return;
  event.stopPropagation();
  const status=button.closest('.msg')?.querySelector('.copy-status');
  if(!('speechSynthesis' in window)){if(status)status.textContent=ui('Reading aloud is not available on this device.','הקראה אינה זמינה במכשיר הזה.');return;}
  if(speechSynthesis.speaking && button.dataset.speaking==='true'){speechSynthesis.cancel();return;}
  speechSynthesis.cancel();
  const text=speakableText(button.closest('.msg').querySelector('[data-copy-text]').dataset.copyText);
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=/[֐-׿]/.test(text)?'he-IL':'en-US';
  const voice=speechSynthesis.getVoices().find(v=>v.lang?.toLowerCase().startsWith(utterance.lang.slice(0,2)));if(voice)utterance.voice=voice;
  const label=button.innerHTML;
  utterance.onend=utterance.onerror=()=>{button.dataset.speaking='false';button.innerHTML=label;};
  button.dataset.speaking='true';button.innerHTML=`${icon('speaker')}${ui('Stop reading','עצירת ההקראה')}`;
  speechSynthesis.speak(utterance);
});

const readApprovalHistory = (id) => {
  try {
    const entries = JSON.parse(localStorage.getItem(approvalHistoryKey(id)) || '[]');
    return Array.isArray(entries) ? entries.slice(-20) : [];
  } catch {
    return [];
  }
};
const rememberApproval = (id, entry) => {
  const entries = readApprovalHistory(id).filter((item) => item.askId !== entry.askId);
  entries.push(entry);
  try {
    localStorage.setItem(approvalHistoryKey(id), JSON.stringify(entries.slice(-20)));
  } catch {
    // The current chat still records the answer when private storage is unavailable.
  }
  return entries.slice(-20);
};

function openFleetPane(el) {
  const id = el.dataset.id;
  rememberCurrentChat();
  freezeChatOrder(id,el.closest('.fleet-content') || main);
  recordVisit(id);
  const mainRect = main.getBoundingClientRect();
  const paneRect = el.getBoundingClientRect();
  const fleetState = { ...(history.state || {}) };
  delete fleetState.pane;
  fleetState.fleetReturn = {
    id,
    origin: el.classList.contains('attention-review') ? 'review' : 'pane',
    offset: paneRect.top - mainRect.top,
    scrollTop: main.scrollTop,
  };
  history.replaceState(fleetState, '', location.href);
  history.pushState({ pane: id, openedFromAgents: true }, '', '#' + id);
  chat(id);
}

function restoreFleetReturn() {
  const restore = history.state?.fleetReturn;
  if (!restore) return;

  main.scrollTop = Number(restore.scrollTop) || 0;
  const state = { ...(history.state || {}) };
  delete state.fleetReturn;
  history.replaceState(state, '', location.href);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const preferred = restore.origin === 'review' ? '.attention-review' : '.pane';
    const pane = [...main.querySelectorAll(preferred)]
      .find((candidate) => candidate.dataset.id === restore.id);
    if (!pane) return;
    main.scrollTop += pane.getBoundingClientRect().top
      - main.getBoundingClientRect().top
      - Number(restore.offset || 0);
  }));
}

function failedRead(response, route) {
  const error=new Error('TermControl view could not be loaded.');
  error.readStatus=response.status;
  error.readRoute=route;
  error.readRay=(response.headers.get('cf-ray') || '').slice(0,80);
  return error;
}

// A short outage (the bridge restarting for a deploy, the tunnel blinking) is not
// an error to show: keep trying quietly for a minute, then explain.
const TRANSIENT_STATUS=new Set([0,502,503,504,520,521,522,523,524,530]);
let reconnecting={since:0,last:0,tries:0};
const transientRead=error=>TRANSIENT_STATUS.has(Number(error?.readStatus) || 0) && error?.readStatus!==401;
function retryQuietly(error,retry){
  const now=Date.now();
  if(!transientRead(error))return false;
  if(now-reconnecting.last>90000)reconnecting={since:now,last:now,tries:0};
  if(now-reconnecting.since>60000)return false;
  reconnecting.last=now;reconnecting.tries++;
  setTimeout(()=>retry(),Math.min(1000*2**(reconnecting.tries-1),8000));
  return true;
}
function showReadFailure(error, retry) {
  if(retryQuietly(error,retry)){
    sub.textContent=ui('Reconnecting…','מתחבר מחדש…');
    if(!main.querySelector('.reconnecting'))main.innerHTML=`<div class="spin reconnecting" role="status">${ui('Reconnecting…','מתחבר מחדש…')}</div>`;
    return;
  }
  const status=Number(error.readStatus) || 0;
  sub.textContent=status===403?ui('Access refused','הגישה סורבה'):status===401?ui('Sign-in needed','נדרשת התחברות'):ui('View unavailable','התצוגה אינה זמינה');
  const message=status===401?ui('Sign in again to reconnect to TermControl.','יש להתחבר שוב כדי לחזור ל־TermControl.'):
    status===403?ui('Access to TermControl was refused. Open All agents to check the connection.','הגישה ל־TermControl סורבה. פתחו את כל הסוכנים לבדיקת החיבור.'):
    status===404 && error.readRoute==='/api/feed'?ui('This conversation is unavailable. Open All agents to find its current card.','השיחה אינה זמינה. פתחו את כל הסוכנים כדי למצוא את הכרטיס העדכני שלה.'):
    error.name==='TimeoutError'?ui('TermControl is taking too long to load this view.','טעינת התצוגה ב־TermControl מתארכת.'):
    ui('TermControl could not load this view. Try loading again or open All agents.','לא ניתן לטעון את התצוגה ב־TermControl. נסו לטעון שוב או פתחו את כל הסוכנים.');
  const details=[`Time: ${new Date().toISOString()}`,`View: ${error.readRoute || 'current view'}`,status?`HTTP ${status}`:'No HTTP response',focusedPane?`Pane: ${focusedPane}`:'',error.readRay?`Request: ${error.readRay}`:'',seenVersion?`App: ${seenVersion}`:''].filter(Boolean).join('\n');
  main.innerHTML=`<section class="empty read-failure"><p role="status">${esc(message)}</p><div class="read-actions"><button type="button" data-read-retry>${ui('Try loading again','טעינה חוזרת')}</button><button type="button" data-all-agents>${ui('All agents','כל הסוכנים')}</button>${status===401?`<a href="/login">${ui('Sign in','התחברות')}</a>`:''}</div><details class="message-details"><summary>${ui('Connection details','פרטי החיבור')}</summary><pre dir="ltr">${esc(details)}</pre><button type="button" data-copy-read>${ui('Copy connection details','העתקת פרטי החיבור')}</button></details></section>`;
  main.querySelector('[data-read-retry]').onclick=()=>retry();
  main.querySelector('[data-all-agents]').onclick=()=>{history.pushState({},'',location.pathname);fleet();};
  main.querySelector('[data-copy-read]').onclick=async event=>{
    const button=event.currentTarget;
    try{if(!navigator.clipboard?.writeText)throw new Error('unavailable');await navigator.clipboard.writeText(details);button.textContent=ui('Copied','הועתקו');}
    catch{const disclosure=button.closest('details');disclosure.open=true;const range=document.createRange();range.selectNodeContents(disclosure.querySelector('pre'));const selection=getSelection();selection?.removeAllRanges();selection?.addRange(range);button.textContent=ui('Select and copy the details','בחרו והעתיקו את הפרטים');}
  };
}

  if(asPage)return `<section class="health-page" data-key="health-page"><h2>${ui('How your agents are doing','איך הסוכנים מתפקדים')}</h2><div class="health-rows">${kinds.map(row).join('')}</div><p class="health-note">${when}</p><p class="health-note">${h.verdict?'':ui(`The full before-and-after comparison is ready on ${h.checkOn.slice(8)}/${h.checkOn.slice(5,7)}.`,`ההשוואה המלאה תהיה מוכנה ב-${h.checkOn.slice(8)}/${h.checkOn.slice(5,7)}.`)}</p></section>`;

  return `<details class="health-card" data-key="health"${open?' open':''}><summary><span>${ui('How your agents are doing','איך הסוכנים מתפקדים')}</span><span class="health-short">${short}</span></summary><div class="health-rows">${kinds.map(row).join('')}</div><p class="health-note">${when}</p></details>`;
}

// Which models each plan offers (for the settings dialog and the bot header).

function botDialog(existing,data,{only=null}={}){

    <label class="room-field"><span>${ui('Standing rules','כללים קבועים')}</span><textarea name="rules" rows="3" dir="auto" maxlength="4000"></textarea></label>`:`<p class="rooms-empty">${ui('Just give it a name and start talking. From your first chat the bot suggests its own job and rules, and you approve them.','רק תנו שם והתחילו לדבר. מהשיחה הראשונה הבוט יציע את התפקיד והכללים שלו, ואתם תאשרו.')}</p>`}

    <p class="room-error" role="alert"></p>
    <div class="room-actions"><button type="button" class="room-cancel">${ui('Cancel','ביטול')}</button><button type="submit" class="room-create">${existing?ui('Save','שמירה'):ui('Create bot','יצירת בוט')}</button></div></form>`;
  document.body.append(dialog);

  // Radio cards: the backup can never be the same as the main plan.
  const pick=(name,value)=>{const box=[...form.querySelectorAll(`input[name=${name}]`)].find(i=>i.value===value);if(box)box.checked=true;};
  const value=name=>form.querySelector(`input[name=${name}]:checked`)?.value || '';
  const syncBackup=()=>{const main=value('provider') || 'claude';form.querySelectorAll('input[name=fallback]').forEach(i=>{i.disabled=i.value===main;i.closest('.backup-pill').classList.toggle('off',i.disabled);});if(!value('fallback') || value('fallback')===main)pick('fallback',main==='claude'?'codex':'claude');};
  // The model list follows the chosen plan; "Default" keeps the plan's own default.
  const fillModels=keep=>{const main=value('provider') || 'claude',list=(data?.models || botModels)?.[main] || [],sel=form.elements.model;sel.innerHTML=`<option value="">${ui('Default','ברירת מחדל')}</option>`+list.map(m=>`<option value="${esc(m.id)}">${esc(m.label)}</option>`).join('');sel.value=list.some(m=>m.id===keep)?keep:'';sel.closest('.model-field').hidden=!list.length;};
  form.querySelectorAll('input[name=provider]').forEach(i=>{i.onchange=()=>{syncBackup();fillModels('');};});
  pick('provider','claude');

  syncBackup();fillModels(existing?.provider===(value('provider') || 'claude')?existing?.model:'');
  loadBotModels().then(()=>{if(dialog.isConnected)fillModels(form.elements.model.value || (existing?.provider===(value('provider') || 'claude')?existing?.model:''));});

    if(existing){body.id=existing.id;body.job=form.elements.job.value;body.rules=form.elements.rules.value;}
    try{
      const response=await fetch(existing?'/api/bot/update':'/api/bots',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(10000)});

      history.pushState({bot:id},'','#bot:'+id);openBot(id);
    }catch(e){error.textContent=e.message || ui('Could not save the bot.','לא ניתן לשמור את הבוט.');button.disabled=false;}
  };
  dialog.showModal();form.elements.name.focus();
}

// TF-096 part 3: what a bot remembers. It only suggests; what Noam approves guides it.
// One shared skill library (TF-096 part 8): bots suggest a skill from work that
// went well; nothing joins the library until the operator approves it here.
// The bots' browser (TF-096 part 8): a live picture of the Chrome window bots use on
// the PC, and "Teach a task", which records what the operator does there and turns it
// into a suggested skill. Passwords and codes are never recorded.
async function browserDialog(){
  document.querySelector('.room-dialog')?.remove();
  const dialog=document.createElement('dialog');dialog.className='room-dialog browser-dialog';
  document.body.append(dialog);dialog.showModal();
  let tick=null,shotUrl=null,lastState='',chosen=null;
  const stop=()=>{clearInterval(tick);tick=null;if(shotUrl)URL.revokeObjectURL(shotUrl);};
  const close=()=>{stop();dialog.close();dialog.remove();};
  dialog.addEventListener('close',stop);
  const call=async(path,body)=>{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body || {}),signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok)throw Object.assign(new Error(d.error),{data:d});return d;};
  const refreshShot=async()=>{
    const img=dialog.querySelector('.browser-shot');if(!img)return;
    try{const r=await fetch(`/api/browser/shot?t=${Date.now()}${chosen?.pages?.[0]?`&page=${encodeURIComponent(chosen.pages[0].id)}`:''}`,{signal:AbortSignal.timeout(6000)});if(!r.ok)return;const url=URL.createObjectURL(await r.blob());img.src=url;if(shotUrl)URL.revokeObjectURL(shotUrl);shotUrl=url;}catch{}
  };
  const render=async()=>{
    let st;
    try{const r=await fetch('/api/browser',{signal:AbortSignal.timeout(6000)});st=await r.json();}catch{dialog.innerHTML=`<p class="room-error">${ui('Could not reach the PC.','לא ניתן להגיע למחשב.')}</p><div class="room-actions"><button type="button" class="room-cancel">${ui('Close','סגירה')}</button></div>`;dialog.querySelector('.room-cancel').onclick=close;return;}
    // Each bot has its own window (TF-096); pick one to watch, the one waiting for Noam first.
    const wins=st.windows || [];
    chosen=wins.find(w=>w.botId===chosen?.botId) || wins.find(w=>w.takeover) || wins[0] || null;
    const state=`${st.running}|${Boolean(st.teaching)}|${wins.map(w=>`${w.botId}:${w.takeover?.by || ''}:${w.takeover?.ask || ''}`).join(',')}|${chosen?.botId || ''}`;
    const page=chosen?.pages?.[0] || st.pages?.[0];
    if(state===lastState && dialog.querySelector('form')){
      const info=dialog.querySelector('.browser-page');if(info)info.textContent=page?`${page.title || ''} · ${page.url}`:'';
      const live=dialog.querySelector('.teach-steps');if(live && st.teaching)live.textContent=String(st.teaching.steps);
      return;
    }
    lastState=state;
    if(!st.running){
      dialog.innerHTML=`<form><h2>${ui('Bots\' browser','הדפדפן של הבוטים')}</h2><p class="rooms-empty">${ui('A Chrome window on your PC that only bots use, with its own sign-ins. Bots open it when a task needs a website; you can watch it here and take over at the PC.','חלון כרום במחשב שרק הבוטים משתמשים בו, עם התחברויות משלו. הבוטים פותחים אותו כשמשימה צריכה אתר; אפשר לצפות בו כאן ולהשתלט במחשב.')}</p><p class="room-error" role="alert"></p><div class="room-actions"><button type="button" class="room-cancel">${ui('Close','סגירה')}</button><button type="button" class="room-create browser-start">${ui('Open it on the PC','פתיחה במחשב')}</button></div></form>`;
      dialog.querySelector('.room-cancel').onclick=close;
      const startButton=dialog.querySelector('.browser-start');
      startButton.onclick=async()=>{startButton.disabled=true;try{await call('/api/browser/start');lastState='';await render();}catch(e){startButton.disabled=false;dialog.querySelector('.room-error').textContent=e.message;}};
      return;
    }
    const teach=st.teaching
      ?`<p class="teach-live" role="status">${ui('Recording. Do the task in the bots\' browser on your PC.','מקליט. בצעו את המשימה בדפדפן של הבוטים במחשב.')} <span><span class="teach-steps">${st.teaching.steps}</span> ${ui('steps','צעדים')}</span></p>
        <label class="room-field"><span>${ui('Name for this skill','שם לסקיל')}</span><input name="name" dir="auto" maxlength="50" placeholder="weekly-invoice-check" autocomplete="off"></label>
        <label class="room-field"><span>${ui('When should a bot use it?','מתי בוט צריך להשתמש בו?')}</span><textarea name="description" rows="2" dir="auto" maxlength="300"></textarea></label>`
      :`<p class="rooms-empty">${ui('To take over, use the window on your PC: sign in, enter codes, or fix a step. Anything you do there, the bots see.','כדי להשתלט, השתמשו בחלון במחשב: התחברו, הזינו קודים או תקנו צעד. כל מה שתעשו שם, הבוטים רואים.')}</p>`;
    const who=chosen?esc(chosen.botName || ui('This bot','הבוט הזה')):'';
    const windowsBlock=st.teaching || !chosen?''
      :chosen.takeover
        ?`<p class="bw-state" dir="auto">${chosen.takeover.by==='noam'?ui(`You have ${who}'s window. Do what is needed at the PC, then hand it back.`,`החלון של ${who} אצלכם. עשו מה שצריך במחשב, ואז החזירו אותו.`):`${ui(`${who} asks you:`,`${who} מבקש:`)} ${esc(chosen.takeover.ask || '')}`}</p>
          <textarea class="bw-note" name="note" rows="2" dir="auto" maxlength="2000" placeholder="${ui('A short note for the bot, e.g. I logged in','הערה קצרה לבוט, למשל התחברתי')}"></textarea>`
        :`<p class="bw-state" dir="auto">${ui(`${who} is using this window.`,`${who} משתמש בחלון הזה.`)}</p>`;
    const windowActions=st.teaching || !chosen?''
      :chosen.takeover?`<button type="button" class="room-create bw-handback">${ui('Hand back','החזרה לבוט')}</button>`
        :`<button type="button" class="room-cancel bw-takeover">${ui('Take over','השתלטות')}</button>`;
    dialog.innerHTML=`<form><h2>${ui('Bots\' browser','הדפדפן של הבוטים')}</h2>
      ${wins.length>1?`<div class="bw-tabs">${wins.map(w=>`<button type="button" class="bw-tab${w.takeover?' bw-needs':''}" data-bot="${esc(w.botId)}" aria-pressed="${w.botId===chosen?.botId}" dir="auto">${esc(w.botName || w.botId)}</button>`).join('')}</div>`:''}
      <img class="browser-shot" alt="${ui('Live picture of the bots\' browser','תמונה חיה של הדפדפן של הבוטים')}">
      <p class="browser-page" dir="auto">${page?esc(`${page.title || ''} · ${page.url}`):''}</p>
      ${windowsBlock}
      ${st.teaching || !chosen?teach:''}
      <p class="room-error" role="alert"></p>
      <div class="room-actions">${st.teaching
        ?`<button type="button" class="room-cancel teach-discard">${ui('Stop without saving','עצירה בלי שמירה')}</button><button type="submit" class="room-create">${ui('Stop and save as a skill','עצירה ושמירה כסקיל')}</button>`
        :`<button type="button" class="room-cancel">${ui('Close','סגירה')}</button>${windowActions || `<button type="button" class="room-create teach-start">${ui('Teach a task','ללמד משימה')}</button>`}`}</div></form>`;
    const form=dialog.querySelector('form'),error=dialog.querySelector('.room-error');
    refreshShot();
    dialog.querySelectorAll('.bw-tab').forEach(b=>{b.onclick=()=>{chosen=wins.find(w=>w.botId===b.dataset.bot) || chosen;lastState='';render();};});
    const takeButton=dialog.querySelector('.bw-takeover');
    if(takeButton)takeButton.onclick=async()=>{takeButton.disabled=true;try{await call('/api/browser/takeover',{bot:chosen.botId});lastState='';await render();}catch(e){takeButton.disabled=false;error.textContent=e.message;}};
    const backButton=dialog.querySelector('.bw-handback');
    if(backButton)backButton.onclick=async()=>{backButton.disabled=true;const name=chosen.botName || '';try{await call('/api/browser/handback',{bot:chosen.botId,note:form.elements.note?.value || ''});note(ui(`Handed back to ${name}. It continues from there.`,`הוחזר ל${name}. הוא ממשיך משם.`));lastState='';await render();}catch(e){backButton.disabled=false;error.textContent=e.message;}};
    if(st.teaching){
      dialog.querySelector('.teach-discard').onclick=async()=>{try{await call('/api/browser/teach/stop',{save:false});lastState='';await render();}catch(e){error.textContent=e.message;}};
      form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;
        try{const d=await call('/api/browser/teach/stop',{save:true,name:form.elements.name.value,description:form.elements.description.value});note(ui(`Saved "${d.name}" with ${d.steps} steps. Approve it under Skills.`,`"${d.name}" נשמר עם ${d.steps} צעדים. אשרו אותו תחת סקילים.`));lastState='';await render();}
        catch(e){button.disabled=false;error.textContent=e.message;if(e.data?.draft){lastState='';await render();}}};
    }else{
      dialog.querySelector('.room-cancel:not(.bw-takeover)').onclick=close;
      const teachButton=dialog.querySelector('.teach-start');
      if(teachButton)teachButton.onclick=async()=>{teachButton.disabled=true;try{await call('/api/browser/teach/start');lastState='';await render();}catch(e){teachButton.disabled=false;error.textContent=e.message;}};
    }
  };
  dialog.innerHTML=`<p>${ui('Loading…','טוען…')}</p>`;
  await render();
  tick=setInterval(()=>{if(!dialog.isConnected){stop();return;}if(document.hidden)return;render();refreshShot();},2000);
}

async function skillsDialog(){

// Activity (TF-098, after OpenBot's action gateway): what the bot and the terminal agents it
// started did, newest first, with the approval recorded for that exact action. Record only. A
// post, send, delete or spend with no recorded approval is shown in red.
async function botActivityDialog(id,name){
  document.querySelector('.room-dialog')?.remove();
  const dialog=document.createElement('dialog');dialog.className='room-dialog act-dialog';dialog.setAttribute('aria-label',ui(`What ${name} did`,`מה ${name} עשה`));
  document.body.append(dialog);dialog.showModal();
  dialog.addEventListener('close',()=>dialog.remove());
  let only=null;
  const day=at=>{const d=new Date(at),t=new Date();const y=new Date(t);y.setDate(t.getDate()-1);return d.toDateString()===t.toDateString()?ui('Today','היום'):d.toDateString()===y.toDateString()?ui('Yesterday','אתמול'):d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});};
  const hm=at=>new Date(at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const what=a=>a.kind==='files' && a.count>1?ui(`${a.text} (${a.count} changes${a.files?.length?`: ${a.files.join(', ')}`:''})`,`${a.text} (${a.count} שינויים)`):a.kind==='files' && a.files?.length?`${a.text} (${a.files.join(', ')})`:a.text;
  const render=async()=>{

function reportPush(step,error){try{fetch('/api/push/report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({step,error:String(error?.message || error || ''),standalone:matchMedia('(display-mode: standalone)').matches,ua:navigator.userAgent.slice(0,160)})});}catch{}}
async function enableNotifications({quiet=false}={}){
  let step='support';

    if(!pushSupported())throw new Error(ui('This browser cannot show notifications. On iPhone, add TermControl to the home screen (Share, then Add to Home Screen), open it from there, and tap this again.','הדפדפן הזה לא יכול להציג התראות. באייפון, הוסיפו את TermControl למסך הבית (שיתוף ← הוספה למסך הבית), פתחו משם והקישו שוב.'));

    // then say where to switch it on, instead of claiming it was blocked.
    const where=matchMedia('(display-mode: standalone)').matches
      ?ui('Long-press the TermControl icon on your home screen, open App info, then Notifications, and switch them on.','לחצו לחיצה ארוכה על סמל TermControl במסך הבית, פתחו "פרטי האפליקציה", ואז "התראות", והפעילו.')

    if(permission==='default')throw new Error(ui('Your phone hid the allow question. ','הטלפון הסתיר את שאלת האישור. ')+where);

      const response=await fetch('/api/rooms/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});if(response.ok){history.pushState({},'',location.pathname);fleet();}else note(ui('The room could not be deleted.','לא ניתן למחוק את החדר.'),true);};
    const chips=bar.querySelector('.room-mentions');

    if(chips.dataset.html!==chipHtml){chips.dataset.html=chipHtml;chips.innerHTML=chipHtml;chips.querySelectorAll('button').forEach(button=>{button.onclick=()=>{const tag='@'+button.dataset.handle+' ';if(!field.value.includes(tag))field.value=(tag+field.value).trimEnd()+' ';field.focus();grow();};});}
    const waiting=members.filter(m=>m.waiting);
    const html=(room.messages.length?room.messages.map(m=>roomMessageHtml(m,members)).join(''):`<div class="empty">${ui('Nobody has written here yet. Mention an agent with @, or write to everyone.','עוד לא נכתב כאן דבר. פנו לסוכן עם @, או כתבו לכולם.')}</div>`)
      +(waiting.length?`<div class="room-working" role="status"><span class="room-busy"><i></i><i></i><i></i></span>${esc(waiting.map(m=>'@'+m.handle).join(', '))} ${ui('working on it','עובדים על זה')}</div>`:'');
    if(html!==signature && !main.querySelector('.message-menu[open]')){signature=html;main.innerHTML=`<div class="room-feed">${html}</div>`;if(following)main.scrollTop=main.scrollHeight;}
  };
  await render();
  if(mine===view)timer=setInterval(render,3000);
}

// What a chat is about: its own name if it has one, else its task, else its project.
function paneHeadline(p){
  const session=p?.sessionAuthority?p.sessionViewV2:null;
  const task=session?(session.task?.label || session.now?.label || ''):technicalTask(p?.task)?ui('Continuing from a handoff','ממשיך מהעברה'):shortTask(p?.task) || '';
  const named=p?.profile?.name || p?.title || p?.name || '',projectName=projectLabel(p?.project);
  return {headline:named && named!==p?.project && named!==projectName?named:task || projectName,task,projectName,job:p?.profile?.job || ''};
}
function card(p) {
  const session=p.sessionAuthority?p.sessionViewV2:null;
  const state=avatarState(p),stalled=state==='working' && p.stalledForMs,label=stalled?ui(`No activity ${stallAge(p.stalledForMs)}`,`ללא פעילות ${stallAge(p.stalledForMs)}`):({producing:ui('Working','עובד'),working:ui('Working','עובד'),'needs-you':ui('Needs you','נדרש מענה'),idle:ui('Idle','פנוי'),exited:ui('Exited','הסתיים')})[state];
  const task=session?(session.task?.label || session.now?.label || ''):technicalTask(p.task)?ui('Continuing from a handoff','ממשיך מהעברה'):shortTask(p.task) || '';
  const named=p.profile?.name || p.title || p.name || '',projectName=projectLabel(p.project);
  // The project is the group heading, so the row is named by what this chat is about.
  const headline=named && named!==p.project && named!==projectName?named:task || projectName;
  const latest=p.sessionViewV2?.now,said=latest && !latest.stale && !/^Using\s/.test(latest.label || '')?String(latest.label || '').trim():'';
  const detail=said && said!==headline?said:headline===task?(p.profile?.job || ''):task || p.profile?.job || '';
  const at=localStorage.getItem('termcontrol-sort')==='recent'?p.lastUsedAt:(p.lastActiveAt || p.updatedAt);
  const active=['working','producing','needs-you'].includes(state) || stalled;
  const unread=hasNewAnswer(p,active);
  const kind=stalled?'stalled':state==='producing'?'working':state==='exited'?'idle':state==='idle' && unread?'done':state;
  const words=state==='exited'?label:kind==='done'?ui('Done','הסתיים'):state==='idle'?ui('Idle','פנוי'):label;
  const memory=p.contextPercent>=60?`<span class="memfill${p.contextPercent>=80?' high':''}">${ui(`memory ${p.contextPercent}%`,`זיכרון ${p.contextPercent}%`)}</span>`:'';
  return `<button type="button" class="pane ${p.turn || 'idle'}${stalled?' stalled':''}${unread?' unread':''}" data-id="${esc(p.id)}" data-key="pane:${esc(p.id)}" data-state="${stalled?'stalled':state}" aria-label="${esc(headline)}, ${esc(projectName)}, ${esc(p.provider)}, ${label}${unread?', '+ui('new answer','תשובה חדשה'):''}">${avatar(p)}<span class="pane-copy"><span class="row1"><span class="project" dir="auto">${esc(headline)}</span><span class="when">${at?shortWhen(at):''}</span><span class="pane-more" aria-hidden="true" title="${ui('More','עוד')}">⋯</span>${unread?`<span class="unread-dot" title="${ui('New answer','תשובה חדשה')}"></span>`:''}</span><span class="row2">${stateChip(kind,words)}${detail?'':`<span class="provider">${esc(p.provider)}</span>`}${detail?`<span class="task" dir="auto">${esc(detail)}</span>`:''}${memory}</span></span></button>`;
}

async function answerTermAsk(button){

  box.dataset.sending='1';const out=box.querySelector('.askresult'),label=button.textContent;
  box.querySelectorAll('[data-term-choice]').forEach(x=>x.disabled=true);out.textContent=ui('Sending to the terminal…','שולח למסוף…');
  let r;try{const sent=await fetch('/api/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pane:box.dataset.pane,askId:box.dataset.ask,choice:button.dataset.termChoice}),signal:AbortSignal.timeout(10000)});r=await sent.json();}
  catch{r={error:ui('Delivery is unconfirmed. Check the terminal before trying again.','המסירה לא אושרה. בדקו במסוף לפני ניסיון נוסף.'),uncertain:true};}
  delete box.dataset.sending;
  if(r.ok){termAskDone[box.dataset.termAsk]=ui(`Sent "${label}" to the terminal.`,`"${label}" נשלח למסוף.`);out.textContent=termAskDone[box.dataset.termAsk];return;}

function mountComposer(id, onSent, onMode, view = () => 'chat', hasDesk = false, agentName = 'Agent') {

    <details class="composer-menu"><summary aria-label="${ui('Attachments, voice and views','צירוף תמונה, קול ותצוגות')}" title="${ui('Composer tools','כלי ההודעה')}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14 M5 12h14"/></svg></summary><div class="composer-menu-panel">

        <button type="button" data-ins="$" aria-label="Dollar">$</button>
        <button type="button" data-ins="-" aria-label="Dash">-</button>

  const cmdlist = bar.querySelector('.cmdlist');

  async function loadCommands() {
    if (commands) return commands;
    const r = await fetch(`/api/commands?pane=${encodeURIComponent(id)}`)
      .then((x) => x.json()).catch(() => ({}));
    commands = r.commands || [];
    return commands;
  }

  async function showCommands(typed) {
    const list = await loadCommands();
    const query = typed.slice(1).toLowerCase();
    const matches = list
      .filter((c) => c.name.toLowerCase().includes(query))
      .sort((a, b) => {
        const aStarts = a.name.toLowerCase().startsWith(query) ? 0 : 1;
        const bStarts = b.name.toLowerCase().startsWith(query) ? 0 : 1;
        return aStarts - bStarts || a.name.localeCompare(b.name);
      })
      .slice(0, 40);

    cmdlist.hidden = false;
    cmdlist.innerHTML = matches.length
      ? matches.map((c) => `<button type="button" data-cmd="${esc(c.name)}">
            <span class="cmd">/${esc(c.name)}</span>

        hideCommands();
        box.focus();
        sync();
      };

  // Files in this terminal's project, for "@". Typing a path on a phone is
  // miserable; picking one is not.
  async function showFiles(typed) {
    const query = typed.slice(typed.lastIndexOf('@') + 1);
    const r = await fetch(`/api/files?pane=${encodeURIComponent(id)}&q=${encodeURIComponent(query)}`)
      .then((x) => x.json()).catch(() => ({}));
    const files = r.files || [];

    cmdlist.hidden = false;
    cmdlist.innerHTML = files.length
      ? files.map((f) => {
          const cut = f.lastIndexOf('/');
          const dir = cut > 0 ? f.slice(0, cut + 1) : '';

          return `<button type="button" data-file="${esc(f)}">
              <span class="path"><span class="dir">${esc(dir)}</span>${esc(name)}</span>
            </button>`;
        }).join('')
      : '<div class="none">No file matches that.</div>';

    cmdlist.querySelectorAll('[data-file]').forEach((el) => {
      el.onclick = () => {
        const at = box.value.lastIndexOf('@');
        box.value = `${box.value.slice(0, at)}@${el.dataset.file} `;
        hideCommands();
        box.focus();
        sync();
      };
    });
  }

  // A leading "!" runs the rest in the shell, so say so rather than leaving it
  // to be discovered.
  function showShellHint() {
    cmdlist.hidden = false;
    cmdlist.innerHTML = '<div class="hint">Starting with <b>!</b> runs the rest as a shell command in this terminal.</div>';

    cmdlist.hidden = true;

    nameEl.textContent = `${label} · ${Math.max(1, Math.round(prepared.size / 1024))} KB`;
    sync();
  };

  const shrink = shrinkPicture;

    if (preview.src) URL.revokeObjectURL(preview.src);

  bar.querySelector('.paste-image').onclick = async () => {

        : ui('This browser cannot paste pictures here. Pick the picture from your gallery.', 'הדפדפן לא יכול להדביק תמונות כאן. בחרו את התמונה מהגלריה.'), 'refused-' + (e.name || 'error'));

  const resetMic = () => { recorder = null; stoppedAt = null; phase = 'idle'; mic.disabled = false; mic.classList.remove('rec', 'busy'); };
  const cancelVoice = () => {
    if (disposed) return;

    if (recorder) { recorder.onstop = recorder.onerror = recorder.ondataavailable = null; if (recorder.state !== 'inactive') try { recorder.stop(); } catch {} }

    if (!window.isSecureContext) return note(ui('Voice needs HTTPS on your phone. Open the secure TermControl address.', 'הקלדה בקול בטלפון דורשת HTTPS. פתחו את הכתובת המאובטחת של TermControl.'), true);
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return note(ui('Voice recording is not supported in this browser.', 'הקלטה בקול אינה נתמכת בדפדפן הזה.'), true);
    phase = 'requesting';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (disposed || !bar.isConnected) { releaseStream(); return; }
      const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find((type) => MediaRecorder.isTypeSupported?.(type));
      const chunks = [], rec = recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onerror = () => { rec.onstop = null; if (rec.state !== 'inactive') try { rec.stop(); } catch {} releaseStream(); resetMic(); note(ui('Recording failed. Try another browser.', 'ההקלטה נכשלה. נסו דפדפן אחר.'), true); };
      rec.onstop = async () => {
        releaseStream(); recorder = null;
        if (disposed || !bar.isConnected) return;

        transcribeAbort = new AbortController();
        const timeout = setTimeout(() => transcribeAbort?.abort(), 180000);
        try {
          const type = rec.mimeType || chunks.find((c) => c.type)?.type || 'application/octet-stream';
          const audio = new Blob(chunks, { type });

          const requestedAt = performance.now();
          const r = await fetch('/api/transcribe', { method: 'POST', headers: { 'content-type': type }, body: audio, signal: transcribeAbort.signal });
          const d = await r.json();
          // Content-free diagnostics for the last 20 clips, including phone/network
          // time absent from server timings. Never retain audio or the returned words.
          const timing = { clientMs: Math.round(performance.now() - requestedAt), status: r.status };
          if (Number.isFinite(stoppedAt)) {

          if (disposed || !bar.isConnected) return;

          box.value = before.slice(0, at) + gap + d.text + before.slice(box.selectionEnd ?? at);

        } catch (e) { if (!disposed) note(e.name === 'AbortError' ? ui('Transcription took too long. Try a shorter recording.', 'התמלול ארך זמן רב מדי. נסו הקלטה קצרה יותר.') : e.message, true); }
        finally { clearTimeout(timeout); transcribeAbort = null; resetMic(); }
      };
      rec.start(); phase = 'recording'; mic.classList.add('rec');
      // Load while the owner speaks, using the previous dictation language rather
      // than guessing from the UI. A first clip only warms the detector. The clip
      // itself still uses automatic Hebrew/English detection.

      try { previousLanguage = localStorage.getItem('termcontrol-dictation-language'); } catch {}

        : ui('Voice recording failed in this browser. Try another browser.', 'ההקלטה נכשלה בדפדפן הזה. נסו דפדפן אחר.');

    try{
    btn.disabled = true;

  };

  const paintSwitch = () => {

  });
}

/** Upload with real progress, so a slow connection looks slow rather than stuck. */
// Phone photos are huge; sending one raw over mobile data is what makes an upload look
// stuck. Shrink it first; the caller falls back to the original if it cannot be decoded.
async function shrinkPicture(blob, max = 1600) {
  if (!/^image\//.test(blob.type) || blob.size < 400 * 1024) return blob;
  const bitmap = await createImageBitmap(blob);
  const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
  if (scale === 1 && blob.size < 2 * 1024 * 1024) { bitmap.close?.(); return blob; }
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  const smaller = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85));
  return smaller && smaller.size < blob.size ? smaller : blob;
}

function upload(form, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.timeout = 120000;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress?.(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText || '{}'); } catch { /* ignore */ }
      if (xhr.status === 200) resolve(body);
      else reject(new Error(body.error || 'The image was refused.'));
    };
    xhr.onerror = () => reject(new Error('Could not reach your machine. The image is still here.'));
    xhr.ontimeout = () => reject(new Error('That took too long. The image is still here.'));
    xhr.send(form);
  });
}

function note(text, isError = false) {
  const old = document.querySelector('.sendstate');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'sendstate' + (isError ? ' err' : '');
  el.textContent = text;
  document.body.appendChild(el);
  if (!isError) return el;
  setTimeout(() => el.remove(), 5000);
  return el;
}

// Dictation word fixes (2026-10-21, Noam: "I need a way to fix common words the
// transcription model gets wrong"). One list on the PC for PC and phone; the bridge
// applies it to every dictation. Pick the wrong word in the box, write the right one.
// Same rule as the bridge: a Hebrew word of 3+ letters keeps a one-letter prefix (ו, ה, ב...).
const wordFixPattern = (heard) => new RegExp('(?<![\\p{L}\\p{M}\\p{N}_])(' + (/^[\u0590-\u05FF]/.test(heard.trim()) && heard.trim().length >= 3 ? '[והבלמשכ]{0,2}' : '') + ')' + heard.trim().split(/\s+/).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+') + '(?![\\p{L}\\p{M}\\p{N}_])', 'giu');
function wordFixSheet(box, sync) {
  document.querySelector('.close-sheet')?.remove();
  const picked = box ? box.value.slice(box.selectionStart ?? 0, box.selectionEnd ?? 0).trim() : '';
  const wrap = document.createElement('div'); wrap.className = 'close-sheet word-fix-sheet';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="word-fix-title"><h2 id="word-fix-title">${ui('Fix a word dictation gets wrong', 'תיקון מילה שהתמלול טועה בה')}</h2><p>${ui('From now on every dictation writes it the right way.', 'מעכשיו כל הקלדה בקול תכתוב אותה נכון.')}</p>
    <div class="wf-row"><label for="wf-heard">${ui('It wrote', 'נכתב')}</label><input id="wf-heard" dir="auto" maxlength="80" autocomplete="off" value="${esc(picked)}"></div>
    <div class="wf-row"><label for="wf-correct">${ui('It should be', 'צריך להיות')}</label><input id="wf-correct" dir="auto" maxlength="80" autocomplete="off"></div>
    <p class="sheet-result" role="status" aria-live="polite"></p>
    <div class="sheet-actions"><button type="button" data-cancel>${ui('Close', 'סגירה')}</button><button type="button" class="go" data-save>${ui('Always fix this', 'לתקן תמיד')}</button></div>
    <ul class="wf-list" aria-label="${ui('Your word fixes', 'התיקונים שלך')}"></ul></div>`;
  document.body.append(wrap);
  const heard = wrap.querySelector('#wf-heard'), correct = wrap.querySelector('#wf-correct'), out = wrap.querySelector('.sheet-result'), list = wrap.querySelector('.wf-list'), save = wrap.querySelector('[data-save]');
  const done = () => { wrap.remove(); box?.focus(); };
  wrap.querySelector('[data-cancel]').onclick = done;
  wrap.onclick = (e) => { if (e.target === wrap) done(); };
  wrap.onkeydown = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); save.click(); } };
  const show = (fixes) => {
    list.innerHTML = fixes.map((f) => `<li><bdi dir="auto"><s>${esc(f.heard)}</s> → ${esc(f.correct)}</bdi><button type="button" data-heard="${esc(f.heard)}" aria-label="${esc(ui('Stop fixing ' + f.heard, 'להפסיק לתקן את ' + f.heard))}">×</button></li>`).join('');
    list.hidden = !fixes.length;
    list.querySelectorAll('button').forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try { const r = await fetch('/api/word-fixes', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ heard: b.dataset.heard }) }); const d = await r.json(); if (!r.ok) throw new Error(d.error); show(d.fixes); out.textContent = ui('Removed.', 'הוסר.'); }
      catch (e) { b.disabled = false; out.textContent = e.message || ui('Could not reach the PC.', 'אין חיבור למחשב.'); }
    });
  };
  list.hidden = true;
  fetch('/api/word-fixes').then((r) => r.json()).then((d) => show(d.fixes || [])).catch(() => {});
  save.onclick = async () => {
    const h = heard.value.trim(), c = correct.value.trim();
    if (!h || !c) { out.textContent = ui('Write both the wrong word and the right one.', 'כתבו גם את המילה השגויה וגם את הנכונה.'); (h ? correct : heard).focus(); return; }
    save.disabled = true; out.textContent = '';
    try {
      const r = await fetch('/api/word-fixes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ heard: h, correct: c }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      show(d.fixes);
      // Fix it in the message being written too, not only in future dictation.
      if (box) { const next = box.value.replace(wordFixPattern(h), (_, prefix) => prefix + c); if (next !== box.value) { box.value = next; sync?.(); } }
      out.textContent = ui(`Saved. "${h}" will be written "${c}".`, `נשמר. "${h}" ייכתב "${c}".`);
      heard.value = correct.value = ''; heard.focus();
    } catch (e) { out.textContent = e.message || ui('Could not reach the PC.', 'אין חיבור למחשב.'); }
    finally { save.disabled = false; }
  };
  (picked ? correct : heard).focus();
}
function dictationDone(box, sync, fixed) {
  // The words are in the box now: close the tools menu so the box and this note show.
  document.querySelectorAll('.composer-menu[open]').forEach((menu) => { if (!menu.querySelector('.mic.rec')) menu.open = false; });
  const el = note(fixed ? ui(`Fixed ${fixed} word${fixed === 1 ? '' : 's'} from your list.`, fixed === 1 ? 'תוקנה מילה אחת מהרשימה שלך.' : `תוקנו ${fixed} מילים מהרשימה שלך.`) : ui('Wrong word? Select it and fix it.', 'מילה שגויה? סמנו אותה ותקנו.'));
  el.classList.add('dictation-done');
  el.insertAdjacentHTML('beforeend', `<div class="acts"><button type="button" class="go" data-fix>${ui('Fix a word', 'תיקון מילה')}</button></div>`);
  // pointerdown keeps the box's selection: that selection is the word to fix.
  el.querySelector('[data-fix]').onpointerdown = (e) => e.preventDefault();
  el.querySelector('[data-fix]').onclick = () => { el.remove(); wordFixSheet(box, sync); };
  setTimeout(() => el.remove(), 9000);
}

function confirmBusy(message, go) {
  const el = note(message);
  el.innerHTML = `${message}<div class="acts">
    <button type="button" data-no>Wait</button>
    <button type="button" class="go" data-yes>Send now</button></div>`;
  el.querySelector('[data-no]').onclick = () => el.remove();
  el.querySelector('[data-yes]').onclick = () => { el.remove(); go(); };
}

window.addEventListener('popstate', (e) => {
  const ask=document.querySelector('.askbox'),editor=ask?.querySelector('.custom-answer');
  if(ask?.localEditorNavigation){ask.localEditorNavigation=false;return;}
  if(editor && !editor.hidden && !e.state?.answerEditor){ask.closeAnswerEditor(false);return;}
  if(ask && e.state?.answerEditor===ask.dataset.askId){ask.openAnswerEditor(false);return;}
  if(e.state?.inbox || location.hash==='#inbox'){openInbox();return;}
  const botId = e.state?.bot ?? (location.hash.startsWith('#bot:') ? location.hash.slice(5) : null);
  if(botId){openBot(botId);return;}
  const groupId = e.state?.group ?? (location.hash.startsWith('#group:') ? location.hash.slice(7) : null);
  if(groupId){openGroup(groupId);return;}
  const roomId = e.state?.room ?? (location.hash.startsWith('#room:') ? location.hash.slice(6) : null);
  if(roomId){openRoom(roomId);return;}
  const id = e.state?.pane ?? location.hash.slice(1);
  if(id){if(id!==focusedPane)recordVisit(id);chat(id);}else fleet();
});

// Following a link to #<terminal> while the app is already open changes only
// the hash — no navigation, no popstate — so listen for that too.
window.addEventListener('hashchange', () => {
  if(location.hash==='#inbox'){openInbox();return;}
  if(location.hash.startsWith('#room:')){openRoom(location.hash.slice(6));return;}
  if(location.hash.startsWith('#bot:')){openBot(location.hash.slice(5));return;}
  if(location.hash.startsWith('#group:')){openGroup(location.hash.slice(7));return;}
  const id = location.hash.slice(1);
  if(id){if(id!==focusedPane)recordVisit(id);chat(id);}else fleet();
});

const opening = location.hash.startsWith('#room:') || location.hash.startsWith('#bot:') || location.hash.startsWith('#group:') || location.hash==='#inbox' ? '' : location.hash.slice(1);
if(location.hash==='#inbox'){history.replaceState({inbox:true},'',location.hash);openInbox();}
else if(location.hash.startsWith('#room:')){history.replaceState({room:location.hash.slice(6)},'',location.hash);openRoom(location.hash.slice(6));}
else if(location.hash.startsWith('#bot:')){history.replaceState({bot:location.hash.slice(5)},'',location.hash);openBot(location.hash.slice(5));}
else if(location.hash.startsWith('#group:')){history.replaceState({group:location.hash.slice(7)},'',location.hash);openGroup(location.hash.slice(7));}
else if(opening && performance.getEntriesByType('navigation')[0]?.type==='navigate')recordVisit(opening);
if (opening) { history.replaceState({ pane: opening }, '', location.hash); chat(opening); }
else if(!location.hash.startsWith('#room:') && !location.hash.startsWith('#bot:') && !location.hash.startsWith('#group:') && location.hash!=='#inbox') fleet();
</script>
