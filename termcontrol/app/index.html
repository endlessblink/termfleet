<!doctype html>
<html lang="en">
<!-- TermControl: map-owned fleet, native conversation actions, local theme. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#141312">
<title>TermControl</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/app/favicon-32.png">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TermControl">
<style>
  :root{
    color-scheme:dark;
    --bg:#141413; --surface:#1c1c1a; --surface-2:#232320; --line:#2f2f2b;
    --text:#f0eee6; --muted:#9a9993; --dim:#8b8a85;
    --accent:#d97757; --waiting:#e0a458; --working:#7aa2a0; --idle:#63625d;
    --radius:14px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  }
  @supports not (height: 100dvh){ body{height:100vh} }
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);
    font-size:15px;line-height:1.5;overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top);
  }
  header{
    flex:none;z-index:5;background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:56px;
  }
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sub{font-size:12px;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{
    appearance:none;background:none;border:0;color:var(--accent);
    font-size:15px;min-width:56px;min-height:44px;padding:8px 10px;margin:-8px -10px;
    cursor:pointer;font-family:var(--ui);text-align:left;
  }
  main{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    overflow-anchor:auto;
    -webkit-overflow-scrolling:touch;
    padding:12px 12px 20px;max-width:720px;width:100%;margin:0 auto;
  }

  :focus-visible{
    outline:none;
    box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    border-radius:10px;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }

  .pane{
    position:relative;display:block;width:100%;text-align:left;appearance:none;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:8px;color:inherit;font:inherit;
    transition:background .15s ease;
  }
  .pane:active{background:var(--surface-2)}

  .attention-panel{
    margin:0 0 14px;border:1px solid #6b5029;border-radius:var(--radius);
    background:#1e1c17;overflow:hidden;
  }
  .attention-panel summary{
    min-height:48px;padding:11px 14px;display:flex;align-items:center;gap:9px;
    cursor:pointer;list-style:none;color:var(--waiting);font-weight:600;
  }
  .attention-panel summary::-webkit-details-marker{display:none}
  .attention-panel summary::after{
    content:'›';margin-left:auto;color:var(--muted);font-size:20px;line-height:1;
    transform:rotate(90deg);transition:transform .15s ease;
  }
  .attention-panel:not([open]) summary::after{transform:rotate(0)}
  .attention-count{
    min-width:22px;height:22px;padding:0 7px;border-radius:11px;
    display:inline-grid;place-items:center;background:var(--waiting);color:#211a0d;
    font-size:12px;font-weight:700;
  }
  .attention-list{border-top:1px solid #49391f;max-height:42dvh;overflow-y:auto}
  .attention-item{
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
    padding:10px 12px;border-bottom:1px solid #393025;
  }
  .attention-item:last-child{border-bottom:0}
  .attention-copy{min-width:0}
  .attention-project{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attention-reason{
    margin-top:2px;color:var(--muted);font-size:12px;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .attention-review{
    min-width:72px;min-height:44px;padding:9px 13px;border:1px solid #76592d;
    border-radius:10px;background:#2a2216;color:#f2c57c;font:600 13px var(--ui);cursor:pointer;
  }
  .attention-review:active{transform:translateY(1px);background:#352a19}

  /* Waiting: the only card that should stop your thumb. */
  .pane.waiting{
    border-color:#6b5029;
    background:linear-gradient(180deg,#26200f,#1e1c17);
    padding-left:19px;
  }
  .pane.waiting::before{
    content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
    border-radius:0 3px 3px 0;background:var(--waiting);
  }
  .pane.waiting .project{color:#fff}

  /* Idle: present, but quieter than everything above it. */
  .pane.idle{background:transparent;border-color:#262622}
  .pane.idle .project{color:var(--muted);font-weight:500}
  .pane.idle .task{color:var(--dim)}
  .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .emoji{font-size:17px;line-height:1;flex:none}
  .titleEmoji{font-size:15px;margin-right:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.waiting{background:var(--waiting);box-shadow:0 0 0 3px rgba(224,164,88,.16)}
  .dot.working{background:var(--working)}

  /* A terminal that is genuinely producing output right now. The pulse is the
     only motion in the app, and it stops the moment the output does. */
  .dot.producing{
    background:var(--working);
    box-shadow:0 0 0 0 rgba(122,162,160,.55);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 7px rgba(122,162,160,0)}
    100%{box-shadow:0 0 0 0 rgba(122,162,160,0)}
  }
  @media (prefers-reduced-motion: reduce){ .dot.producing{animation:none} }

  /* The terminal's own last line, changing as it prints. */
  .tail{
    display:flex;align-items:center;gap:8px;margin-top:9px;
    font-family:var(--mono);font-size:12px;color:var(--working);
    overflow:hidden;white-space:nowrap;
  }
  .tail .text{overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* A trace of how much output arrived over the last minute. */
  .trace{display:flex;align-items:flex-end;gap:2px;height:14px;flex:none}
  .trace i{
    display:block;width:3px;border-radius:1px;background:var(--working);
    opacity:.5;transition:height .3s ease, opacity .3s ease;
  }
  .trace i.on{opacity:1}

  .headtail{
    display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;
    color:var(--working);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .livemark{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;color:var(--working);
  }
  .livemark.quiet{color:var(--dim);font-weight:500}
  .livemark.gone{color:var(--waiting)}
  .agentstatus{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;color:var(--dim);font-size:12px}
  .agentstatus .workingtime{color:var(--working);font-weight:600}
  .agentstatus .quota{white-space:nowrap}
  .chatstatus:empty{display:none}
  .chatstatus .agentstatus{margin-top:3px;gap:3px 8px;font-size:12px}

  .headlive{
    display:inline-flex;align-items:center;gap:5px;margin-left:8px;
    font-size:12px;font-weight:600;color:var(--working);vertical-align:middle;
  }
  .headlive.quiet{color:var(--dim);font-weight:500}
  .dot.idle{background:var(--idle)}
  .project{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .badge{
    margin-left:auto;font-size:12px;color:var(--dim);font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
  }
  .task{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .task.none{color:var(--dim);font-style:italic}
  .state{
    display:inline-block;margin-top:9px;padding:3px 9px;border-radius:99px;
    font-size:12px;font-weight:600;letter-spacing:.01em;
    background:rgba(224,164,88,.15);color:var(--waiting);
  }
  .runmark{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:12px;font-weight:500;color:var(--working);
  }

  .switch{
    display:flex;gap:2px;padding:3px;margin:2px 2px 14px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line);
  }
  .switch button{
    flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;
    color:var(--muted);font:600 13px var(--ui);cursor:pointer;
  }
  .switch button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}

  /* Sort and activity filters. Chips, not menus: the list refreshes itself and
     would close an open menu. */
  .fleetbar{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
  .fleetbar .chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
  .fleetbar .chips::-webkit-scrollbar{display:none}
  .fleetbar .lbl{flex:none;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;min-width:38px}
  .fleetbar button{
    flex:none;appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
    font:600 12px var(--ui);padding:6px 11px;border-radius:12px;min-height:32px;cursor:pointer;
  }
  .fleetbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#191512}
  .projgroup{margin-bottom:22px}
  .projhead{
    display:flex;align-items:center;gap:8px;margin:0 4px 9px;
    font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em;
  }
  .projhead .pemoji{font-size:16px}
  .projhead .count{
    margin-left:auto;font-size:12px;color:var(--dim);background:var(--surface-2);
    padding:2px 8px;border-radius:99px;font-weight:600;
  }
  .projhead.needs .count{background:rgba(224,164,88,.16);color:var(--waiting)}

  .rowwrap{display:flex;align-items:stretch;gap:8px}
  .rowwrap .pane{flex:1;min-width:0}
  .moves{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
  .moves button{
    width:44px;flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--muted);font:600 16px var(--ui);cursor:pointer;
  }
  .moves button:disabled{opacity:.35}

  h2.section{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    margin:20px 4px 9px;font-weight:600;
  }
  h2.section .count{
    font-size:12px;color:var(--dim);background:var(--surface-2);
    padding:1px 7px;border-radius:99px;font-weight:600;letter-spacing:0;
  }
  h2.section:first-child{margin-top:4px}

  .msg{margin-bottom:18px}
  .msg.mine .bubble{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;
  }
  .msg.mine.pendingmsg .bubble{opacity:.72;border-style:dashed}
  .msg.mine .who .when{color:var(--dim)}
  .who{
    display:flex;align-items:baseline;gap:8px;
    font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:6px;font-weight:600;
  }
  .who .when{text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim)}
  .msg.user .bubble{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;
  }
  .msg.assistant .bubble{padding:0 2px;font-size:15.5px;line-height:1.55;color:var(--text)}
  .bubble{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .richbubble{white-space:normal}
  .rich > *{margin:0 0 10px}
  .rich > *:last-child{margin-bottom:0}
  .rich p{white-space:pre-wrap}
  .rich ul, .rich ol{padding-inline-start:22px}
  .rich li{margin:0 0 4px}
  .rich h4{font-size:15.5px;font-weight:600;margin-top:14px}
  .rich hr{border:0;border-top:1px solid var(--line)}
  .rich a{color:var(--accent)}
  .rich code{
    font-family:var(--mono);font-size:.88em;background:var(--surface-2);
    border:1px solid var(--line);border-radius:5px;padding:0 4px;
  }
  .rich pre{
    font-family:var(--mono);font-size:12.5px;line-height:1.45;background:#0f0f0e;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch;
  }
  .rich pre code{background:none;border:0;padding:0;font-size:inherit}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  /* Words never split mid-word; a wide table scrolls sideways instead, the way
     chat apps show tables on a phone. */
  .rich table{border-collapse:collapse;width:max-content;min-width:100%;font-size:14px;line-height:1.4}
  .rich th, .rich td{
    padding:8px 10px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line);
    overflow-wrap:normal;word-break:normal;min-width:4.5em;max-width:15em;unicode-bidi:plaintext;
  }
  .rich td code{white-space:nowrap}
  @media (max-width:640px){
    .stacked{border:0;overflow:visible}
    .stacked table{width:100%;min-width:0}
    .stacked thead{display:none}
    .stacked tr{
      display:block;margin:0 0 10px;padding:10px 12px;
      background:var(--surface);border:1px solid var(--line);border-radius:10px;
    }
    .stacked td{display:block;max-width:none;min-width:0;padding:3px 0;border:0;overflow-wrap:break-word}
    .stacked td:has(> div:empty){display:none}
    .stacked td::before{
      content:attr(data-label);display:block;
      font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;
    }
    .stacked td:first-child{font-weight:600}
  }
  .rich code{unicode-bidi:plaintext}
  .rich th{background:var(--surface-2);font-weight:600;white-space:nowrap}
  .rich tr:last-child td{border-bottom:0}
  .tool{
    font-family:var(--mono);font-size:13px;color:var(--muted);
    background:transparent;border:0;border-left:2px solid #33332e;
    border-radius:0;padding:5px 0 5px 11px;margin:0 0 4px 2px;
    overflow-x:auto;white-space:nowrap;
  }
  .tool b{color:var(--muted);font-weight:500}
  .tool + .tool{margin-top:-2px}
  .msg + .tool{margin-top:10px}
  .tool + .msg{margin-top:14px}
  .pending{border-left-color:var(--working);color:var(--working)}
  .pending b{color:var(--working)}
  .empty{color:var(--dim);text-align:center;padding:48px 24px;font-size:14px}

  .earlier, .start{overflow-anchor:none}
  .earlier{
    display:block;width:100%;min-height:44px;margin:0 0 14px;
    border:1px solid var(--line);border-radius:12px;background:var(--surface);
    color:var(--muted);font:600 13px var(--ui);cursor:pointer;
  }
  .earlier:disabled{opacity:.6}
  .start{text-align:center;color:var(--dim);font-size:12.5px;margin:0 0 14px}

  /* The terminal's own screen. Menus an agent draws live only here. */
  .note{
    color:var(--muted);font-size:12.5px;line-height:1.4;
    margin:0 0 10px;padding:9px 11px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
  }
  .screen{
    font-family:var(--mono);font-size:12px;line-height:1.45;color:var(--text);
    background:#0f0f0e;border:1px solid var(--line);border-radius:12px;
    padding:12px;margin:0 0 12px;white-space:pre;overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .modeswitch{
    display:flex;gap:2px;padding:3px;border-radius:10px;flex:none;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .modeswitch button{
    min-width:56px;min-height:44px;padding:0 10px;border:0;border-radius:7px;
    background:transparent;color:var(--muted);font:600 12px var(--ui);cursor:pointer;
  }
  .modeswitch button[aria-pressed="true"]{background:var(--accent);color:#191512}

  /* The row that carries the view switch: always on screen, above the
     keyboard, because a sticky header is not reachable once a phone keyboard
     is open. */
  .toolrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .toolrow .keys{margin:0;flex:1;min-width:0}

  .composer{
    flex:none;z-index:6;background:var(--bg);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:flex-end;
    max-width:720px;width:100%;margin:0 auto;
  }
  .composer textarea{
    /* The stack around it is the flexible one; the box sets its own height as
       you type, so it must not be stretched to fit. */
    flex:none;width:100%;resize:none;min-height:44px;max-height:140px;
    padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font:16px/1.4 var(--ui);
  }
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer .attach{
    flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .composer input[type=file]{display:none}

  .attached{
    display:flex;align-items:center;gap:8px;margin:0 0 8px;
    padding:5px 5px 5px 8px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);
  }
  .attached img{width:30px;height:30px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2)}
  .attached img:not([src]){display:none}
  /* `display:flex` above beats the hidden attribute, which left an empty box
     sitting above the reply row with nothing in it. */
  .attached[hidden]{display:none}
  .attached .name{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attached button{
    flex:none;width:44px;height:44px;border:0;border-radius:8px;background:transparent;
    color:var(--muted);font-size:17px;cursor:pointer;
  }
  .composer .stack{flex:1;min-width:0;display:flex;flex-direction:column}

  /* The characters a phone keyboard hides behind two taps, and the keys a
     terminal needs. One tap each. */
  .keys{
    display:none;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .composer.typing .keys,
  .composer.always .keys{display:flex}
  .keys::-webkit-scrollbar{display:none}
  .keys button{
    flex:none;min-width:44px;height:44px;padding:0 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--surface);
    color:var(--text);font:600 15px var(--mono);cursor:pointer;
  }
  .keys button.wide{font-family:var(--ui);font-size:13px}
  .keys button:active{background:var(--surface-2)}

  /* The command list, the way an agent shows it: above what you are typing,
     narrowing as you go. */
  .cmdlist{
    max-height:44vh;overflow-y:auto;margin:0 0 8px;padding:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    -webkit-overflow-scrolling:touch;
  }
  .cmdlist[hidden]{display:none}
  .cmdlist button{
    display:block;width:100%;text-align:left;min-height:52px;padding:9px 12px;
    border:0;border-radius:9px;background:transparent;color:var(--text);
    font:inherit;cursor:pointer;
  }
  .cmdlist button:active{background:var(--surface-2)}
  .cmdlist .cmd{font-family:var(--mono);font-size:14.5px;color:var(--accent)}
  .cmdlist .what{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:3px;
    overflow:hidden;
  }
  .cmdlist .path{font-family:var(--mono);font-size:14px;color:var(--text)}
  .cmdlist .dir{color:var(--muted)}
  .cmdlist .hint{padding:12px;color:var(--muted);font-size:13px;line-height:1.45}
  .cmdlist .none{padding:14px 12px;color:var(--dim);font-size:13.5px}
  /* Desktop: a compact one-line-per-command popover, not the phone's tall list. */
  @media (hover:hover) and (pointer:fine) and (min-width:900px){
    .cmdlist{max-height:264px;padding:6px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);scrollbar-width:thin}
    .cmdlist button{display:flex;align-items:baseline;gap:12px;min-height:34px;padding:6px 10px;border-radius:8px}
    .cmdlist button:hover,.cmdlist button:focus-visible{background:var(--surface-2);outline:0}
    .cmdlist .cmd{flex:none;font:500 13.5px var(--ui);color:var(--accent)}

<body>
<aside id="fleet-side" aria-label="Agents"><div class="side-heading">TermControl <span class="side-count"></span></div><div class="side-content"></div></aside>
<div class="blank-pane"><div><h2>TermControl</h2><p>Select an agent to open the conversation.</p></div></div>
<header role="banner">
  <nav id="nav" aria-label="Back"></nav>
  <div style="min-width:0">
    <h1 id="title">TermControl</h1>
    <div class="sub" id="sub">loading…</div>
    <div class="chatstatus" id="chat-status"></div>
    <div class="routinesline" id="routines-line"></div>
  </div>
<button class="theme-toggle" type="button" aria-label="Switch to light mode"></button>
</header>
<main id="main" role="main" aria-live="polite" aria-relevant="additions text"><div class="spin">loading…</div></main>
<noscript><p style="padding:24px;text-align:center;color:#9a9993">TermControl needs JavaScript to show your terminals.</p></noscript>

<script type="module">
const main = document.getElementById('main');
const routinesLine = document.getElementById('routines-line');
const chromeLocale=localStorage.getItem('termcontrol-language') || (navigator.language.startsWith('he')?'he':'en');
document.documentElement.lang=chromeLocale;document.documentElement.dir=chromeLocale==='he'?'rtl':'ltr';
const ui=(en,he)=>chromeLocale==='he'?he:en;

const noticeSummary=content=>{if(content==='Technical context')return ui('Technical details','פרטים טכניים');const first=content.split('\n')[0];const count=first.match(/Planning check blocked: (\d+) open items/);return count?ui(`${count[1]} planning items need review`,`${count[1]} פריטי תכנון דורשים בדיקה`):/Planning check blocked/i.test(first)?ui('Planning needs review','התכנון דורש בדיקה'):first.slice(0,160);};
const deliveryError=message=>{const errors=[[/request changed|question changed|no longer current/i,'The question changed. Refresh and review it again.','השאלה השתנתה. רעננו ובדקו אותה שוב.'],[/already.*(sent|dispatch)|already answered/i,'An answer has already been sent. Check the terminal.','תשובה כבר נשלחה. בדקו במסוף.'],[/Custom answers are disabled/i,'Custom answers are disabled until this terminal form is verified.','תשובות אישיות מושבתות עד לאימות הטופס הזה.']];const known=errors.find(([pattern])=>pattern.test(message));return known?ui(known[1],known[2]):message;};
const shortTask=text=>{let t=String(text||'').replace(/\s+/g,' ').trim();if(!t)return '';if(/^(?:Read|Open)\s+\//i.test(t))return ui('Continuing from a handoff','ממשיך מהעברה');t=t.replace(/^[-–•*>\s]+/,'').replace(/\/[\w.\-\/]{6,}/g,'').replace(/\s+/g,' ').trim();let first=t.split(/(?<=[.!?:])\s/)[0]||t;if(first.length<20&&first.endsWith(':'))first=t;return first.length>46?first.slice(0,44).replace(/\s+\S*$/,'')+'…':first;};
const technicalTask=text=>/^\s*(?:Read|Open)\s+\/[^\n]+\/HANDOFF[^\n/]*\.md\.?\s*$/i.test(String(text || ''));
let visitNotice=null,focusedPane=null;
// Freeze the rendered fleet order for one traversal; polling never retargets a swipe.
let fleetPaneRecords=new Map(),chatOrder=[],chatNavigationBusy=false,saveChatView=null;
const chatMemories=new Map();
const chatBinding=p=>String(p?.instanceId || p?.sessionId || '');
const chatMemoryKey=id=>{const p=chatOrder.find(p=>p.id===id)||fleetPaneRecords.get(id);return id+':'+chatBinding(p);};
const chatMemory=id=>{const key=chatMemoryKey(id);if(!chatMemories.has(key))chatMemories.set(key,{});return chatMemories.get(key);};
// TF-096: Grok Bot marks a bot with a new result since you last looked. "Seen" is
// this viewer's own mark, set on opening and on leaving a chat (it never reorders
// the list, unlike the shared "last used" time).
const seenKey=id=>'termcontrol-seen:'+id;
function markSeen(id){if(!id)return;try{localStorage.setItem(seenKey(id),String(Date.now()));}catch{}}
function hasNewAnswer(p,active){
  if(active || p.id===focusedPane || !p.alive)return false;
  let seen=0;try{seen=Number(localStorage.getItem(seenKey(p.id))) || 0;}catch{}
  const looked=Math.max(seen,Number(p.lastUsedAt) || 0);
  return looked>0 && Number(p.lastActiveAt || 0)>looked+5000;

// Read a reply aloud with the device's own voice (nothing leaves the phone).
function speakableText(text){
  return String(text || '')
    .replace(/```[\s\S]*?```/g,' ')            // code blocks are not worth hearing
    .replace(/`([^`]+)`/g,'$1')
    .replace(/!?\[([^\]]+)\]\([^)]+\)/g,'$1')   // links: keep the words
    .replace(/https?:\/\/\S+/g,'')
    .replace(/^\s*[#>*\-•|]+\s*/gm,'')
    .replace(/[*_~]+/g,'')
    .replace(/\s+/g,' ').trim();
}
main.addEventListener('click',event=>{
  const button=event.target.closest('.speak-message');if(!button)return;
  event.stopPropagation();

  if(!('speechSynthesis' in window)){if(status)status.textContent=ui('Reading aloud is not available on this device.','הקראה אינה זמינה במכשיר הזה.');return;}
  if(speechSynthesis.speaking && button.dataset.speaking==='true'){speechSynthesis.cancel();return;}
  speechSynthesis.cancel();
  const text=speakableText(button.closest('.msg').querySelector('[data-copy-text]').dataset.copyText);
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=/[֐-׿]/.test(text)?'he-IL':'en-US';
  const voice=speechSynthesis.getVoices().find(v=>v.lang?.toLowerCase().startsWith(utterance.lang.slice(0,2)));if(voice)utterance.voice=voice;
  const label=button.innerHTML;
  utterance.onend=utterance.onerror=()=>{button.dataset.speaking='false';button.innerHTML=label;};
  button.dataset.speaking='true';button.innerHTML=`${icon('speaker')}${ui('Stop reading','עצירת ההקראה')}`;
  speechSynthesis.speak(utterance);
});

  delete state.fleetReturn;

// A short outage (the bridge restarting for a deploy, the tunnel blinking) is not

const TRANSIENT_STATUS=new Set([0,502,503,504,520,521,522,523,524,530]);
let reconnecting={since:0,last:0,tries:0};
const transientRead=error=>TRANSIENT_STATUS.has(Number(error?.readStatus) || 0) && error?.readStatus!==401;
function retryQuietly(error,retry){
  const now=Date.now();
  if(!transientRead(error))return false;
  if(now-reconnecting.last>90000)reconnecting={since:now,last:now,tries:0};
  if(now-reconnecting.since>60000)return false;
  reconnecting.last=now;reconnecting.tries++;
  setTimeout(()=>retry(),Math.min(1000*2**(reconnecting.tries-1),8000));
  return true;
}

async function loadRoutines(paneId){
  let data;

    loadRoutines(paneId);

}

    <label class="room-field"><span>${ui('Job, in a few words','תפקיד, בכמה מילים')}</span><input name="job" dir="auto" maxlength="60" placeholder="${ui('e.g. Owns the phone app','למשל: אחראי על אפליקציית הטלפון')}"></label>

      setTimeout(()=>document.querySelector('.sendstate')?.remove(),2200);

// One inbox: every agent's open question in one list, answered in place.
async function openInbox(){
  rememberCurrentChat();saveChatView=null;clearChatGesture();otherView='inbox';
  document.querySelector('.composer')?.releaseDraft?.();document.querySelector('.composer')?.remove();document.querySelector('.askbox')?.remove();
  const cached=main.querySelector('.fleet-content');if(cached)sideContent.replaceChildren(cached);
  focusedPane=null;const mine=++view;
  clearInterval(timer);clearInterval(fleetTimer);releaseChatScroll?.();releaseChatWake?.();
  document.body.classList.add('chat');
  nav.innerHTML=`<button class="back" aria-label="${ui('All agents','כל הסוכנים')}">${icon('back')}</button>`;
  nav.querySelector('.back').onclick=()=>{history.pushState({},'',location.pathname);fleet();};
  title.textContent=ui('Needs you','דורשים מענה');sub.textContent='';routinesLine.innerHTML='';chatStatus.innerHTML=matchMedia('(pointer:fine)').matches?`<span class="inbox-keys">${ui('J / K move · 1–9 answer · Enter recommended · R reply in words','J / K מעבר · 1–9 מענה · Enter המומלץ · R תשובה במילים')}</span>`:'';
  main.innerHTML='<div class="spin">loading…</div>';
  let signature='',busy=false,focusIndex=0;
  const cards=()=>[...main.querySelectorAll('.inbox-card')];
  const focusCard=i=>{const list=cards();if(!list.length)return;focusIndex=(i+list.length)%list.length;list.forEach((card,n)=>card.classList.toggle('focused',n===focusIndex));list[focusIndex].focus({preventScroll:false});};
  const recommended=ask=>ask.options.find(o=>/recommended|מומלץ/i.test(o.label));
  const cardHtml=item=>{
    const ask=item.ask,name=item.pane.title || item.pane.project;
    const answerable=ask && !ask.multiSelect && ask.stage!=='review' && ask.options.length;
    const opts=answerable?ask.options.map((o,i)=>`<button type="button" data-choice="${esc(o.key)}"${recommended(ask)===o?' class="recommended"':''}><span class="inbox-n">${i+1}</span><span dir="auto">${esc(o.label)}</span></button>`).join(''):'';
    return `<article class="inbox-card" tabindex="0" data-pane="${esc(item.pane.id)}" data-ask="${esc(ask?.id || '')}">
      <div class="inbox-who"><span class="group-color" style="background:${groupColor(item.pane.color)}"></span><bdi dir="auto">${esc(name)}</bdi><span>${esc(item.pane.provider)}</span></div>
      <h3 dir="auto">${esc(ask?.title || ui('Waiting for you','ממתין לך'))}</h3>
      ${opts?`<div class="inbox-opts">${opts}</div>`:`<p class="inbox-note">${ask?.multiSelect?ui('Pick several in the chat.','בחירה מרובה בשיחה.'):ui('Answer this in the chat.','יש לענות בשיחה.')}</p>`}
      <div class="inbox-foot"><a href="#${esc(item.pane.id)}" class="inbox-open">${ui('Open chat','פתיחת השיחה')}</a><span class="inbox-result" role="status"></span></div></article>`;
  };
  const answer=async(card,choice)=>{
    if(busy)return;busy=true;
    const buttons=card.querySelectorAll('[data-choice]'),result=card.querySelector('.inbox-result');
    buttons.forEach(b=>b.disabled=true);result.textContent=ui('Sending…','שולח…');
    let response;
    try{const sent=await fetch('/api/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pane:card.dataset.pane,askId:card.dataset.ask,choice}),signal:AbortSignal.timeout(12000)});response=await sent.json();if(!sent.ok && !response.error)response={error:ui('The terminal did not acknowledge this answer.','המסוף לא אישר את התשובה.')};}
    catch{response={error:ui('No answer from your machine. Check the chat before answering again.','אין תשובה מהמחשב. בדקו בשיחה לפני מענה נוסף.'),uncertain:true};}
    busy=false;
    if(response.error){result.textContent=deliveryError(response.error);buttons.forEach(b=>b.disabled=Boolean(response.uncertain));return;}
    card.classList.add('answered');result.textContent=ui('Sent ✓','נשלח ✓');
    setTimeout(()=>{signature='';render();},1500);
  };
  const render=async()=>{
    if(busy)return;
    let data;
    try{const r=await fetch('/api/inbox',{signal:AbortSignal.timeout(15000)});data=await r.json();if(!r.ok)throw new Error(data.error);}
    catch(e){if(mine!==view)return;if(!signature)main.innerHTML=`<div class="empty">${esc(e.message || 'Could not load.')}</div>`;return;}
    if(mine!==view)return;
    const items=data.items || [];
    sub.textContent=items.length?ui(`${items.length} waiting`,`${items.length} ממתינים`):'';
    const html=items.length?items.map(cardHtml).join(''):`<div class="empty">${ui('Nothing is waiting for you.','אין מה לענות כרגע.')}</div>`;
    if(html===signature)return;signature=html;
    main.innerHTML=`<div class="inbox">${html}</div>`;
    cards().forEach((card,i)=>{card.onclick=event=>{if(!event.target.closest('a,button'))focusCard(i);};card.querySelectorAll('[data-choice]').forEach(button=>{button.onclick=()=>answer(card,button.dataset.choice);});});
    if(matchMedia('(pointer:fine)').matches)focusCard(Math.min(focusIndex,cards().length-1));
  };
  const onKey=event=>{
    if(mine!==view){document.removeEventListener('keydown',onKey);return;}
    if(event.target.closest?.('input,textarea') || event.ctrlKey || event.metaKey || event.altKey)return;
    const card=cards()[focusIndex];
    if(event.key==='j'||event.key==='ArrowDown'){event.preventDefault();focusCard(focusIndex+1);}
    else if(event.key==='k'||event.key==='ArrowUp'){event.preventDefault();focusCard(focusIndex-1);}
    else if(/^[1-9]$/.test(event.key) && card){const button=card.querySelectorAll('[data-choice]')[Number(event.key)-1];if(button && !button.disabled){event.preventDefault();button.click();}}
    else if(event.key==='Enter' && card){const button=card.querySelector('[data-choice].recommended');if(button && !button.disabled){event.preventDefault();button.click();}}
    else if((event.key==='r'||event.key==='R') && card){event.preventDefault();location.hash=card.dataset.pane;}
  };
  document.addEventListener('keydown',onKey);
  await render();
  if(mine===view)timer=setInterval(render,5000);
}

function healthCardHtml(h,asPage=false){
  if(!h || !h.days?.some(d=>d.said))return asPage?`<section class="health-page" data-key="health-page"><p class="health-note">${ui('Counting… this takes a few minutes the first time.','סופר… בפעם הראשונה זה לוקח כמה דקות.')}</p></section>`:'';
  const kinds=[['lost',ui('Lost track','איבדו את החוט')],['fixed',ui('You corrected them','תיקנתם אותם')],['stuck',ui('Got stuck','נתקעו')]];
  const today=h.days.at(-1),week=h.days.slice(-7),sum=k=>week.reduce((n,d)=>n+d[k],0),said=week.reduce((n,d)=>n+d.said,0);
  const per=k=>said?Math.round(sum(k)/said*1000)/10:0;
  // Plain and quiet: this week's number beside the week before the bots, nothing else.
  const row=([k,label])=>{
    const base=h.baseline.rates?.[k],v=h.verdict?.[k];
    const now=per(k),cls=v?`health-${v}`:'';
    return `<div class="health-row"><span>${label}</span><b class="${cls}">${now}</b><span class="health-was">${ui(`was ${base ?? '–'}`,`היה ${base ?? '–'}`)}</span></div>`;
  };
  const when=ui('Per 100 of your messages, last 7 days. "Was" is the week before the bots.','לכל 100 הודעות שלכם, 7 ימים אחרונים. "היה" = השבוע שלפני הבוטים.');
  if(asPage)return `<section class="health-page" data-key="health-page"><h2>${ui('How your agents are doing','איך הסוכנים מתפקדים')}</h2><div class="health-rows">${kinds.map(row).join('')}</div><p class="health-note">${when}</p><p class="health-note">${h.verdict?'':ui(`The full before-and-after comparison is ready on ${h.checkOn.slice(8)}/${h.checkOn.slice(5,7)}.`,`ההשוואה המלאה תהיה מוכנה ב-${h.checkOn.slice(8)}/${h.checkOn.slice(5,7)}.`)}</p></section>`;
  const open=sessionStorage.getItem('termcontrol-health-open')==='open';
  const short=h.verdict?Object.values(h.verdict).includes('worse')?ui('some things got worse','חלק החמיר'):Object.values(h.verdict).includes('better')?ui('getting better','משתפר'):ui('about the same','בערך אותו דבר'):ui(`comparison on ${h.checkOn.slice(8)}/${h.checkOn.slice(5,7)}`,`השוואה ב-${h.checkOn.slice(8)}/${h.checkOn.slice(5,7)}`);
  return `<details class="health-card" data-key="health"${open?' open':''}><summary><span>${ui('How your agents are doing','איך הסוכנים מתפקדים')}</span><span class="health-short">${short}</span></summary><div class="health-rows">${kinds.map(row).join('')}</div><p class="health-note">${when}</p></details>`;
}

// The bots' browser (TF-096 part 8): a live picture of the Chrome window bots use on

async function browserDialog(){
  document.querySelector('.room-dialog')?.remove();

  document.body.append(dialog);dialog.showModal();
  let tick=null,shotUrl=null,lastState='';
  const stop=()=>{clearInterval(tick);tick=null;if(shotUrl)URL.revokeObjectURL(shotUrl);};
  const close=()=>{stop();dialog.close();dialog.remove();};
  dialog.addEventListener('close',stop);
  const call=async(path,body)=>{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body || {}),signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok)throw Object.assign(new Error(d.error),{data:d});return d;};
  const refreshShot=async()=>{
    const img=dialog.querySelector('.browser-shot');if(!img)return;
    try{const r=await fetch(`/api/browser/shot?t=${Date.now()}`,{signal:AbortSignal.timeout(6000)});if(!r.ok)return;const url=URL.createObjectURL(await r.blob());img.src=url;if(shotUrl)URL.revokeObjectURL(shotUrl);shotUrl=url;}catch{}
  };
  const render=async()=>{
    let st;
    try{const r=await fetch('/api/browser',{signal:AbortSignal.timeout(6000)});st=await r.json();}catch{dialog.innerHTML=`<p class="room-error">${ui('Could not reach the PC.','לא ניתן להגיע למחשב.')}</p><div class="room-actions"><button type="button" class="room-cancel">${ui('Close','סגירה')}</button></div>`;dialog.querySelector('.room-cancel').onclick=close;return;}
    const state=`${st.running}|${Boolean(st.teaching)}`;
    const page=st.pages?.[0];
    if(state===lastState && dialog.querySelector('form')){
      const info=dialog.querySelector('.browser-page');if(info)info.textContent=page?`${page.title || ''} · ${page.url}`:'';
      const live=dialog.querySelector('.teach-steps');if(live && st.teaching)live.textContent=String(st.teaching.steps);
      return;
    }
    lastState=state;
    if(!st.running){
      dialog.innerHTML=`<form><h2>${ui('Bots\' browser','הדפדפן של הבוטים')}</h2><p class="rooms-empty">${ui('A Chrome window on your PC that only bots use, with its own sign-ins. Bots open it when a task needs a website; you can watch it here and take over at the PC.','חלון כרום במחשב שרק הבוטים משתמשים בו, עם התחברויות משלו. הבוטים פותחים אותו כשמשימה צריכה אתר; אפשר לצפות בו כאן ולהשתלט במחשב.')}</p><p class="room-error" role="alert"></p><div class="room-actions"><button type="button" class="room-cancel">${ui('Close','סגירה')}</button><button type="button" class="room-create browser-start">${ui('Open it on the PC','פתיחה במחשב')}</button></div></form>`;
      dialog.querySelector('.room-cancel').onclick=close;
      const startButton=dialog.querySelector('.browser-start');
      startButton.onclick=async()=>{startButton.disabled=true;try{await call('/api/browser/start');lastState='';await render();}catch(e){startButton.disabled=false;dialog.querySelector('.room-error').textContent=e.message;}};
      return;
    }
    const teach=st.teaching
      ?`<p class="teach-live" role="status">${ui('Recording. Do the task in the bots\' browser on your PC.','מקליט. בצעו את המשימה בדפדפן של הבוטים במחשב.')} <span><span class="teach-steps">${st.teaching.steps}</span> ${ui('steps','צעדים')}</span></p>
        <label class="room-field"><span>${ui('Name for this skill','שם לסקיל')}</span><input name="name" dir="auto" maxlength="50" placeholder="weekly-invoice-check" autocomplete="off"></label>
        <label class="room-field"><span>${ui('When should a bot use it?','מתי בוט צריך להשתמש בו?')}</span><textarea name="description" rows="2" dir="auto" maxlength="300"></textarea></label>`
      :`<p class="rooms-empty">${ui('To take over, use the window on your PC: sign in, enter codes, or fix a step. Anything you do there, the bots see.','כדי להשתלט, השתמשו בחלון במחשב: התחברו, הזינו קודים או תקנו צעד. כל מה שתעשו שם, הבוטים רואים.')}</p>`;
    dialog.innerHTML=`<form><h2>${ui('Bots\' browser','הדפדפן של הבוטים')}</h2>
      <img class="browser-shot" alt="${ui('Live picture of the bots\' browser','תמונה חיה של הדפדפן של הבוטים')}">

        :`<button type="button" class="room-cancel">${ui('Close','סגירה')}</button><button type="button" class="room-create teach-start">${ui('Teach a task','ללמד משימה')}</button>`}</div></form>`;
    const form=dialog.querySelector('form'),error=dialog.querySelector('.room-error');
    refreshShot();
    if(st.teaching){
      dialog.querySelector('.teach-discard').onclick=async()=>{try{await call('/api/browser/teach/stop',{save:false});lastState='';await render();}catch(e){error.textContent=e.message;}};

    }else{

      teachButton.onclick=async()=>{teachButton.disabled=true;try{await call('/api/browser/teach/start');lastState='';await render();}catch(e){teachButton.disabled=false;error.textContent=e.message;}};
    }
  };
  dialog.innerHTML=`<p>${ui('Loading…','טוען…')}</p>`;
  await render();
  tick=setInterval(()=>{if(!dialog.isConnected){stop();return;}if(document.hidden)return;render();refreshShot();},2000);
}

    step='permission';
    const permission=quiet?Notification.permission:await Notification.requestPermission();
    if(permission!=='granted')throw new Error(ui('Notifications are blocked for this site in the phone settings.','ההתראות חסומות לאתר הזה בהגדרות הטלפון.'));
    step='worker';
    const reg=await navigator.serviceWorker.register('/sw.js');

    step='save';

  }catch(e){if(!quiet || step!=='support')reportPush(step,e);throw e;}

let fleetQuery='',searchTimer=null;
function applyFleetFilter(container){

function wireFleetSearch(container){
  const input=container.querySelector('.fleet-search'),hits=container.querySelector('.search-hits');
  if(!input || input.dataset.wired)return applyFleetFilter(container);

  input.oninput=()=>{

      hits.innerHTML=(data.hits || []).map(h=>`<button type="button" class="search-hit" data-bot="${esc(h.bot.id)}"><span dir="auto">${esc(h.snippet)}</span><small>${esc(h.bot.name)} · ${esc(h.who==='Noam'?ui('you','אתה'):h.bot.name)}${h.at?' · '+esc(ago(h.at)):''}</small></button>`).join('');

// What a chat is about: its own name if it has one, else its task, else its project.
function paneHeadline(p){
  const session=p?.sessionAuthority?p.sessionViewV2:null;
  const task=session?(session.task?.label || session.now?.label || ''):technicalTask(p?.task)?ui('Continuing from a handoff','ממשיך מהעברה'):shortTask(p?.task) || '';
  const named=p?.profile?.name || p?.title || p?.name || '',projectName=projectLabel(p?.project);
  return {headline:named && named!==p?.project && named!==projectName?named:task || projectName,task,projectName,job:p?.profile?.job || ''};
}
function card(p) {
  const session=p.sessionAuthority?p.sessionViewV2:null;
  const state=avatarState(p),stalled=state==='working' && p.stalledForMs,label=stalled?ui(`No activity ${stallAge(p.stalledForMs)}`,`ללא פעילות ${stallAge(p.stalledForMs)}`):({producing:ui('Working','עובד'),working:ui('Working','עובד'),'needs-you':ui('Needs you','נדרש מענה'),idle:ui('Idle','ממתין'),exited:ui('Exited','הסתיים')})[state];
  const task=session?(session.task?.label || session.now?.label || ''):technicalTask(p.task)?ui('Continuing from a handoff','ממשיך מהעברה'):shortTask(p.task) || '';
  const named=p.profile?.name || p.title || p.name || '',projectName=projectLabel(p.project);
  // The project is the group heading, so the row is named by what this chat is about.
  const headline=named && named!==p.project && named!==projectName?named:task || projectName;
  const latest=p.sessionViewV2?.now,said=latest && !latest.stale && !/^Using\s/.test(latest.label || '')?String(latest.label || '').trim():'';
  const detail=said && said!==headline?said:headline===task?(p.profile?.job || ''):task || p.profile?.job || '';
  const at=localStorage.getItem('termcontrol-sort')==='recent'?p.lastUsedAt:(p.lastActiveAt || p.updatedAt);
  const active=['working','producing','needs-you'].includes(state) || stalled;
  const unread=hasNewAnswer(p,active);
  const memory=p.contextPercent>=60?`<span class="memfill${p.contextPercent>=80?' high':''}">${ui(`memory ${p.contextPercent}%`,`זיכרון ${p.contextPercent}%`)}</span>`:'';
  return `<button type="button" class="pane ${p.turn || 'idle'}${stalled?' stalled':''}${unread?' unread':''}" data-id="${esc(p.id)}" data-key="pane:${esc(p.id)}" data-state="${stalled?'stalled':state}" aria-label="${esc(headline)}, ${esc(projectName)}, ${esc(p.provider)}, ${label}${unread?', '+ui('new answer','תשובה חדשה'):''}">${avatar(p)}<span class="pane-copy"><span class="row1"><span class="project" dir="auto">${esc(headline)}</span><span class="when">${at?shortWhen(at):''}</span>${unread?`<span class="unread-dot" title="${ui('New answer','תשובה חדשה')}"></span>`:''}</span><span class="row2"><span class="state-dot" aria-hidden="true"></span>${active?`<span class="state">${label}</span>`:detail?'':`<span class="provider">${esc(p.provider)}</span>`}${detail?`<span class="task" dir="auto">${esc(detail)}</span>`:''}${memory}</span></span></button>`;
}

async function chat(id,{motion=null,initialFeed=null}={}) {

  document.querySelector('.composer')?.releaseDraft?.();

  sideContent.querySelectorAll('.pane').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));

  nav.querySelector('.back').onclick = () => {if(history.state?.openedFromAgents){history.back();}else{history.pushState({},'',location.pathname);fleet();}};
  for(const step of [-1,1]){const button=document.createElement('button');button.type='button';button.className='chat-step';button.dataset.chatStep=step;button.onclick=()=>navigateChat(step);nav.append(button);}
  nav.setAttribute('aria-label',ui('Chat navigation','ניווט בין שיחות'));paintChatNavigation();
  main.innerHTML = '<div class="spin">loading…</div>';
  chatStatus.innerHTML = '';routinesLine.innerHTML = '';loadRoutines(id);

  let lastSignature = '';
  // A message typed into an agent only turns up in its record once the agent
  // reads it — sometimes a minute later. Until then, show it as yours, marked
  // as on its way, so it never looks like the message vanished.
  let sentQueue = [].concat(remembered.sentQueue || remembered.justSent || []);
  let approvalHistory = readApprovalHistory(id);
  let shown = remembered.shown || 60;                     // how far back this chat is showing
  let mode = remembered.mode || (['screen','today'].includes(sessionStorage.getItem('tc-mode')) ? sessionStorage.getItem('tc-mode') : 'chat');
  let deskDay = null;

  // Follow the newest message until the reader scrolls away from the end.
  // Deciding "are we at the bottom?" afresh on every refresh gets it wrong
  // when a refresh lands while the layout is still settling.
  let following = restorePosition ? remembered.following : true;
  const savedTop=remembered.scrollTop;
  saveChatView=()=>Object.assign(remembered,{scrollTop:main.scrollTop,following,shown,mode,sentQueue});
  const onScroll = () => {
    following = main.scrollHeight - main.scrollTop - main.clientHeight <= 80;
    saveChatView?.();
  };
  main.addEventListener('scroll', onScroll, { passive: true });
  releaseChatScroll?.();
  releaseChatScroll = () => {
    main.removeEventListener('scroll', onScroll);
    releaseChatScroll = null;
  };

  let firstFeed=initialFeed;
  const render = async () => {

      const r = await fetch(`/api/feed?pane=${encodeURIComponent(id)}&limit=${shown}`, {
        signal: AbortSignal.timeout(12000),
      });
      if (!r.ok) throw failedRead(r,'/api/feed');
      d = await r.json();
      }
    } catch (e) {
      if(mine!==view)return;
      if (lastSignature) { chatStatus.innerHTML=`<span class="connection-note" role="status">${ui('Reconnecting…','מתחבר מחדש…')}</span>`; if(transientRead(e))setTimeout(()=>{if(mine===view)render();},2000); return; }
      showReadFailure(e,()=>render());
      return;
    }
    if (mine !== view) return;
    checkVersion(d.version);
    if (d.error) { main.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
    const named=paneHeadline(d.pane);
    title.innerHTML = `<span class="head-avatar" aria-hidden="true">${blobSvg(d.pane,36)}</span><bdi class="chat-project" dir="auto">${esc(named.headline)}</bdi>`
      + (d.producing
          ? '<span class="headlive"><span class="dot producing" aria-hidden="true"></span>live</span>'
          : '<span class="headlive quiet"><span class="dot idle" aria-hidden="true"></span>quiet</span>');
    sub.innerHTML = esc(`${named.job?named.job+' · ':''}${named.projectName} · ${d.pane.provider}`)
      + (d.producing && d.lastLine ? `<span class="headtail">${esc(d.lastLine)}</span>` : '');
    chatStatus.innerHTML = statusHtml(d.pane)+(visitNotice===id?`<span role="status">${ui('Recent order could not be saved.','סדר השיחות האחרונות לא נשמר.')}</span>`:'')+asksHtml(d.asks);
    const preservedAsk=document.querySelector('.askbox');
    const presentAsk=()=>{

      if(preservedAsk?.dataset.askId===d.ask.id && !preservedAsk.isConnected)main.append(preservedAsk);
      mountAsk(id,d.ask,answer=>{approvalHistory=rememberApproval(id,answer);lastSignature='';following=true;return render();},d.answerReceipt || (approvalHistory.find(entry=>entry.askId===d.ask.id)?{state:'sent'}:null));
    };
    const goQuestion=async()=>{if(mode!=='chat')await document.querySelector('[data-mode="chat"]')?.onclick();const question=main.querySelector('.askbox'),pending=document.querySelector('.pending-answer');if(!question){if(pending)pending.textContent=ui('The question changed. Refresh to check.','השאלה השתנתה. רעננו לבדיקה.');return;}if(question.querySelector('.askbody')?.hidden)question.querySelector('.asktoggle')?.click();const target=question.querySelector('[data-choice]:not(:disabled)') || question.querySelector('[data-check-screen]') || question.querySelector('.asktoggle');if(question.querySelector('.receipt'))question.querySelector('.askresult').textContent=ui('Check the terminal before answering again.','בדקו במסוף לפני תשובה נוספת.');if(pending)pending.textContent=ui('Choices shown above','האפשרויות מוצגות למעלה');target?.focus({preventScroll:true});target?.scrollIntoView({block:'center'});};


    if (!document.querySelector('.composer')) {
      mountComposer(
        id,

        },
        (next) => {

          lastSignature = '';
          following = true;
          clearInterval(timer);
          timer = setInterval(render, mode === 'screen' ? 2000 : 8000);

        },
        () => mode,
        Boolean(d.desk),
        projectLabel(d.pane.project),

    }
    const composer=document.querySelector('.composer'),blocked=Boolean(d.ask) && mode!=='screen';
    composer.classList.toggle('question-open',blocked);composer.querySelector('textarea').readOnly=blocked;composer.querySelector('.attach').disabled=blocked;
    composer.querySelector('.send').disabled=blocked || !composer.querySelector('textarea').value.trim();
    composer.querySelector('textarea').placeholder=blocked?ui('Answer above','למענה, בחרו בשאלה'):mode==='screen'?ui('Type into the terminal…','הקלדה בטרמינל…'):composerPlaceholder(projectLabel(d.pane.project));
    composer.querySelector('textarea').onclick=()=>{if(blocked)goQuestion();};
    const pendingAnswer=composer.querySelector('.pending-answer');pendingAnswer.hidden=!blocked;pendingAnswer.textContent=ui('Show answer choices','הצגת אפשרויות המענה');pendingAnswer.onclick=goQuestion;
    approvalHistory=approvalHistory.map(entry=>{
      const receipt=(d.questionResults || []).find(result=>result.sourceId===entry.sourceId);
      if(!receipt) return entry;
      const delivered=!receipt.declined && (entry.completeRequest || (Boolean(entry.answer) && (receipt.answers?.includes(entry.answer) || String(receipt.text).replace(/\\n/g,'\n').includes(entry.answer))));
      return {...entry,delivery:receipt.declined?'declined':delivered?'agent':entry.delivery};
    });
    if(mode!=='chat')document.querySelector('.askbox')?.remove();

    if(mode==='today' && d.desk) {
      let data;
      try {const response=await fetch(`/api/desk?pane=${encodeURIComponent(id)}`,{signal:AbortSignal.timeout(12000)});if(!response.ok)throw new Error();data=await response.json();}
      catch {data={available:false,error:'Could not read the timeline. Try again when connected.'};}
      if(mine!==view || mode!=='today')return;
      const html=deskHtml(data,deskDay);
      if(html!==lastSignature){lastSignature=html;main.innerHTML=html;main.scrollTop=0;}
      main.querySelector('[data-desk-refresh]')?.addEventListener('click',()=>{lastSignature='';render();},{once:true});
      const select=main.querySelector('#desk-day');if(select)select.onchange=()=>{deskDay=select.value;lastSignature='';render();};
      return;
    }
    if(mode==='today')mode='chat';
    if (!d.events.length) {
      // Some terminals keep no conversation of their own — a side session, a
      // plain shell. Showing what is on their screen is far more use than
      // telling someone there is nothing here.
      const shown = await fetch(`/api/screen?pane=${encodeURIComponent(id)}`)
        .then((x) => x.json()).catch(() => ({}));
      if(mine!==view)return;
      const screen = shown.screen || '';
      const pending = sentQueue.map(entry=>messageHtml('user',entry.text,'you',entry.delivered?'sent — waiting for the agent to read it':'sending…',' mine pendingmsg')).join('');
      const approvals = approvalHistory.map((entry) => messageHtml('user',entry.answer || entry.text,'You · answer',entry.at?ago(entry.at):'',' mine approvalmsg',entry.delivery==='agent'?ui('Confirmed in the agent’s answer record.','אושר ברישום התשובה של הסוכן.'):entry.delivery==='declined'?ui('The request was declined. This answer was not confirmed.','הבקשה נדחתה. התשובה הזו לא אושרה.'):ui('Sent to the terminal · awaiting agent confirmation.','נשלח למסוף · ממתין לאישור הסוכן.'))).join('');
      // Chat mode stays a chat even here: the screen is shown as the
      // terminal's latest message, with its tables and lists made readable.
      // The raw character grid is one tap away under Screen.
      main.innerHTML = (screen
        ? mode === 'screen'
          ? `<div class="screen">${esc(screen)}</div>`
          : messageHtml('assistant',screen.replace(/[ \t]+$/gm,''),d.pane.provider,'on screen now')
        : approvalHistory.length ? '' : '<div class="empty">Nothing recorded for this terminal yet.</div>') + approvals + pending;
      presentAsk();main.scrollTop = main.scrollHeight;
      return;
    }

    if (mode === 'screen') {
      const shown = await fetch(`/api/screen?pane=${encodeURIComponent(id)}`)
        .then((x) => x.json()).catch(() => ({}));
      if(mine!==view)return;
      const screenHtml = `<div class="screen">${esc(shown.screen || 'Nothing on the screen yet.')}</div>`;
      if (screenHtml !== lastSignature) {
        lastSignature = screenHtml;
        main.innerHTML = screenHtml;
        main.scrollTop = main.scrollHeight;
      }
      return;
    }

    const older = d.reachedStart
      ? `<div class="start">${ui('Start of this conversation','תחילת השיחה')}</div>`
      : `<button type="button" class="earlier">${ui('Show earlier messages','הצגת הודעות קודמות')}</button>`;

    const visibleEvents = d.events;
    // Approval answers are local chat events, but they still belong at their
    // real time in the conversation. Appending them after every transcript
    // event makes an old answer cover newer agent replies and looks frozen.
    const displayEvents = [
      ...visibleEvents.map((event, index) => ({ ...event, localApproval: false, order: index })),
      ...approvalHistory.map((entry, index) => ({
        kind: 'user', text: entry.answer || entry.text, at: entry.at, delivery:entry.delivery,
        localApproval: true, order: visibleEvents.length + index,
      })),
    ].sort((a, b) => {
      const aTime = new Date(a.at || 0).getTime();
      const bTime = new Date(b.at || 0).getTime();
      return aTime - bTime || a.order - b.order;
    });
    const context=technicalTask(d.pane.task)?`<details class="message-details technical-context" data-detail-key="startup:${esc(d.pane.task)}"><summary>${ui('Details: startup context','פרטים: הנחיית פתיחה')}</summary><pre>${esc(d.pane.task)}</pre></details>`:'';
    const html = context + older + conversationHtml(displayEvents,(e) => {
      const when = e.at ? ago(new Date(e.at).getTime()) : '';
      const delivery=e.localApproval?(e.delivery==='agent'?ui('Confirmed in the agent’s answer record.','אושר ברישום התשובה של הסוכן.'):e.delivery==='declined'?ui('The request was declined on the terminal. This answer was not confirmed.','הבקשה נדחתה במסוף. התשובה הזו לא אושרה.'):ui('Sent to the terminal · awaiting agent confirmation.','נשלח למסוף · ממתין לאישור הסוכן.')):'';
      return messageHtml(e.kind,e.text,e.localApproval?ui('Your answer','התשובה שלך'):e.kind==='user'?ui('You','אתה'):e.kind==='notice'?ui('Status','עדכון'):projectLabel(d.pane.project),when,e.localApproval?' mine approvalmsg':'',delivery,e.details);
    })
      + unconfirmedSent(sentQueue,visibleEvents).map(entry=>messageHtml('user',entry.text,'you',entry.delivered?'sent — waiting for the agent to read it':'sending…',' mine pendingmsg')).join('')
      + (d.producing || ['working','producing'].includes(avatarState(d.pane))
        ? `<div class="busyline" role="status"><span class="busyorb" aria-hidden="true"><i></i><i></i><i></i></span><span class="busytext">${ui('Working on it','עובד על זה')}</span></div>`
        : '');

    // Once the agent's own record shows it, stop holding our copy.
    sentQueue = unconfirmedSent(sentQueue,visibleEvents);

    // Re-rendering identical content would throw away the reader's position.
    if (html === lastSignature) {presentAsk();return;}
    const first = lastSignature === '';
    const nearBottom = following;
    const wasAt=main.scrollTop;

    // Refresh status and questions while leaving native text selection intact.
    const selection=window.getSelection();
    if(!first && (main.querySelector('.copy-fallback textarea:focus') || (selection?.toString() && main.contains(selection.anchorNode)) || (main.querySelector('.custom-answer textarea:focus') && preservedAsk?.dataset.askId===d.ask?.id && preservedAsk.dataset.receiptState===(d.answerReceipt?.state || '')))){presentAsk();return;}

    lastSignature = html;
    const disclosureState=new Map([...main.querySelectorAll('details[data-detail-key]')].map(el=>[el.dataset.detailKey,el.open]));
    main.innerHTML = html;
    main.querySelectorAll('details[data-detail-key]').forEach(el=>{if(disclosureState.has(el.dataset.detailKey))el.open=disclosureState.get(el.dataset.detailKey);});
    presentAsk();

    const earlier = main.querySelector('.earlier');
    if (earlier) {
      earlier.onclick = async () => {
        earlier.disabled = true;
        earlier.textContent = 'Loading…';
        shown += 60;
        lastSignature = '';
        following = false;
        // Keep the message you were reading in place as older ones arrive.
        const height = main.scrollHeight;
        await render();
        main.scrollTop += main.scrollHeight - height;
      };
    }

    if (first && restorePosition) {
      main.scrollTop=savedTop;
    } else if (first || nearBottom) {
      main.scrollTop = main.scrollHeight;
    } else if (false) {
      // Wait for layout: text rewraps and heights settle a frame after the
      // content is swapped in, so measuring immediately corrects by the wrong
      // amount and the page still drifts.
      const settle = () => {
        const rows = [...main.children];
        // Tool lines repeat verbatim ("exec · npm run build"), so matching on
        // text alone can land on a different copy further up or down the list.
        // Among equal matches, take the one closest to where it used to be.
        let best = -1;
        let bestDistance = Infinity;
        rows.forEach((r, i) => {
          if ((r.textContent || '').slice(0, 60) !== anchor.text) return;
          const distance = Math.abs(i - anchor.index);
          if (distance < bestDistance) { best = i; bestDistance = distance; }
        });
        const row = rows[best >= 0 ? best : anchor.index];
        if (row) main.scrollTop += row.getBoundingClientRect().top - anchor.offset;
        else main.scrollTop = wasAt;
      };
      requestAnimationFrame(() => requestAnimationFrame(settle));
    } else {
      main.scrollTop = wasAt;
    }
  };

  // Mobile browsers pause polling while this page is in the background. Fetch
  // immediately when the operator returns so a waiting permission is visible
  // without waiting for the next interval.
  const refreshWhenVisible = () => {
    if (mine === view && document.visibilityState !== 'hidden') render();
  };
  window.addEventListener('focus', refreshWhenVisible);
  window.addEventListener('pageshow', refreshWhenVisible);
  document.addEventListener('visibilitychange', refreshWhenVisible);
  releaseChatWake = () => {
    window.removeEventListener('focus', refreshWhenVisible);
    window.removeEventListener('pageshow', refreshWhenVisible);
    document.removeEventListener('visibilitychange', refreshWhenVisible);
    releaseChatWake = null;
  };

  await render();
  // The composer reserves space after the first paint, so land on the newest
  // message once the layout has actually settled.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (mine !== view) return;
    if(restorePosition){main.scrollTop=savedTop;following=remembered.following;}
    else{window.scrollTo(0, document.body.scrollHeight);following=true;}
    saveChatView?.();
    paintChatNavigation();
    chatHandoff?.remove();chatHandoff=null;
    //                       // opening always lands at the end
  }));
  timer = setInterval(render, mode === 'screen' ? 2000 : 8000);
}

function mountAsk(id, ask, onDone, receipt=null) {
  document.body.classList.add('chat');
  const current=document.querySelector('.askbox');
  const state=receipt?.state || '';
  const supported=String(ask.customAnswerSupported!==false);

  box.setAttribute('aria-label',ask.kind==='permission'?ui('Permission request','בקשת הרשאה'):ui('Question from the agent','שאלה מהסוכן'));
  const waiting=receipt && receipt.state!=='not-sent';
  const customSupported=ask.customAnswerSupported!==false && ask.stage!=='review';
  const customKey=`tc-answer-draft:${id}:${ask.id}`;
  box.innerHTML=`<div class="askheading"><h3><bdi dir="auto">${waiting?ui('Answer awaiting confirmation','התשובה ממתינה לאישור'):esc(ask.header || (ask.kind==='permission'?ui('Permission requested','נדרשת הרשאה'):ui('Your answer is needed','נדרשת תשובה שלך')))}</bdi>${ask.questionCount>1 && ask.stage!=='review'?` · <bdi dir="ltr">${ask.questionIndex+1} / ${ask.questionCount}</bdi>`:''}</h3><button type="button" class="asktoggle" aria-expanded="${!waiting}">${waiting?ui('Show','הצגה'):ui('Hide','צמצום')}</button></div>
    <div class="askbody"${waiting?' hidden':''}><p dir="auto">${esc(ask.title)}</p>${ask.detail?`<p dir="auto">${esc(ask.detail)}</p>`:''}${ask.kind==='permission' && ask.screen?`<details class="message-details"><summary>${ui('Terminal request details','פרטי הבקשה במסוף')}</summary><pre class="askscreen">${esc(ask.screen)}</pre></details>`:''}
    ${ask.stage==='review'?`${ask.reviewAnswers?.length?`<dl class="review-answers">${ask.reviewAnswers.map(item=>`<div><dt dir="auto">${esc(item.question)}</dt><dd dir="auto">${esc(item.answer)}</dd></div>`).join('')}</dl>`:''}<details class="message-details"><summary>${ui('Review in the terminal','הסיכום במסוף')}</summary><pre class="askscreen">${esc(ask.screen||'')}</pre></details>`:''}
    ${waiting?`<div class="receipt"><p role="status">${ui('An answer was sent or is unconfirmed. Check the terminal before answering again.','תשובה נשלחה או שמסירתה לא אושרה. בדקו במסוף לפני תשובה נוספת.')}</p><button type="button" data-check-screen>${ui('Check terminal','בדיקה במסוף')}</button></div>`:`
    <div class="opts">${ask.options.map(option=>`<button type="button" dir="${dirOf(option.label)}" data-choice="${esc(option.key)}"${multi?` aria-pressed="${(ask.checked||[]).includes(option.key)}"`:''}><span class="choice-copy"><span dir="auto">${esc(option.label)}</span>${option.detail?`<span class="detail" dir="auto">${esc(option.detail)}</span>`:''}</span>${multi?'<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="13" height="13" rx="3"/><path class="tick" d="m6.5 10.2 2.4 2.4 4.6-5.2"/></svg>':'<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m8 5 5 5-5 5"/></svg>'}</button>`).join('')}</div>
     ${multi?`<p class="multi-hint" dir="auto">${ui('Pick all that apply, then submit.','בחרו את כל המתאימות ואז שלחו.')}</p>${ask.customText?`<p class="multi-custom" dir="auto">${ui('Your own answer','התשובה שלך')}: <bdi>${esc(ask.customText)}</bdi></p>`:''}<button type="button" class="multi-submit" data-submit-multi>${ui('Submit choices','שליחת הבחירות')}</button>`:''}

    <form class="custom-answer" hidden><label for="custom-answer-text">${ui('Your answer to this question','התשובה שלך לשאלה הזו')}</label><textarea id="custom-answer-text" rows="2" maxlength="8000" dir="auto" aria-describedby="answer-help"></textarea><p id="answer-help">${ui('Back keeps this draft and returns to the choices. It does not decline the question.','חזרה שומרת את הטיוטה ומחזירה לאפשרויות. היא לא דוחה את הבקשה.')}</p><div class="custom-actions"><button type="submit" disabled>${ui('Send answer','שליחת תשובה')}</button><button type="button" data-cancel-answer>${ui('Back to choices','חזרה לאפשרויות')}</button></div></form>`:''}`}
    <p class="askresult" role="status" aria-live="polite"></p></div>`;
  main.append(box);

  toggle.onclick=()=>{body.hidden=!body.hidden;toggle.setAttribute('aria-expanded',String(!body.hidden));toggle.textContent=body.hidden?ui('Show','הצגה'):ui('Hide','צמצום');};
  box.querySelector('[data-check-screen]')?.addEventListener('click',()=>document.querySelector('[data-mode="screen"]')?.click());
  const form=box.querySelector('.custom-answer'),field=form?.querySelector('textarea'),opts=box.querySelector('.opts'),other=box.querySelector('.typeinstead');
  const draft=()=>{try{sessionStorage.setItem(customKey,field.value);}catch{}};
  const close=(back=true)=>{if(!form)return;draft();form.hidden=true;opts.hidden=false;other.hidden=false;other.focus();if(back && history.state?.answerEditor===ask.id){box.localEditorNavigation=true;history.back();}};
  const open=(push=true)=>{if(!form || !customSupported)return;form.hidden=false;opts.hidden=true;other.hidden=true;body.hidden=false;toggle.setAttribute('aria-expanded','true');toggle.textContent=ui('Hide','צמצום');if(push)history.pushState({...history.state,answerEditor:ask.id},'',location.hash);field.focus();fitViewport();};
  box.closeAnswerEditor=close;box.openAnswerEditor=open;
  if(field){try{field.value=sessionStorage.getItem(customKey)||'';}catch{}field.oninput=()=>{draft();form.querySelector('[type=submit]').disabled=!customSupported || !field.value.trim();};field.oninput();field.onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();close();}};}
  if(other)other.onclick=()=>open();
  form?.querySelector('[data-cancel-answer]').addEventListener('click',()=>close());
  let sending=false;
  const submit=async(choice,answer)=>{
    if(sending || (!choice && !customSupported))return;sending=true;box.dataset.sending='true';
    box.querySelectorAll('[data-choice],.typeinstead,[type=submit],[data-submit-multi]').forEach(button=>button.disabled=true);
    const result=box.querySelector('.askresult');result.textContent=multi && choice!=='submit-multi'?ui('Updating the terminal…','מעדכן במסוף…'):ui('Sending to this question…','שולח תשובה לשאלה הזו…');result.scrollIntoView({block:'center'});let response;
    try{const sent=await fetch('/api/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pane:id,askId:ask.id,...(choice?{choice}:{answer}),...(multi?{multi:true}:{})}),signal:AbortSignal.timeout(multi?15000:10000)});response=await sent.json();if(!response.ok && !response.error)response={error:ui('The terminal did not acknowledge this answer.','המסוף לא אישר את קבלת התשובה הזו.')};}
    catch{response={error:ui('Delivery is unconfirmed. Your draft is saved. Check the terminal before retrying.','מסירת התשובה לא אושרה. הטיוטה נשמרה. בדקו במסוף לפני ניסיון נוסף.'),uncertain:true};}
    sending=false;box.dataset.sending='false';
    if(response.error){result.textContent=deliveryError(response.error);result.scrollIntoView({block:'center'});box.querySelectorAll('[data-choice],.typeinstead,[type=submit],[data-submit-multi]').forEach(button=>button.disabled=Boolean(response.uncertain) || (button.matches('.typeinstead,[type=submit]') && !customSupported));if(field && !response.uncertain)field.oninput();return;}
    if(multi && choice!=='submit-multi'){
      box.querySelectorAll('[data-choice],.typeinstead,[data-submit-multi]').forEach(button=>button.disabled=false);
      box.querySelectorAll('[data-choice]').forEach(button=>button.setAttribute('aria-pressed',String((response.checked||[]).includes(button.dataset.choice))));

      result.textContent=answer?ui('Your answer is typed in and ticked. Submit when ready.','התשובה שלך הוקלדה וסומנה. שלחו כשמוכנים.'):ui('Updated in the terminal.','עודכן במסוף.');
      if(answer && !box.querySelector('.multi-custom'))box.querySelector('.multi-hint')?.insertAdjacentHTML('afterend',`<p class="multi-custom" dir="auto">${ui('Your own answer','התשובה שלך')}: <bdi>${esc(ask.customText)}</bdi></p>`);

    const option=ask.options.find(item=>item.key===choice);const value=choice==='submit-multi'?[...ask.options.filter(item=>box.querySelector(`[data-choice="${item.key}"]`)?.getAttribute('aria-pressed')==='true').map(item=>item.label),...(ask.customText?[ask.customText]:[])].join(', '):choice?option?.label || choice:answer;

  };
  box.querySelectorAll('[data-choice]').forEach(button=>{button.onclick=()=>submit(button.dataset.choice);});
  box.querySelector('[data-submit-multi]')?.addEventListener('click',()=>submit('submit-multi'));
  if(form)form.onsubmit=event=>{event.preventDefault();if(field.value.trim())submit(null,field.value);};
}

function mountComposer(id, onSent, onMode, view = () => 'chat', hasDesk = false, agentName = 'Agent') {
  document.body.classList.add('chat');

      <div class="modeswitch" role="group" aria-label="${ui('What to show','תצוגה')}"><button type="button" data-mode="chat">${ui('Chat','שיחה')}</button>${hasDesk?`<button type="button" data-mode="today">${ui('Today','היום')}</button>`:''}<button type="button" data-mode="screen">${ui('Screen','מסך')}</button></div>
      <button type="button" class="attach" aria-label="${ui('Attach an image','צירוף תמונה')}">${icon('attach')}${ui('Attach an image','צירוף תמונה')}</button><input type="file" accept="image/*" aria-hidden="true">
      <button type="button" class="mic" aria-label="${ui('Dictate a message','הקלדה בקול')}">${icon('mic')}${ui('Dictate a message','הקלדה בקול')}</button>
      <button type="button" class="schedule-message">${icon('clock')}${ui('Schedule a message','תזמון הודעה')}</button>
      <button type="button" class="edit-profile">${icon('person')}${ui('Name, job and rules','שם, תפקיד וכללים')}</button>

        <button type="button" class="wide" data-key="down" aria-label="Arrow down">↓</button>
