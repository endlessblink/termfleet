  document.body.appendChild(bar);
  viewTabs=bar.querySelector('.modeswitch');
  bar.querySelector('.edit-profile').onclick=()=>{bar.querySelector('.composer-menu').open=false;profileDialog(id);};
  bar.querySelector('.schedule-message').onclick=()=>{bar.querySelector('.composer-menu').open=false;scheduleDialog(id,bar.querySelector('textarea').value);};

  const cmdlist = bar.querySelector('.cmdlist');
  let commands = null;

  // An agent's own commands, offered as you type a slash — the same list its
  // terminal menu shows, without needing to drive the terminal.
  async function loadCommands() {
    if (commands) return commands;
    const r = await fetch(`/api/commands?pane=${encodeURIComponent(id)}`)
      .then((x) => x.json()).catch(() => ({}));
    commands = r.commands || [];
    return commands;
  }

  async function showCommands(typed) {
    const list = await loadCommands();
    const query = typed.slice(1).toLowerCase();
    const matches = list
      .filter((c) => c.name.toLowerCase().includes(query))
      .sort((a, b) => {
        const aStarts = a.name.toLowerCase().startsWith(query) ? 0 : 1;
        const bStarts = b.name.toLowerCase().startsWith(query) ? 0 : 1;
        return aStarts - bStarts || a.name.localeCompare(b.name);
      })
      .slice(0, 40);

    cmdlist.hidden = false;
    cmdlist.innerHTML = matches.length
      ? matches.map((c) => `<button type="button" data-cmd="${esc(c.name)}">
            <span class="cmd">/${esc(c.name)}</span>
            ${c.detail ? `<span class="what">${esc(c.detail)}</span>` : ''}
          </button>`).join('')
      : '<div class="none">No command matches that.</div>';

    cmdlist.querySelectorAll('[data-cmd]').forEach((el) => {
      el.onclick = () => {
        box.value = `/${el.dataset.cmd} `;
        hideCommands();
        box.focus();
        sync();
      };
    });
  }

  // Files in this terminal's project, for "@". Typing a path on a phone is
  // miserable; picking one is not.
  async function showFiles(typed) {
    const query = typed.slice(typed.lastIndexOf('@') + 1);
    const r = await fetch(`/api/files?pane=${encodeURIComponent(id)}&q=${encodeURIComponent(query)}`)
      .then((x) => x.json()).catch(() => ({}));
    const files = r.files || [];

    cmdlist.hidden = false;
    cmdlist.innerHTML = files.length
      ? files.map((f) => {
          const cut = f.lastIndexOf('/');
          const dir = cut > 0 ? f.slice(0, cut + 1) : '';
          const name = cut > 0 ? f.slice(cut + 1) : f;
          return `<button type="button" data-file="${esc(f)}">
              <span class="path"><span class="dir">${esc(dir)}</span>${esc(name)}</span>
            </button>`;
        }).join('')
      : '<div class="none">No file matches that.</div>';

    cmdlist.querySelectorAll('[data-file]').forEach((el) => {
      el.onclick = () => {
        const at = box.value.lastIndexOf('@');
        box.value = `${box.value.slice(0, at)}@${el.dataset.file} `;
        hideCommands();
        box.focus();
        sync();
      };
    });
  }

  // A leading "!" runs the rest in the shell, so say so rather than leaving it
  // to be discovered.
  function showShellHint() {
    cmdlist.hidden = false;
    cmdlist.innerHTML = '<div class="hint">Starting with <b>!</b> runs the rest as a shell command in this terminal.</div>';
  }

  function hideCommands() {
    cmdlist.hidden = true;
    cmdlist.innerHTML = '';
  }
  // Escape or a click anywhere outside the list/typing box closes it.
  const dismissList = (ev) => {
    if (!cmdlist.isConnected) return document.removeEventListener('keydown', dismissList, true), document.removeEventListener('pointerdown', dismissList, true);
    if (cmdlist.hidden) return;
    if (ev.type === 'keydown') { if (ev.key === 'Escape') { ev.preventDefault(); hideCommands(); } return; }
    if (!cmdlist.contains(ev.target) && ev.target !== box) hideCommands();
  };
  document.addEventListener('keydown', dismissList, true);
  document.addEventListener('pointerdown', dismissList, true);

  const box = bar.querySelector('textarea');
  const btn = bar.querySelector('button.send');
  const file = bar.querySelector('input[type=file]');
  const attached = bar.querySelector('.attached');
  const preview = attached.querySelector('img');
  const nameEl = attached.querySelector('.name');

  // An image is held here until you send; the agent is given its path on the
  // machine, because a terminal cannot be handed a file any other way.
  let image = null;

  const showImage = async (blob, label) => {
    attached.hidden = false;
    preview.removeAttribute('src');
    nameEl.textContent = 'preparing…';
    bar.dataset.preparing='true';paintChatNavigation();
    sync();

    // Phone photos are huge; sending one raw over mobile data is what makes an
    // upload look stuck. Shrink it first, and fall back to the original if the
    // browser cannot decode it.
    const prepared = await shrink(blob).catch(() => blob);
    delete bar.dataset.preparing;paintChatNavigation();
    image = { blob: prepared, label };

    if (preview.src) URL.revokeObjectURL(preview.src);
    preview.src = URL.createObjectURL(prepared);
    preview.onerror = () => { preview.removeAttribute('src'); };
    nameEl.textContent = `${label} · ${Math.max(1, Math.round(prepared.size / 1024))} KB`;
    sync();
  };

  async function shrink(blob, max = 1600) {
    if (!/^image\//.test(blob.type) || blob.size < 400 * 1024) return blob;
    const bitmap = await createImageBitmap(blob);
    const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
    if (scale === 1 && blob.size < 2 * 1024 * 1024) { bitmap.close?.(); return blob; }

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close?.();

    const smaller = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85));
    return smaller && smaller.size < blob.size ? smaller : blob;
  }
  const clearImage = () => {
    if (preview.src) URL.revokeObjectURL(preview.src);
    image = null;
    attached.hidden = true;
    preview.removeAttribute('src');
    sync();
  };

  // Characters go into the box you are composing; control keys go straight to
  // the terminal, because that is what they mean.
  bar.querySelectorAll('[data-ins]').forEach((key) => {
    key.onclick = () => {
      // In Terminal view the character is meant for the terminal itself: a
      // slash there opens the agent's command list, which is the whole point.
      if (bar.classList.contains('always')) return sendRaw(`type:${key.dataset.ins}`, key.dataset.ins);

      const at = box.selectionStart ?? box.value.length;
      const end = box.selectionEnd ?? at;
      box.value = box.value.slice(0, at) + key.dataset.ins + box.value.slice(end);
      box.selectionStart = box.selectionEnd = at + key.dataset.ins.length;
      box.focus();
      sync();
    };
  });

  async function sendRaw(which, label) {
    note(`Sent ${label}`);
    const r = await fetch('/api/send', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pane: id, key: which }),
    }).then((x) => x.json()).catch(() => ({ error: 'Could not reach your machine.' }));
    if (r.error) return note(r.error, true);
    setTimeout(() => document.querySelector('.sendstate')?.remove(), 900);
    onSent?.({ refresh: true });
  }

  bar.querySelectorAll('[data-key]').forEach((key) => {
    key.onclick = async () => {
      const which = key.dataset.key;
      note(which === 'interrupt' ? 'Stopping…' : `Sent ${key.textContent.trim()}`);
      const r = await fetch('/api/send', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pane: id, key: which }),
      }).then((x) => x.json()).catch(() => ({ error: 'Could not reach your machine.' }));
      if (r.error) return note(r.error, true);
      setTimeout(() => document.querySelector('.sendstate')?.remove(), 1200);
    };
  });

  bar.querySelector('.attach').onclick = () => file.click();

  // Dictation: tap to talk, tap again to stop. The words land in the box so you
  // can read and fix them before sending. Hebrew and English are detected.
  const mic = bar.querySelector('.mic');
  let recorder = null, stream = null, phase = 'idle', disposed = false, transcribeAbort = null, stoppedAt = null;
  const releaseStream = () => { stream?.getTracks().forEach((t) => t.stop()); stream = null; };
  const resetMic = () => { recorder = null; stoppedAt = null; phase = 'idle'; mic.disabled = false; mic.classList.remove('rec', 'busy'); };
  const cancelVoice = () => {
    if (disposed) return;
    disposed = true; observer.disconnect(); window.removeEventListener('pagehide', cancelVoice);
    transcribeAbort?.abort();
    if (recorder) { recorder.onstop = recorder.onerror = recorder.ondataavailable = null; if (recorder.state !== 'inactive') try { recorder.stop(); } catch {} }
    releaseStream(); resetMic();
  };
  const observer = new MutationObserver(() => { if (!bar.isConnected) cancelVoice(); });
  observer.observe(document.body, { childList: true, subtree: true });
  window.addEventListener('pagehide', cancelVoice);
  mic.onclick = async () => {
    if (disposed || phase === 'requesting' || phase === 'transcribing') return;
    if (phase === 'recording') { stoppedAt = performance.now(); try { recorder.stop(); } catch { releaseStream(); resetMic(); note(ui('Recording stopped. Try again.', 'ההקלטה הופסקה. נסו שוב.'), true); } return; }
    if (!window.isSecureContext) return note(ui('Voice needs HTTPS on your phone. Open the secure TermControl address.', 'הקלדה בקול בטלפון דורשת HTTPS. פתחו את הכתובת המאובטחת של TermControl.'), true);
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return note(ui('Voice recording is not supported in this browser.', 'הקלטה בקול אינה נתמכת בדפדפן הזה.'), true);
    phase = 'requesting';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (disposed || !bar.isConnected) { releaseStream(); return; }
      const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find((type) => MediaRecorder.isTypeSupported?.(type));
      const chunks = [], rec = recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onerror = () => { rec.onstop = null; if (rec.state !== 'inactive') try { rec.stop(); } catch {} releaseStream(); resetMic(); note(ui('Recording failed. Try another browser.', 'ההקלטה נכשלה. נסו דפדפן אחר.'), true); };
      rec.onstop = async () => {
        releaseStream(); recorder = null;
        if (disposed || !bar.isConnected) return;
        phase = 'transcribing'; mic.disabled = true; mic.classList.remove('rec'); mic.classList.add('busy');
        transcribeAbort = new AbortController();
        const timeout = setTimeout(() => transcribeAbort?.abort(), 180000);
        try {
          const type = rec.mimeType || chunks.find((c) => c.type)?.type || 'application/octet-stream';
          const audio = new Blob(chunks, { type });
          if (!audio.size) throw new Error(ui('No sound was recorded. Try again.', 'לא הוקלט קול. נסו שוב.'));
          if (audio.size > 25 * 1024 * 1024) throw new Error(ui('That recording is too long.', 'ההקלטה ארוכה מדי.'));
          note(ui('Turning your recording into text…', 'מתמלל את ההקלטה…'));
          const requestedAt = performance.now();
          const r = await fetch('/api/transcribe', { method: 'POST', headers: { 'content-type': type }, body: audio, signal: transcribeAbort.signal });
          const d = await r.json();
          // Content-free diagnostics for the last 20 clips, including phone/network
          // time absent from server timings. Never retain audio or the returned words.
          const timing = { clientMs: Math.round(performance.now() - requestedAt), status: r.status };
          if (Number.isFinite(stoppedAt)) {
            timing.captureFinalizeMs = Math.round(requestedAt - stoppedAt);
            timing.stopToTextMs = Math.round(performance.now() - stoppedAt);
          }
          for (const key of ['uploadMs', 'queueMs', 'workerStartupMs', 'warmupMs', 'decodeMs', 'detectMs', 'inferenceMs', 'requestMs']) {
            if (Number.isFinite(d.timings?.[key]) && d.timings[key] >= 0) timing[key] = d.timings[key];
          }
          const history = window.termcontrolDictationTimings ||= [];
          history.push(timing); if (history.length > 20) history.shift();
          if (!r.ok) throw new Error(r.status === 401 ? ui('Signed out. Reload and sign in to dictate.', 'החיבור הסתיים. רעננו והתחברו כדי לתמלל.') : d.error || ui('Could not turn that into text.', 'לא ניתן לתמלל את ההקלטה.'));
          if (disposed || !bar.isConnected) return;
          if (!d.text) return note(ui('No speech heard.', 'לא נשמע דיבור.'), true);
          // Remember only the successful language, never the dictated words.
          try { if (['he', 'en'].includes(d.language)) localStorage.setItem('termcontrol-dictation-language', d.language); } catch {}
          const before = box.value, at = box.selectionStart ?? before.length;
          const gap = before && !/\s$/.test(before.slice(0, at)) ? ' ' : '';
          box.value = before.slice(0, at) + gap + d.text + before.slice(box.selectionEnd ?? at);
          box.selectionStart = box.selectionEnd = at + gap.length + d.text.length;
          box.focus(); sync(); document.querySelector('.sendstate')?.remove();
        } catch (e) { if (!disposed) note(e.name === 'AbortError' ? ui('Transcription took too long. Try a shorter recording.', 'התמלול ארך זמן רב מדי. נסו הקלטה קצרה יותר.') : e.message, true); }
        finally { clearTimeout(timeout); transcribeAbort = null; resetMic(); }
      };
      rec.start(); phase = 'recording'; mic.classList.add('rec');
      // Load while the owner speaks, using the previous dictation language rather
      // than guessing from the UI. A first clip only warms the detector. The clip
      // itself still uses automatic Hebrew/English detection.
      let previousLanguage;
      try { previousLanguage = localStorage.getItem('termcontrol-dictation-language'); } catch {}
      const hint = ['he', 'en'].includes(previousLanguage) ? '?lang=' + previousLanguage : '';
      fetch('/api/transcribe/prepare' + hint, { method: 'POST' }).catch(() => {});
    } catch (error) {
      releaseStream(); resetMic();
      const message = error.name === 'NotAllowedError' ? ui('Allow the microphone in your browser settings to dictate.', 'יש לאשר מיקרופון בהגדרות הדפדפן כדי לתמלל.')
        : error.name === 'NotFoundError' ? ui('No microphone was found on this device.', 'לא נמצא מיקרופון במכשיר הזה.')
        : error.name === 'NotReadableError' ? ui('The microphone is busy. Close other apps using it and retry.', 'המיקרופון תפוס. סגרו יישומים שמשתמשים בו ונסו שוב.')
        : ui('Voice recording failed in this browser. Try another browser.', 'ההקלטה נכשלה בדפדפן הזה. נסו דפדפן אחר.');
      if (!disposed) note(message, true);
    }
  };
  bar.querySelector('.drop').onclick = clearImage;
  file.onchange = () => {
    const chosen = file.files?.[0];
    if (chosen) showImage(chosen, chosen.name || 'image').catch(() => { clearImage(); note('That image could not be read.', true); });
    file.value = '';
  };

  // Pasting a screenshot straight into the box.
  box.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (!item) return;
    const blob = item.getAsFile();
    if (blob) { e.preventDefault(); showImage(blob, 'pasted image').catch(() => { clearImage(); note('That image could not be read.', true); }); }
  });

  bar.saveDraft=()=>Object.assign(draftMemory,{text:box.value,start:box.selectionStart,end:box.selectionEnd,image});
  bar.releaseDraft=()=>{if(preview.src)URL.revokeObjectURL(preview.src);};
  const sync = () => {
    bar.saveDraft();
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 140) + 'px';
    btn.disabled = box.value.trim().length === 0 && !image;
  };
  box.value=draftMemory.text || '';
  box.setSelectionRange(draftMemory.start ?? box.value.length,draftMemory.end ?? box.value.length);
  if(draftMemory.image)showImage(draftMemory.image.blob,draftMemory.image.label);
  sync();
  box.addEventListener('input', () => {
    sync();
    const typed = box.value;
    if (/^\/[^\s]*$/.test(typed)) showCommands(typed);
    else if (/@[^\s]*$/.test(typed)) showFiles(typed);
    else if (/^![^\n]*$/.test(typed)) showShellHint();
    else hideCommands();
  });

  // The extra keys are only useful while you are actually typing, so they do
  // not sit there taking up the screen the rest of the time.
  box.addEventListener('focus', () => bar.classList.add('typing'));
  box.addEventListener('blur', () => {
    // Give a tap on one of the keys time to land before hiding them.
    setTimeout(() => {
      if (!bar.contains(document.activeElement)) bar.classList.remove('typing');
    }, 150);
  });

  const send = async (force = false) => {
    let text = box.value.trim();
    if (!text && !image) return;
    bar.dataset.sending='true';paintChatNavigation();
    try{
    btn.disabled = true;

    if (image) {
      note('Sending the image…');
      const form = new FormData();
      form.append('file', image.blob, image.label);
      let saved;
      try {
        saved = await upload(form, (percent) => note(`Sending the image… ${percent}%`));
      } catch (e) {
        btn.disabled = false;
        return note(e.message || 'Could not send the image. It is still here.', true);
      }

      if (saved.error) { btn.disabled = false; return note(saved.error, true); }
      // Hand the agent the path it can actually open.
      text = text ? `${text}\n${saved.path}` : saved.path;
      clearImage();
    }

    note('Sending…');
    const slow = setTimeout(() => note('Still trying to reach your machine…'), 3000);
    // One id per draft: a retry after a timeout is recognised, never typed twice.
    if (bar.sendDraft !== text) { bar.sendDraft = text; bar.sendId = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`; }
    let r;
    try {
      const resp = await fetch('/api/send', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pane: id, text, force, sendId: bar.sendId }),
        signal: AbortSignal.timeout(8000),
      });
      r = await resp.json();
      if (resp.status === 401) r = { error: 'Signed out — reload to sign in.' };
    } catch {
      r = { error: 'No answer from your machine. Your message is still here; sending again is safe — it will not arrive twice.' };
    }
    clearTimeout(slow);
    btn.disabled = false;

    if (r.busy) return confirmBusy(r.message, () => send(true));
    if (r.error) return note(r.error, true);
    bar.sendDraft = null;
    onSent?.({ text, delivered: r.delivered !== false, at: Date.now() });
    box.value = '';
    hideCommands();
    sync();

    if (r.delivered === false) {
      // The write succeeded but the text never showed up in the terminal.
      note('Sent, but it did not appear in the terminal. Check it on your computer.', true);
      return;
    }
    note('Delivered');
    setTimeout(() => { const n = document.querySelector('.sendstate'); if (n) n.remove(); }, 1400);
    }finally{delete bar.dataset.sending;paintChatNavigation();}
  };

  // Context views are above the thread; the composer only handles the reply.
  const paintSwitch = () => {
    viewTabs.querySelectorAll('[data-mode]').forEach((el) => {
      el.setAttribute('aria-pressed', String(el.dataset.mode === view()));
    });
    const screening = view() === 'screen';
    bar.classList.toggle('always', screening);
    btn.innerHTML = icon('send');
    btn.setAttribute('aria-label',screening ? ui('Type into terminal','הקלדה במסוף') : ui('Send message','שליחת הודעה'));
    box.placeholder = screening ? ui('Type into the terminal…','הקלדה בטרמינל…') : composerPlaceholder(agentName);
    bar.querySelector('.terminal-tools').open=screening;
  };

  viewTabs.querySelectorAll('[data-mode]').forEach((el) => {
    el.onclick = async () => {bar.querySelector('.composer-menu').open=false;await onMode?.(el.dataset.mode);paintSwitch();};
  });
  paintSwitch();

  btn.onclick = () => {
    if (bar.classList.contains('always')) {
      const text = box.value;
      if (!text) return;
      box.value = ''; sync();
      return sendRaw(`type:${text}`, 'text');
    }
    send(false);
  };
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(false); }
  });
}

/** Upload with real progress, so a slow connection looks slow rather than stuck. */
function upload(form, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.timeout = 120000;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress?.(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText || '{}'); } catch { /* ignore */ }
      if (xhr.status === 200) resolve(body);
      else reject(new Error(body.error || 'The image was refused.'));
    };
    xhr.onerror = () => reject(new Error('Could not reach your machine. The image is still here.'));
    xhr.ontimeout = () => reject(new Error('That took too long. The image is still here.'));
    xhr.send(form);
  });
}

function note(text, isError = false) {
  const old = document.querySelector('.sendstate');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'sendstate' + (isError ? ' err' : '');
  el.textContent = text;
  document.body.appendChild(el);
  if (!isError) return el;
  setTimeout(() => el.remove(), 5000);
  return el;
}

function confirmBusy(message, go) {
  const el = note(message);
  el.innerHTML = `${message}<div class="acts">
    <button type="button" data-no>Wait</button>
    <button type="button" class="go" data-yes>Send now</button></div>`;
  el.querySelector('[data-no]').onclick = () => el.remove();
  el.querySelector('[data-yes]').onclick = () => { el.remove(); go(); };
}

window.addEventListener('popstate', (e) => {
  const ask=document.querySelector('.askbox'),editor=ask?.querySelector('.custom-answer');
  if(ask?.localEditorNavigation){ask.localEditorNavigation=false;return;}
  if(editor && !editor.hidden && !e.state?.answerEditor){ask.closeAnswerEditor(false);return;}
  if(ask && e.state?.answerEditor===ask.dataset.askId){ask.openAnswerEditor(false);return;}
  if(e.state?.inbox || location.hash==='#inbox'){openInbox();return;}
  const botId = e.state?.bot ?? (location.hash.startsWith('#bot:') ? location.hash.slice(5) : null);
  if(botId){openBot(botId);return;}
  const roomId = e.state?.room ?? (location.hash.startsWith('#room:') ? location.hash.slice(6) : null);
  if(roomId){openRoom(roomId);return;}
  const id = e.state?.pane ?? location.hash.slice(1);
  if(id){if(id!==focusedPane)recordVisit(id);chat(id);}else fleet();
});

// Following a link to #<terminal> while the app is already open changes only
// the hash — no navigation, no popstate — so listen for that too.
window.addEventListener('hashchange', () => {
  if(location.hash==='#inbox'){openInbox();return;}
  if(location.hash.startsWith('#room:')){openRoom(location.hash.slice(6));return;}
  if(location.hash.startsWith('#bot:')){openBot(location.hash.slice(5));return;}
  const id = location.hash.slice(1);
  if(id){if(id!==focusedPane)recordVisit(id);chat(id);}else fleet();
});

const opening = location.hash.startsWith('#room:') || location.hash.startsWith('#bot:') || location.hash==='#inbox' ? '' : location.hash.slice(1);
if(location.hash==='#inbox'){history.replaceState({inbox:true},'',location.hash);openInbox();}
else if(location.hash.startsWith('#room:')){history.replaceState({room:location.hash.slice(6)},'',location.hash);openRoom(location.hash.slice(6));}
else if(location.hash.startsWith('#bot:')){history.replaceState({bot:location.hash.slice(5)},'',location.hash);openBot(location.hash.slice(5));}
else if(opening && performance.getEntriesByType('navigation')[0]?.type==='navigate')recordVisit(opening);
if (opening) { history.replaceState({ pane: opening }, '', location.hash); chat(opening); }
else if(!location.hash.startsWith('#room:') && !location.hash.startsWith('#bot:') && location.hash!=='#inbox') fleet();
</script>
</body>
