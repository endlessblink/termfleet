<!doctype html>
<html lang="en">
<!-- TermControl: map-owned fleet, native conversation actions, local theme. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#141312">
<title>TermFleet</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/app/favicon-32.png">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TermFleet">
<style>
  :root{
    color-scheme:dark;
    --bg:#141413; --surface:#1c1c1a; --surface-2:#232320; --line:#2f2f2b;
    --text:#f0eee6; --muted:#9a9993; --dim:#8b8a85;
    --accent:#d97757; --waiting:#e0a458; --working:#7aa2a0; --idle:#63625d;
    --radius:14px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  }
  @supports not (height: 100dvh){ body{height:100vh} }
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);
    font-size:15px;line-height:1.5;overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top);
  }
  header{
    flex:none;z-index:5;background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:56px;
  }
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sub{font-size:12px;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{
    appearance:none;background:none;border:0;color:var(--accent);
    font-size:15px;min-width:56px;min-height:44px;padding:8px 10px;margin:-8px -10px;
    cursor:pointer;font-family:var(--ui);text-align:left;
  }
  main{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    overflow-anchor:auto;
    -webkit-overflow-scrolling:touch;
    padding:12px 12px 20px;max-width:720px;width:100%;margin:0 auto;
  }

  :focus-visible{
    outline:none;
    box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    border-radius:10px;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }

  .pane{
    position:relative;display:block;width:100%;text-align:left;appearance:none;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:8px;color:inherit;font:inherit;
    transition:background .15s ease;
  }
  .pane:active{background:var(--surface-2)}

  .attention-panel{
    margin:0 0 14px;border:1px solid #6b5029;border-radius:var(--radius);
    background:#1e1c17;overflow:hidden;
  }
  .attention-panel summary{
    min-height:48px;padding:11px 14px;display:flex;align-items:center;gap:9px;
    cursor:pointer;list-style:none;color:var(--waiting);font-weight:600;
  }
  .attention-panel summary::-webkit-details-marker{display:none}
  .attention-panel summary::after{
    content:'›';margin-left:auto;color:var(--muted);font-size:20px;line-height:1;
    transform:rotate(90deg);transition:transform .15s ease;
  }
  .attention-panel:not([open]) summary::after{transform:rotate(0)}
  .attention-count{
    min-width:22px;height:22px;padding:0 7px;border-radius:11px;
    display:inline-grid;place-items:center;background:var(--waiting);color:#211a0d;
    font-size:12px;font-weight:700;
  }
  .attention-list{border-top:1px solid #49391f;max-height:42dvh;overflow-y:auto}
  .attention-item{
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
    padding:10px 12px;border-bottom:1px solid #393025;
  }
  .attention-item:last-child{border-bottom:0}
  .attention-copy{min-width:0}
  .attention-project{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attention-reason{
    margin-top:2px;color:var(--muted);font-size:12px;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .attention-review{
    min-width:72px;min-height:44px;padding:9px 13px;border:1px solid #76592d;
    border-radius:10px;background:#2a2216;color:#f2c57c;font:600 13px var(--ui);cursor:pointer;
  }
  .attention-review:active{transform:translateY(1px);background:#352a19}

  /* Waiting: the only card that should stop your thumb. */
  .pane.waiting{
    border-color:#6b5029;
    background:linear-gradient(180deg,#26200f,#1e1c17);
    padding-left:19px;
  }
  .pane.waiting::before{
    content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
    border-radius:0 3px 3px 0;background:var(--waiting);
  }
  .pane.waiting .project{color:#fff}

  /* Idle: present, but quieter than everything above it. */
  .pane.idle{background:transparent;border-color:#262622}
  .pane.idle .project{color:var(--muted);font-weight:500}
  .pane.idle .task{color:var(--dim)}
  .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .emoji{font-size:17px;line-height:1;flex:none}
  .titleEmoji{font-size:15px;margin-right:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.waiting{background:var(--waiting);box-shadow:0 0 0 3px rgba(224,164,88,.16)}
  .dot.working{background:var(--working)}

  /* A terminal that is genuinely producing output right now. The pulse is the
     only motion in the app, and it stops the moment the output does. */
  .dot.producing{
    background:var(--working);
    box-shadow:0 0 0 0 rgba(122,162,160,.55);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 7px rgba(122,162,160,0)}
    100%{box-shadow:0 0 0 0 rgba(122,162,160,0)}
  }
  @media (prefers-reduced-motion: reduce){ .dot.producing{animation:none} }

  /* Bot card working animation: pulsing glow when actively working */
  .bot-row[data-state="working"]{
    animation:bot-pulse 2s ease-in-out infinite;
  }
  @keyframes bot-pulse{
    0%,100%{border-color:var(--line);box-shadow:none}
    50%{border-color:var(--working);box-shadow:0 0 0 2px rgba(122,162,160,.3)}
  }
  @media (prefers-reduced-motion: reduce){
    .bot-row[data-state="working"]{animation:none;border-color:var(--working)}
  }

  /* The terminal's own last line, changing as it prints. */
  .tail{
    display:flex;align-items:center;gap:8px;margin-top:9px;
    font-family:var(--mono);font-size:12px;color:var(--working);
    overflow:hidden;white-space:nowrap;
  }
  .tail .text{overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* A trace of how much output arrived over the last minute. */
  .trace{display:flex;align-items:flex-end;gap:2px;height:14px;flex:none}
  .trace i{
    display:block;width:3px;border-radius:1px;background:var(--working);
    opacity:.5;transition:height .3s ease, opacity .3s ease;
  }
  .trace i.on{opacity:1}

  .headtail{
    display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;
    color:var(--working);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .livemark{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;color:var(--working);
  }
  .livemark.quiet{color:var(--dim);font-weight:500}
  .livemark.gone{color:var(--waiting)}
  .agentstatus{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;color:var(--dim);font-size:12px}
  .agentstatus .workingtime{color:var(--working);font-weight:600}
  .agentstatus .quota{white-space:nowrap}
  .chatstatus:empty{display:none}
  .chatstatus .agentstatus{margin-top:3px;gap:3px 8px;font-size:12px}

  .headlive{
    display:inline-flex;align-items:center;gap:5px;margin-left:8px;
    font-size:12px;font-weight:600;color:var(--working);vertical-align:middle;
  }
  .headlive.quiet{color:var(--dim);font-weight:500}
  .dot.idle{background:var(--idle)}
  .project{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .badge{
    margin-left:auto;font-size:12px;color:var(--dim);font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
  }
  .task{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .task.none{color:var(--dim);font-style:italic}
  .state{
    display:inline-block;margin-top:9px;padding:3px 9px;border-radius:99px;
    font-size:12px;font-weight:600;letter-spacing:.01em;
    background:rgba(224,164,88,.15);color:var(--waiting);
  }
  .runmark{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:12px;font-weight:500;color:var(--working);
  }

  .switch{
    display:flex;gap:2px;padding:3px;margin:2px 2px 14px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line);
  }
  .switch button{
    flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;
    color:var(--muted);font:600 13px var(--ui);cursor:pointer;
  }
  .switch button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}

  /* Sort and activity filters. Chips, not menus: the list refreshes itself and
     would close an open menu. */
  .fleetbar{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
  /* Plan usage left: one quiet line per provider, read from this PC only. */
  .usagebar{display:flex;flex-direction:column;gap:3px;margin:0 0 10px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font:400 12.5px var(--ui);color:var(--muted)}
  .usage-row{display:grid;grid-template-columns:52px 1fr;align-items:baseline;gap:0 8px}
  .usage-windows{display:flex;flex-direction:column;gap:1px}
  .usage-name{font-weight:500;color:var(--text);min-width:46px}
  .usage-window b{font-weight:500;color:var(--text)}
  .usage-window.low b{color:var(--danger,#d66)}
  .fleetbar .chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
  .fleetbar .chips::-webkit-scrollbar{display:none}
  .fleetbar .lbl{flex:none;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;min-width:38px}
  .fleetbar button{
    flex:none;appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
    font:600 12px var(--ui);padding:6px 11px;border-radius:12px;min-height:32px;cursor:pointer;
  }
  .fleetbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#191512}
  .projgroup{margin-bottom:22px}
  .projhead{
    display:flex;align-items:center;gap:8px;margin:0 4px 9px;
    font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em;
  }
  .projhead .pemoji{font-size:16px}
  .projhead .count{
    margin-left:auto;font-size:12px;color:var(--dim);background:var(--surface-2);
    padding:2px 8px;border-radius:99px;font-weight:600;
  }
  .projhead.needs .count{background:rgba(224,164,88,.16);color:var(--waiting)}

  .rowwrap{display:flex;align-items:stretch;gap:8px}
  .rowwrap .pane{flex:1;min-width:0}
  .moves{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
  .moves button{
    width:44px;flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--muted);font:600 16px var(--ui);cursor:pointer;
  }
  .moves button:disabled{opacity:.35}

  h2.section{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    margin:20px 4px 9px;font-weight:600;
  }
  h2.section .count{
    font-size:12px;color:var(--dim);background:var(--surface-2);
    padding:1px 7px;border-radius:99px;font-weight:600;letter-spacing:0;
  }
  h2.section:first-child{margin-top:4px}

  .msg{margin-bottom:18px}.msg-time{display:block;font-size:11px;color:var(--muted);margin-top:4px;opacity:.6;text-align:end}
  .msg.mine .bubble{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;
  }
  .msg.mine.pendingmsg .bubble{opacity:.72;border-style:dashed}
  .msg.mine .who .when{color:var(--dim)}
  .who{
    display:flex;align-items:baseline;gap:8px;
    font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:6px;font-weight:600;
  }
  .who .when{text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim)}
  .msg.user .bubble{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;
  }
  .msg.assistant .bubble{padding:0 2px;font-size:15.5px;line-height:1.55;color:var(--text)}
  .bubble{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .richbubble{white-space:normal}
  .rich > *{margin:0 0 10px}
  .rich > *:last-child{margin-bottom:0}
  .rich p{white-space:pre-wrap}
  .rich ul, .rich ol{padding-inline-start:22px}
  .rich li{margin:0 0 4px}
  .rich h4{font-size:15.5px;font-weight:600;margin-top:14px}
  .rich hr{border:0;border-top:1px solid var(--line)}
  .rich a{color:var(--accent)}
  .rich code{
    font-family:var(--mono);font-size:.88em;background:var(--surface-2);
    border:1px solid var(--line);border-radius:5px;padding:0 4px;
  }
  .rich pre{
    font-family:var(--mono);font-size:12.5px;line-height:1.45;background:#0f0f0e;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch;
  }
  .rich pre code{background:none;border:0;padding:0;font-size:inherit}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  /* Words never split mid-word; a wide table scrolls sideways instead, the way
     chat apps show tables on a phone. */
  .rich table{border-collapse:collapse;width:max-content;min-width:100%;font-size:14px;line-height:1.4}
  .rich th, .rich td{
    padding:8px 10px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line);
    overflow-wrap:normal;word-break:normal;min-width:4.5em;max-width:15em;unicode-bidi:isolate;
  }
  .rich td code{white-space:nowrap}
  @media (max-width:640px){
    .stacked{border:0;overflow:visible}
    .stacked table{width:100%;min-width:0}
    .stacked thead{display:none}
    .stacked tr{
      display:block;margin:0 0 10px;padding:10px 12px;
      background:var(--surface);border:1px solid var(--line);border-radius:10px;
    }
    .stacked td{display:block;max-width:none;min-width:0;padding:3px 0;border:0;overflow-wrap:break-word}
    .stacked td:has(> div:empty){display:none}
    .stacked td::before{
      content:attr(data-label);display:block;
      font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;
    }
    .stacked td:first-child{font-weight:600}
  }
  .rich code{unicode-bidi:plaintext}
  .rich th{background:var(--surface-2);font-weight:600;white-space:nowrap}
  .rich tr:last-child td{border-bottom:0}
  .tool{
    font-family:var(--mono);font-size:13px;color:var(--muted);
    background:transparent;border:0;border-left:2px solid #33332e;
    border-radius:0;padding:5px 0 5px 11px;margin:0 0 4px 2px;
    overflow-x:auto;white-space:nowrap;
  }
  .tool b{color:var(--muted);font-weight:500}
  .tool + .tool{margin-top:-2px}
  .msg + .tool{margin-top:10px}
  .tool + .msg{margin-top:14px}
  .pending{border-left-color:var(--working);color:var(--working)}
  .pending b{color:var(--working)}
  .empty{color:var(--dim);text-align:center;padding:48px 24px;font-size:14px}

  .earlier, .start{overflow-anchor:none}
  .earlier{
    display:block;width:100%;min-height:44px;margin:0 0 14px;
    border:1px solid var(--line);border-radius:12px;background:var(--surface);
    color:var(--muted);font:600 13px var(--ui);cursor:pointer;
  }
  .earlier:disabled{opacity:.6}
  .start{text-align:center;color:var(--dim);font-size:12.5px;margin:0 0 14px}

  /* The terminal's own screen. Menus an agent draws live only here. */
  .note{
    color:var(--muted);font-size:12.5px;line-height:1.4;
    margin:0 0 10px;padding:9px 11px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
  }
  .screen{
    font-family:var(--mono);font-size:12px;line-height:1.45;color:var(--text);
    background:#0f0f0e;border:1px solid var(--line);border-radius:12px;
    padding:12px;margin:0 0 12px;white-space:pre;overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .modeswitch{
    display:flex;gap:2px;padding:3px;border-radius:10px;flex:none;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .modeswitch button{
    min-width:56px;min-height:44px;padding:0 10px;border:0;border-radius:7px;
    background:transparent;color:var(--muted);font:600 12px var(--ui);cursor:pointer;
  }
  .modeswitch button[aria-pressed="true"]{background:var(--accent);color:#191512}

  /* The row that carries the view switch: always on screen, above the
     keyboard, because a sticky header is not reachable once a phone keyboard
     is open. */
  .toolrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .toolrow .keys{margin:0;flex:1;min-width:0}

  .composer{
    flex:none;z-index:6;background:var(--bg);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:flex-end;
    max-width:720px;width:100%;margin:0 auto;
  }
  .composer textarea{
    /* The stack around it is the flexible one; the box sets its own height as
       you type, so it must not be stretched to fit. */
    flex:none;width:100%;resize:none;min-height:44px;max-height:140px;
    padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font:16px/1.4 var(--ui);
  }
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer .attach{
    flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .composer input[type=file]{display:none}

  .attached{
    display:flex;align-items:center;gap:8px;margin:0 0 8px;
    padding:5px 5px 5px 8px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);
  }
  .attached img{width:30px;height:30px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2)}
  .attached img:not([src]){display:none}
  /* `display:flex` above beats the hidden attribute, which left an empty box
     sitting above the reply row with nothing in it. */
  .attached[hidden]{display:none}
  .attached .name{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attached button{
    flex:none;width:44px;height:44px;border:0;border-radius:8px;background:transparent;
    color:var(--muted);font-size:17px;cursor:pointer;
  }
  .composer .stack{flex:1;min-width:0;display:flex;flex-direction:column}

  /* The characters a phone keyboard hides behind two taps, and the keys a
     terminal needs. One tap each. */
  .keys{
    display:none;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .composer.typing .keys,
  .composer.always .keys{display:flex}
  .keys::-webkit-scrollbar{display:none}
  .keys button{
    flex:none;min-width:44px;height:44px;padding:0 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--surface);
    color:var(--text);font:600 15px var(--mono);cursor:pointer;
  }
  .keys button.wide{font-family:var(--ui);font-size:13px}
  .keys button:active{background:var(--surface-2)}

  /* The command list, the way an agent shows it: above what you are typing,
     narrowing as you go. */
  .cmdlist{
    max-height:44vh;overflow-y:auto;margin:0 0 8px;padding:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    -webkit-overflow-scrolling:touch;
  }
  .cmdlist[hidden]{display:none}
  .cmdlist button{
    display:block;width:100%;text-align:left;min-height:52px;padding:9px 12px;
    border:0;border-radius:9px;background:transparent;color:var(--text);
    font:inherit;cursor:pointer;
  }
  .cmdlist button:active{background:var(--surface-2)}
  .cmdlist .cmd{font-family:var(--mono);font-size:14.5px;color:var(--accent)}
  .cmdlist .what{

  body.chat header{position:relative;display:flex;justify-content:center;min-height:104px;padding:10px 58px 14px;background:radial-gradient(ellipse 120px 70px at 50% 16px,color-mix(in srgb,var(--surface-2) 70%,transparent),transparent 85%),var(--bg)}
  body.chat header::after{content:'';position:absolute;inset-inline:0;bottom:-16px;height:16px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
  body.chat header>#nav+div{flex:none;width:100%;text-align:center}
  body.chat header h1{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;line-height:1.25;text-align:center}
  body.chat header .head-avatar,body.chat header .head-avatar svg.creature{width:40px;height:40px}
  body.chat header .chat-project{max-width:100%;text-align:center}
  body.chat header .sub{font-size:12px;margin-top:4px;max-width:100%;text-align:center}
  body.chat header #nav{position:absolute;inset:8px;display:block;pointer-events:none}
  body.chat header #nav .back{position:absolute;inset-block-start:0;inset-inline-start:0;pointer-events:auto}
  body.chat header #nav .chat-step{position:absolute;inset-block-end:0;pointer-events:auto}
  body.chat header #nav [data-chat-step="-1"]{inset-inline-start:0}
  body.chat header #nav [data-chat-step="1"]{inset-inline-end:0}
  body.chat header>.theme-toggle{position:absolute;inset-block-start:8px;inset-inline-end:8px;margin:0}
  body.chat main{padding-block-start:18px}
}
body.chat{--incoming:var(--surface-2);--outgoing:color-mix(in srgb,var(--surface-2) 90%,var(--text))}
:root[data-theme="light"] body.chat{--incoming:var(--surface);--outgoing:var(--surface-2)}
body.chat main .msg{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 44px;column-gap:4px;row-gap:4px;margin:0 0 14px;min-width:0}
body.chat main .msg>.bubble{grid-column:1;grid-row:1;min-width:0}
body.chat main .msg>.delivery-details,body.chat main .msg>.pending-delivery,body.chat main .msg>.copy-fallback{grid-column:1/-1}
body.chat main .msg.user{margin-left:12%;margin-right:0;grid-template-columns:44px minmax(0,1fr)}
body.chat main .msg.user>.bubble{grid-column:2;border:0;background:var(--outgoing);border-radius:22px;padding:12px 14px;font-size:16px;line-height:1.6}
body.chat main .msg.user>.message-menu:not([open]){grid-column:1}
body.chat main .msg.user>.message-menu[open]>summary{inset-inline-start:auto;inset-inline-end:auto;left:0;right:auto}
body.chat main .msg.assistant{margin-left:0;margin-right:4%}
body.chat main .msg.assistant>.bubble{background:var(--incoming);border:0;border-radius:22px;padding:13px 14px;font-size:16px;line-height:1.65;letter-spacing:0}
body.chat main .msg.assistant>.message-menu[open]>summary{inset-inline-start:auto;inset-inline-end:auto;left:auto;right:0}
:root:dir(rtl) body.chat main .msg.user{grid-template-columns:minmax(0,1fr) 44px}
:root:dir(rtl) body.chat main .msg.user>.bubble{grid-column:1}
:root:dir(rtl) body.chat main .msg.user>.message-menu:not([open]){grid-column:2}
:root:dir(rtl) body.chat main .msg.assistant{grid-template-columns:44px minmax(0,1fr)}
:root:dir(rtl) body.chat main .msg.assistant>.bubble{grid-column:2}
:root:dir(rtl) body.chat main .msg.assistant>.message-menu:not([open]){grid-column:1}
body.chat main .rich p{margin:0 0 12px}
body.chat main .rich p:last-child{margin-bottom:0}
main .message-menu{position:static;grid-column:2;grid-row:1;min-width:44px;width:44px;height:44px;margin:0;color:var(--muted)}
main .message-menu>summary{list-style:none;cursor:pointer;width:44px;min-width:44px;min-height:44px;display:grid;place-items:center;font:20px/1 var(--ui);border-radius:10px}
main .message-menu>summary::-webkit-details-marker,.composer-menu>summary::-webkit-details-marker{display:none}
main .message-menu[open]{grid-column:1/-1;grid-row:auto;width:100%;height:auto;padding-block-start:4px}
main .message-menu[open]>summary{position:absolute;inset-block-start:0;inset-inline-end:0}
main .message-menu-panel{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);font-size:14px;color:var(--text);overflow-wrap:anywhere}
main .message-provenance{font-size:13px;color:var(--muted);margin:4px 0 8px;text-align:start}
main .message-menu .copy-message{margin:0;min-height:44px;padding:8px 0;justify-content:flex-start;color:var(--text);font:14px var(--ui)}
main .message-menu .copy-status{display:block;font-size:13px;color:var(--muted);margin:4px 0}
main .message-menu .copy-status:empty{display:none}
main .message-menu-panel .message-details{margin:0}
main .message-menu-panel .message-details>summary{min-height:44px;padding:10px 0}
main .message-menu pre{font:13px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;text-align:start;max-width:100%;margin:4px 0 12px}
main .message-menu>summary:hover,.composer-menu>summary:hover{background:var(--surface-2)}
main .activity-details{margin:0 0 16px;font-size:14px;color:var(--muted)}
main .activity-details>summary{min-height:44px;display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;overflow-wrap:anywhere}
main .activity-details>summary::before{content:'›';font-size:18px}
main .activity-details[open]>summary::before{content:'⌄'}
main .activity-details>summary::-webkit-details-marker{display:none}
main .activity-details>summary small{font:inherit;color:var(--dim)}
main .activity-details .msg{margin:8px 0 16px}
main .activity-details .msg.user{margin-inline-start:0}
main .activity-details .msg.user .bubble{background:transparent;padding:0;font-size:14px}
main .activity-details .bubble{font-size:14px;color:var(--muted)}
body.chat main .activity-details .msg{margin-left:0;margin-right:0;grid-template-columns:minmax(0,1fr) 44px}
body.chat main .activity-details .msg>.bubble{grid-column:1;background:transparent;border-radius:0;padding:0;font-size:14px}
body.chat main .activity-details .msg>.message-menu:not([open]){grid-column:2}
body.chat main .activity-details .msg>.message-menu[open]>summary{left:auto;right:auto;inset-inline-start:auto;inset-inline-end:0}
main .msg.notice>.bubble{color:var(--text);font-size:16px;border-inline-start:2px solid var(--waiting);padding-inline-start:12px}
main .activity-details .msg.notice>.bubble{border:0;padding:0;color:var(--muted)}
main .delivery-details{margin:4px 0 0;font-size:13px;color:var(--muted)}
main .delivery-details>summary{cursor:pointer;min-height:44px;padding-block:10px}
main .delivery-details p{margin:0 0 8px;overflow-wrap:anywhere}
main .pending-delivery{font-size:13px;color:var(--muted);margin-top:4px}
body.chat main .start{display:none}
body.chat main .askbox{margin:16px 0 12px;padding:0;border:0;border-radius:0;background:transparent}
body.chat main .askheading{position:absolute;inset-block-start:-8px;inset-inline-end:-8px;justify-content:flex-end}
body.chat main .askheading h3{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
body.chat main .asktoggle{color:var(--muted);font-size:0}
body.chat main .asktoggle::after{content:'−';font:20px/1 var(--ui)}
body.chat main .askbox:has(.askbody[hidden]) .askheading{position:static;justify-content:space-between}
body.chat main .askbox:has(.askbody[hidden]) .askheading h3,body.chat main .askbox.has-progress .askheading h3{position:static;width:auto;height:auto;clip-path:none;font:14px var(--ui);color:var(--muted)}
body.chat main .askbox.has-progress .askheading{position:static;margin-bottom:8px}
body.chat main .asktoggle[aria-expanded=false]::after{content:'+'}
body.chat main .askbody>p:first-child{font-size:17px;font-weight:500;line-height:1.6;padding-inline-end:36px;margin:4px 0 12px}
body.chat main .opts{gap:0}
body.chat main .opts button{display:flex;align-items:center;gap:12px;justify-content:space-between;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--text);font-weight:400;font-size:16px;min-height:56px;padding:14px 0;text-align:start}
body.chat main .askbox .opts button:first-child{border-color:var(--line)}
body.chat main .opts .choice-copy{flex:1;min-width:0}
body.chat main .opts button svg{width:16px;height:16px;color:var(--muted)}
body.chat main .opts button:dir(rtl) svg{transform:rotate(180deg)}
body.chat main .opts button:active{background:var(--surface)}
@media(hover:hover){body.chat main .opts button:hover{background:var(--surface)}}
body.chat main .opts .detail{font-size:13px;line-height:1.5;font-weight:400;margin-top:4px}
body.chat main .answer-tools{display:flex;align-items:flex-start;flex-wrap:wrap;margin-top:8px;gap:8px}
body.chat main .typeinstead{flex:1;width:auto;min-height:44px;margin:0;padding:10px 0;text-align:start;color:var(--muted);font-size:14px;font-weight:400}
body.chat main .answer-explanation{margin:0;font-size:14px;color:var(--muted)}
body.chat main .answer-explanation>summary{min-height:44px;min-width:44px;cursor:pointer;padding:10px 0}
body.chat main .answer-explanation[open]{flex-basis:100%}
body.chat main .custom-actions{background:var(--bg)}
body.chat main .busyline{animation:none;color:var(--muted);gap:8px}
body.chat main .busyorb{padding:0;background:none}
body.chat main .busyorb i{width:6px;height:6px;background:var(--muted);animation:busy-bounce 1.2s ease-in-out infinite}
body.chat main .busyorb i:nth-child(2){animation-delay:.15s}body.chat main .busyorb i:nth-child(3){animation-delay:.3s}
body.chat main .busytext{font-size:14px;font-weight:400;color:var(--muted);background:none;animation:busy-breathe 2s ease-in-out infinite}
@keyframes busy-breathe{50%{opacity:.5}}@keyframes busy-fade{0%,60%,100%{opacity:.3}30%{opacity:1}}
.composer{padding:6px;border-radius:22px;gap:4px}
:root:dir(rtl) .composer textarea:placeholder-shown{direction:rtl;text-align:start}
.composer-menu{flex:none;width:44px;height:44px;color:var(--muted)}
.composer-menu>summary{display:grid;place-items:center;width:44px;min-width:44px;min-height:44px;list-style:none;cursor:pointer;border-radius:50%}
.composer-menu:has(.mic.rec)>summary{color:var(--waiting);animation:mic-pulse 1.1s ease-in-out infinite}.composer-menu:has(.mic.busy)>summary{opacity:.5;animation:mic-pulse 1.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.composer-menu>summary{animation:none!important}}
.composer-menu-panel{position:absolute;bottom:calc(100% + 8px);inset-inline-start:0;width:min(280px,calc(100vw - 32px));padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);z-index:8;box-shadow:0 6px 20px #0002;max-height:50dvh;overflow:auto}
.composer-menu .modeswitch{display:flex;margin:0 0 8px;padding:0}
.composer-menu .modeswitch button{flex:1;min-height:44px;min-width:44px;font-size:14px}
/* TF-096: every row of the + menu looks the same (Noam: "please redesign this"). */
.composer-menu-panel .attach,.composer-menu-panel .mic,.composer-menu-panel .schedule-message,.composer-menu-panel .word-fixes,.composer-menu-panel .edit-profile{border:0;cursor:pointer;width:100%;height:auto;min-height:44px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:8px 0;border-radius:0;background:transparent;text-align:start;font:14px var(--ui);color:var(--text)}
.composer.question-open{padding:4px 8px;min-height:54px;border:0;border-radius:0;background:transparent;margin-top:0}
.composer.question-open .pending-answer{font-size:14px;font-weight:400;text-align:start;color:var(--text);padding-inline:8px}

.rooms-panel{margin:0 0 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.rooms-panel summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:500;cursor:pointer}
.rooms-panel summary::-webkit-details-marker{display:none}
.rooms-list{display:flex;flex-direction:column;padding:0 6px 8px}
.room-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px;border:0;border-radius:12px;background:transparent;color:var(--text);text-align:start;font:inherit;cursor:pointer}
.room-row:hover,.room-row:focus-visible{background:var(--surface-2)}
.room-icon{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--surface-2);color:var(--accent);font-weight:500;font-size:18px}
.room-icon.head{display:inline-grid;width:30px;height:30px;font-size:15px;margin-inline-end:8px;vertical-align:middle}
.room-copy{display:flex;flex-direction:column;min-width:0;flex:1}
.room-name{font-weight:500}
.room-last{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog.room-dialog{border:0;border-radius:16px;background:var(--surface);color:var(--text);padding:0;max-width:min(480px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.4)}
dialog.room-dialog::backdrop{background:rgba(0,0,0,.5)}
dialog.room-dialog form{display:grid;gap:0;padding:0;margin:0}
dialog.room-dialog h2{margin:0;padding:20px 20px 0;font-size:18px;font-weight:600;line-height:1.3}
dialog.room-dialog .room-field{display:block;padding:16px 20px 0;margin:0;border:0}
dialog.room-dialog .room-field span{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
dialog.room-dialog .room-field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;box-sizing:border-box}
dialog.room-dialog .room-hint{margin:8px 20px 0;padding:0;color:var(--muted);font-size:13px;line-height:1.5}
dialog.room-dialog fieldset{border:0;margin:16px 20px 0;padding:0;display:grid;gap:0}
dialog.room-dialog legend{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:12px;padding:0}
dialog.room-dialog .room-agent{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 0;margin:0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:start;font:inherit;cursor:pointer}
dialog.room-dialog .room-agent:last-of-type{border-bottom:0}
dialog.room-dialog .room-agent input[type=checkbox]{flex:none;width:20px;height:20px;margin-top:4px;cursor:pointer;appearance:auto}
dialog.room-dialog .room-agent svg{flex:none;width:32px;height:32px}
dialog.room-dialog .room-agent>span{flex:1;min-width:0;display:grid;gap:3px}
dialog.room-dialog .agent-name{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog.room-dialog .agent-job{display:block;font-size:13px;color:var(--muted);line-height:1.3;overflow-wrap:break-word}
dialog.room-dialog .room-error{margin:12px 20px 0;padding:0;color:#d66;font-size:13px;min-height:0}
dialog.room-dialog .room-error:empty{display:none}
dialog.room-dialog .room-actions{display:flex;gap:10px;padding:20px;border-top:1px solid var(--line);margin:0;background:var(--bg)}
dialog.room-dialog .room-cancel,dialog.room-dialog .room-create{flex:1;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:600 15px var(--ui);cursor:pointer}
dialog.room-dialog .room-create{background:var(--accent);border-color:var(--accent);color:#191512}
dialog.room-dialog .room-cancel:active,dialog.room-dialog .room-create:active{opacity:.8}
dialog.room-dialog .room-create:disabled{opacity:.5;cursor:default}
.rooms-empty{margin:0;padding:4px 10px 8px;color:var(--muted);font-size:14px;line-height:1.5}
.pane.unread .project{font-weight:500;color:var(--text)}.unread-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-inline-start:6px;align-self:center}
.msg.handoff{margin-inline-end:8%}.msg.handoff>.bubble{border:1px solid var(--line);border-radius:16px;padding:10px 14px;background:transparent}.handoff-from{font-size:12.5px;color:var(--muted);margin:0 2px 4px}
.bots-panel{border-color:var(--line)}.bot-row .room-last{display:flex;gap:6px;align-items:center}.bot-avatar{flex:none;display:grid;place-items:center;width:40px;height:40px}.bot-avatar svg{width:40px;height:40px}.bot-avatar.head{display:inline-grid;width:30px;height:30px;margin-inline-end:8px;vertical-align:middle}.bot-avatar.head svg{width:30px;height:30px}.bot-failed{color:var(--danger,#d66)}.bot-feed{display:flex;flex-direction:column;gap:4px;padding-bottom:16px}.bot-activity{color:var(--muted);font-size:13px;margin:2px 4px}.bot-activity::before{content:"↳ "}.bot-note{color:var(--muted);font-size:13px;text-align:center;margin:8px 0}.bot-error{color:var(--danger,#d66);font-size:14px;margin:6px 4px}.bot-actions{display:flex;gap:8px;flex-wrap:wrap}.bot-actions button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
/* Your requests: a quiet strip in the free space right of the chat, bottom-aligned with the message box
   (Noam 2026-10-20). It never covers or moves the chat: without room for it, the chip in the header is used instead. */
#side-asks{display:none;--strip-hot:var(--accent);--strip-warn:var(--waiting)}
:root[data-theme="light"] #side-asks{--strip-hot:#a9472a;--strip-warn:#8a5410}
@media(min-width:1000px){
  body.chat:not(.asks-strip-off) #side-asks:not([hidden]){display:block;position:fixed;z-index:3;box-sizing:border-box;border-top:1px solid var(--line);background:var(--bg)}
  body.chat:not(.asks-strip-off) .asks-chip{display:none}
}
#side-asks summary{display:flex;align-items:baseline;gap:6px;min-height:36px;align-content:center;padding:10px 2px 6px;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;list-style:none;user-select:none;box-sizing:border-box}
#side-asks summary::-webkit-details-marker{display:none}
#side-asks .asks-title{flex:none;color:var(--text)}
#side-asks .asks-open{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side-asks .asks-done{flex:none;margin-inline-start:auto;font-variant-numeric:tabular-nums}
#side-asks summary::after{content:'';flex:none;align-self:center;width:5px;height:5px;margin-inline-start:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s cubic-bezier(.22,1,.36,1)}
#side-asks details:not([open]) summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
#side-asks summary:hover{color:var(--text)}
#side-asks summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#side-asks ul{list-style:none;margin:0;padding:0;overflow-y:auto;overscroll-behavior:contain;max-height:calc(var(--strip-max,320px) - 44px)}
#side-asks ul.scrolls:not(.at-end){-webkit-mask-image:linear-gradient(#000 calc(100% - 20px),transparent);mask-image:linear-gradient(#000 calc(100% - 20px),transparent)}
#side-asks li{display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:8px;align-items:baseline;padding:6px 2px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:13px;line-height:1.4}
#side-asks li:last-child{border-bottom:0}
#side-asks .st{font-size:0;line-height:0;align-self:center;display:grid;place-items:center;width:12px;height:12px}
#side-asks .st::before{font-size:12px;line-height:1;color:var(--muted)}
#side-asks .rail-what,#side-asks .rail-note{grid-column:2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:start;unicode-bidi:isolate}
#side-asks .rail-what{color:var(--text)}
#side-asks .rail-note{font-size:12px;color:var(--muted)}
#side-asks .rail-working{background:color-mix(in srgb,var(--strip-hot) 7%,transparent);padding-inline:6px;margin-inline:-6px}
#side-asks .rail-working .st::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--strip-hot);animation:busy-fade 1.6s ease-in-out infinite}
#side-asks .rail-working .rail-what{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#side-asks .rail-partial .st::before{content:'';width:5px;height:5px;border-radius:50%;border:1.5px solid var(--strip-warn)}
#side-asks .rail-answered .st::before{content:'↩'}
#side-asks .rail-done .st::before{content:'✓';color:var(--working)}
#side-asks .rail-dropped .st::before{content:'–'}
#side-asks .rail-ready .st::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ready)}
#side-asks li:has(.rail-x){grid-template-columns:12px minmax(0,1fr) 22px}
#side-asks .rail-x{grid-column:3;grid-row:1;align-self:center;width:22px;height:22px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);font:inherit;font-size:15px;line-height:1;cursor:pointer;opacity:.35}
#side-asks li:hover .rail-x,#side-asks .rail-x:focus-visible{opacity:1}#side-asks .rail-x:hover{background:var(--surface-2);color:var(--text)}
#side-asks .rail-x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#side-asks li.removing{opacity:.4;pointer-events:none}
#side-asks .rail-answered .rail-what,#side-asks .rail-done .rail-what,#side-asks .rail-dropped .rail-what{color:var(--muted)}
#side-asks .rail-done{padding-block:4px}
#side-asks .more-done{display:none}#side-asks.all-done .more-done{display:grid}
#side-asks .rail-more{display:block;grid-column:1/-1;border-bottom:0}
#side-asks .rail-more button{padding:4px 0;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}

// Read a reply aloud with the device's own voice (nothing leaves the phone).
function speakableText(text){
  return String(text || '')
    .replace(/```[\s\S]*?```/g,' ')            // code blocks are not worth hearing
    .replace(/`([^`]+)`/g,'$1')
    .replace(/!?\[([^\]]+)\]\([^)]+\)/g,'$1')   // links: keep the words
    .replace(/https?:\/\/\S+/g,'')
    .replace(/^\s*[#>*\-•|]+\s*/gm,'')
    .replace(/[*_~]+/g,'')
    .replace(/\s+/g,' ').trim();

  const restore = history.state?.fleetReturn;

    const card = landing.origin === 'bot'
      ? main.querySelector(`.bots-list .bot-row[data-bot="${CSS.escape(landing.id)}"]`)
      : [...main.querySelectorAll(landing === restore && restore.origin === 'review' ? '.attention-review' : '.pane')]

    if (!card) return;
    main.scrollTop += card.getBoundingClientRect().top
      - main.getBoundingClientRect().top
      - Number(restore.offset || 0);
  };
  main.scrollTop = Number(restore.scrollTop) || 0;
  if (keep) { place(); return; }
  fleetLanding = null;

  history.replaceState(state, '', location.href);

async function loadRoutines(paneId){

// Shown names in a sent message are wrapped so a Latin name stays whole inside Hebrew (and back).
// R-7226 "screen jitters while the agent is working": a chat redraw patches only the rows
// that changed (a full innerHTML swap re-lays out the whole list on every 2 s poll), and the
// reading place is kept by hand, because WebKit (the PC app) and iPhone Safari have no browser

function chatPlace(main,following,held){

  // scrolling (WebKit) cannot add up to a drift over many redraws.

  const box=main.getBoundingClientRect(),row=[...(main.firstElementChild?.children || [])].find(el=>el.getBoundingClientRect().bottom>box.top+1);

  if(place.row?.isConnected){const moved=place.row.getBoundingClientRect().top-place.top;if(Math.abs(moved)>=0.5)main.scrollTop+=moved;}

    // The working line keeps its node and only swaps its words: no re-animation, no height change.

async function botActivityDialog(id,name){

  const hm=at=>new Date(at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const what=a=>a.kind==='files' && a.count>1?ui(`${a.text} (${a.count} changes${a.files?.length?`: ${a.files.join(', ')}`:''})`,`${a.text} (${a.count} שינויים)`):a.kind==='files' && a.files?.length?`${a.text} (${a.files.join(', ')})`:a.text;

    catch(e){dialog.innerHTML=`<p class="room-error">${esc(e.message || ui('Could not load the activity.','לא ניתן לטעון את הפעילות.'))}</p><div class="room-actions"><button type="button" class="room-cancel">${ui('Close','סגירה')}</button></div>`;dialog.querySelector('.room-cancel').onclick=()=>dialog.close();return;}
    name=d.bot?.name || name;
    let lastDay='';
    const rows=d.actions.map(a=>{const dd=day(a.at),head=dd!==lastDay?`<li class="act-day">${esc(dd)}</li>`:'';lastDay=dd;
      return `${head}<li class="act-row${a.needsApproval?' needs':''}${a.unapproved?' unapproved':''}"><span class="act-time">${esc(hm(a.at))}</span><bdi class="act-what" dir="auto">${esc(what(a))}</bdi><span class="act-meta"><bdi dir="auto">${esc(a.who)}</bdi> · <span class="act-approval">${esc(a.approvalText)}</span></span></li>`;}).join('');
    dialog.innerHTML=`<h2 dir="auto">${esc(ui(`What ${name} did`,`מה ${name} עשה`))}</h2>
      <p class="rooms-empty">${ui('Everything it and the terminal agents it started changed, newest first. An approval shows only when one was recorded for that exact action.','כל מה שהבוט וסוכני המסוף שהפעיל שינו, מהחדש לישן. אישור מוצג רק כשנרשם אישור לאותה פעולה בדיוק.')}</p>
      <div class="act-filters" role="group" aria-label="${ui('Show','הצגה')}"><button type="button" data-only="" aria-pressed="${!only}">${ui(`All (${d.counts.all})`,`הכול (${d.counts.all})`)}</button><button type="button" data-only="approval" aria-pressed="${Boolean(only)}">${ui(`Needs approval (${d.counts.approval})`,`דורש אישור (${d.counts.approval})`)}</button></div>
      ${d.counts.unapproved?`<p class="act-warn">${ui(`${d.counts.unapproved} post, send, delete or spend ${d.counts.unapproved===1?'action has':'actions have'} no recorded approval (in red).`,`ל-${d.counts.unapproved} פעולות פרסום, שליחה, מחיקה או תשלום אין אישור מתועד (באדום).`)}</p>`:''}
      ${d.actions.length?`<ol class="act-list">${rows}</ol>`:`<p class="rooms-empty">${only?ui('No posts, sends, deletes or spending yet.','עוד אין פרסומים, שליחות, מחיקות או תשלומים.'):ui('Nothing recorded yet. Its next actions will show here.','עוד לא נרשם דבר. הפעולות הבאות שלו יופיעו כאן.')}</p>`}
      <div class="room-actions"><button type="button" class="room-cancel">${ui('Close','סגירה')}</button></div>`;

// Every picture on the clipboard, asked directly (the empty-paste-event case).
async function readClipboardPictures(){
  const files=[];
  try{
    if(!navigator.clipboard?.read)return files;
    for(const item of await navigator.clipboard.read()){
      // A screenshot tool that saved the file offers the picture AND its address (Noam
      // 2026-10-23: "גם הדבקת צילום מסך עוד פעם לא עובדת"). The desktop engine refuses the
      // picture itself then but gives the address, so readable addresses come first. Other text wins.
      const picture=item.types.find(t=>t.startsWith('image/'));
      const address=item.types.includes('text/uri-list')?'text/uri-list':item.types.includes('text/plain')?'text/plain':'';
      let words='';if(address){try{words=await (await item.getType(address)).text();}catch{}}
      const paths=copiedPicturePaths(words);
      if(words.trim() && !paths.length)return [];   // text wins
      if(paths.length){files.push(...await loadCopiedPictures(paths));continue;}   // every copied file, not one preview
      if(picture){try{const blob=await item.getType(picture);files.push(new File([blob],'pasted image.'+(picture.split('/')[1] || 'png'),{type:picture}));continue;}catch{}}
      if(address==='text/uri-list')files.push(...await copiedPicturesFromPc());
    }
  }catch{}
  return files;
}

async function enableNotifications({quiet=false}={}){
  let step='support';
  try{
    if(!pushSupported())throw new Error(ui('This browser cannot show notifications. On iPhone, add TermControl to the home screen (Share, then Add to Home Screen), open it from there, and tap this again.','הדפדפן הזה לא יכול להציג התראות. באייפון, הוסיפו את TermControl למסך הבית (שיתוף ← הוספה למסך הבית), פתחו משם והקישו שוב.'));

    // then say where to switch it on, instead of claiming it was blocked.
    const where=matchMedia('(display-mode: standalone)').matches
      ?ui('Long-press the TermControl icon on your home screen, open App info, then Notifications, and switch them on.','לחצו לחיצה ארוכה על סמל TermControl במסך הבית, פתחו "פרטי האפליקציה", ואז "התראות", והפעילו.')

// What a chat is about: its own name if it has one, else its task, else its project.
function paneHeadline(p){
  const session=p?.sessionAuthority?p.sessionViewV2:null;
  const task=session?(session.task?.label || session.now?.label || ''):technicalTask(p?.task)?ui('Continuing from a handoff','ממשיך מהעברה'):shortTask(p?.task) || '';
  const named=p?.profile?.name || p?.title || p?.name || '',projectName=projectLabel(p?.project);
  return {headline:named && named!==p?.project && named!==projectName?named:task || projectName,task,projectName,job:p?.profile?.job || ''};
}
function card(p) {
  const session=p.sessionAuthority?p.sessionViewV2:null;

  const task=session?(session.task?.label || session.now?.label || ''):technicalTask(p.task)?ui('Continuing from a handoff','ממשיך מהעברה'):shortTask(p.task) || '';
  const named=p.profile?.name || p.title || p.name || '',projectName=projectLabel(p.project);
  // The project is the group heading, so the row is named by what this chat is about.
  const headline=named && named!==p.project && named!==projectName?named:task || projectName;
  const latest=p.sessionViewV2?.now,said=latest && !latest.stale && !/^Using\s/.test(latest.label || '')?String(latest.label || '').trim():'';
  const detail=said && said!==headline?said:headline===task?(p.profile?.job || ''):task || p.profile?.job || '';
  const at=localStorage.getItem('termcontrol-sort')==='recent'?p.lastUsedAt:(p.lastActiveAt || p.updatedAt);
  const active=['working','producing','needs-you'].includes(state) || stalled;
  const unread=hasNewAnswer(p,active);
  const kind=stalled?'stalled':state==='producing'?'working':state==='exited'?'idle':state==='idle' && unread?'done':state;
  const words=state==='exited'?label:kind==='done'?ui('Done','הסתיים'):state==='idle'?ui('Idle','פנוי'):label;
  const memory=p.contextPercent>=60?`<span class="memfill${p.contextPercent>=80?' high':''}">${ui(`memory ${p.contextPercent}%`,`זיכרון ${p.contextPercent}%`)}</span>`:'';
  return `<button type="button" class="pane ${p.turn || 'idle'}${stalled?' stalled':''}${unread?' unread':''}" data-id="${esc(p.id)}" data-key="pane:${esc(p.id)}" data-state="${stalled?'stalled':state}" aria-label="${esc(headline)}, ${esc(projectName)}, ${esc(p.provider)}, ${label}${unread?', '+ui('new answer','תשובה חדשה'):''}">${avatar(p)}<span class="pane-copy"><span class="row1"><span class="project" dir="auto">${esc(headline)}</span><span class="when">${at?shortWhen(at):''}</span><span class="pane-more" aria-hidden="true" title="${ui('More','עוד')}">⋯</span>${unread?`<span class="unread-dot" title="${ui('New answer','תשובה חדשה')}"></span>`:''}</span><span class="row2">${stateChip(kind,words)}${detail?'':`<span class="provider">${esc(p.provider)}</span>`}${detail?`<span class="task" dir="auto">${esc(detail)}</span>`:''}${memory}</span></span></button>`;
}

    if (r.delivered === false) {
      // The write succeeded but the text never showed up in the terminal.
      note('Sent, but it did not appear in the terminal. Check it on your computer.', true);
      return;
    }
    note('Delivered');
    setTimeout(() => { const n = document.querySelector('.sendstate'); if (n) n.remove(); }, 1400);
    }finally{delete bar.dataset.sending;paintChatNavigation();}
  };

  // Context views are above the thread; the composer only handles the reply.
  const paintSwitch = () => {
    viewTabs.querySelectorAll('[data-mode]').forEach((el) => {
      el.setAttribute('aria-pressed', String(el.dataset.mode === view()));
    });
    const screening = view() === 'screen';
    bar.classList.toggle('always', screening);
    btn.innerHTML = icon('send');
    btn.setAttribute('aria-label',screening ? ui('Type into terminal','הקלדה במסוף') : ui('Send message','שליחת הודעה'));
    box.placeholder = screening ? ui('Type into the terminal…','הקלדה בטרמינל…') : composerPlaceholder(agentName);
    bar.querySelector('.terminal-tools').open=screening;
  };

  viewTabs.querySelectorAll('[data-mode]').forEach((el) => {
    el.onclick = async () => {bar.querySelector('.composer-menu').open=false;await onMode?.(el.dataset.mode);paintSwitch();};
  });
  paintSwitch();

  btn.onclick = () => {
    if (bar.classList.contains('always')) {
      const text = box.value;
      if (!text) return;
      box.value = ''; sync();
      return sendRaw(`type:${text}`, 'text');
    }
    send(false);
  };
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(false); }
  });
}

/** Upload with real progress, so a slow connection looks slow rather than stuck. */
// Phone photos are huge; sending one raw over mobile data is what makes an upload look
// stuck. Shrink it first; the caller falls back to the original if it cannot be decoded.
async function shrinkPicture(blob, max = 1600) {
  if (!/^image\//.test(blob.type) || blob.size < 400 * 1024) return blob;
  const bitmap = await createImageBitmap(blob);
  const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
  if (scale === 1 && blob.size < 2 * 1024 * 1024) { bitmap.close?.(); return blob; }
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  const smaller = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85));
  return smaller && smaller.size < blob.size ? smaller : blob;
}

function upload(form, onProgress, kind = '') {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', kind ? `/api/upload?kind=${kind}` : '/api/upload');
    xhr.timeout = 120000;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress?.(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText || '{}'); } catch { /* ignore */ }
      if (xhr.status === 200) resolve(body);
      else reject(new Error(body.error || 'The image was refused.'));
    };
    xhr.onerror = () => reject(new Error('Could not reach your machine. The image is still here.'));
    xhr.ontimeout = () => reject(new Error('That took too long. The image is still here.'));
    xhr.send(form);
  });
}

function note(text, isError = false) {
  const old = document.querySelector('.sendstate');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'sendstate' + (isError ? ' err' : '');
  el.textContent = text;
  document.body.appendChild(el);
  if (!isError) return el;
  setTimeout(() => el.remove(), 5000);
  return el;
}

// Dictation word fixes (2026-10-21, Noam: "I need a way to fix common words the
// transcription model gets wrong"). One list on the PC for PC and phone; the bridge
// applies it to every dictation. Pick the wrong word in the box, write the right one.
// Same rule as the bridge: a Hebrew word of 3+ letters keeps a one-letter prefix (ו, ה, ב...).
const wordFixPattern = (heard) => new RegExp('(?<![\\p{L}\\p{M}\\p{N}_])(' + (/^[\u0590-\u05FF]/.test(heard.trim()) && heard.trim().length >= 3 ? '[והבלמשכ]{0,2}' : '') + ')' + heard.trim().split(/\s+/).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+') + '(?![\\p{L}\\p{M}\\p{N}_])', 'giu');
function wordFixSheet(box, sync) {
  document.querySelector('.close-sheet')?.remove();
  const picked = box ? box.value.slice(box.selectionStart ?? 0, box.selectionEnd ?? 0).trim() : '';
  const wrap = document.createElement('div'); wrap.className = 'close-sheet word-fix-sheet';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="word-fix-title"><h2 id="word-fix-title">${ui('Fix a word dictation gets wrong', 'תיקון מילה שהתמלול טועה בה')}</h2><p>${ui('From now on every dictation writes it the right way.', 'מעכשיו כל הקלדה בקול תכתוב אותה נכון.')}</p>
    <div class="wf-row"><label for="wf-heard">${ui('It wrote', 'נכתב')}</label><input id="wf-heard" dir="auto" maxlength="80" autocomplete="off" value="${esc(picked)}"></div>
    <div class="wf-row"><label for="wf-correct">${ui('It should be', 'צריך להיות')}</label><input id="wf-correct" dir="auto" maxlength="80" autocomplete="off"></div>
    <p class="sheet-result" role="status" aria-live="polite"></p>
    <div class="sheet-actions"><button type="button" data-cancel>${ui('Close', 'סגירה')}</button><button type="button" class="go" data-save>${ui('Always fix this', 'לתקן תמיד')}</button></div>
    <ul class="wf-list" aria-label="${ui('Your word fixes', 'התיקונים שלך')}"></ul></div>`;
  document.body.append(wrap);
  const heard = wrap.querySelector('#wf-heard'), correct = wrap.querySelector('#wf-correct'), out = wrap.querySelector('.sheet-result'), list = wrap.querySelector('.wf-list'), save = wrap.querySelector('[data-save]');
  const done = () => { wrap.remove(); box?.focus(); };
  wrap.querySelector('[data-cancel]').onclick = done;
  wrap.onclick = (e) => { if (e.target === wrap) done(); };
  wrap.onkeydown = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); save.click(); } };
  const show = (fixes) => {
    list.innerHTML = fixes.map((f) => `<li><bdi dir="auto"><s>${esc(f.heard)}</s> → ${esc(f.correct)}</bdi><button type="button" data-heard="${esc(f.heard)}" aria-label="${esc(ui('Stop fixing ' + f.heard, 'להפסיק לתקן את ' + f.heard))}">×</button></li>`).join('');
    list.hidden = !fixes.length;
    list.querySelectorAll('button').forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try { const r = await fetch('/api/word-fixes', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ heard: b.dataset.heard }) }); const d = await r.json(); if (!r.ok) throw new Error(d.error); show(d.fixes); out.textContent = ui('Removed.', 'הוסר.'); }
      catch (e) { b.disabled = false; out.textContent = e.message || ui('Could not reach the PC.', 'אין חיבור למחשב.'); }
    });
  };
  list.hidden = true;
  fetch('/api/word-fixes').then((r) => r.json()).then((d) => show(d.fixes || [])).catch(() => {});
  save.onclick = async () => {
    const h = heard.value.trim(), c = correct.value.trim();
    if (!h || !c) { out.textContent = ui('Write both the wrong word and the right one.', 'כתבו גם את המילה השגויה וגם את הנכונה.'); (h ? correct : heard).focus(); return; }
    save.disabled = true; out.textContent = '';
    try {
      const r = await fetch('/api/word-fixes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ heard: h, correct: c }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      show(d.fixes);
      // Fix it in the message being written too, not only in future dictation.
      if (box) { const next = box.value.replace(wordFixPattern(h), (_, prefix) => prefix + c); if (next !== box.value) { box.value = next; sync?.(); } }
      out.textContent = ui(`Saved. "${h}" will be written "${c}".`, `נשמר. "${h}" ייכתב "${c}".`);
      heard.value = correct.value = ''; heard.focus();
    } catch (e) { out.textContent = e.message || ui('Could not reach the PC.', 'אין חיבור למחשב.'); }
    finally { save.disabled = false; }
  };
  (picked ? correct : heard).focus();
}
function dictationDone(box, sync, fixed) {
  // Dictated words are set in code, which fires no input event: settle the direction now (mixed Hebrew + English).
  followTextDir(box);
  // The words are in the box now: close the tools menu so the box and this note show.
  document.querySelectorAll('.composer-menu[open]').forEach((menu) => { if (!menu.querySelector('.mic.rec')) menu.open = false; });
  const el = note(fixed ? ui(`Fixed ${fixed} word${fixed === 1 ? '' : 's'} from your list.`, fixed === 1 ? 'תוקנה מילה אחת מהרשימה שלך.' : `תוקנו ${fixed} מילים מהרשימה שלך.`) : ui('Wrong word? Select it and fix it.', 'מילה שגויה? סמנו אותה ותקנו.'));
  el.classList.add('dictation-done');
  el.insertAdjacentHTML('beforeend', `<div class="acts"><button type="button" class="go" data-fix>${ui('Fix a word', 'תיקון מילה')}</button></div>`);
  // pointerdown keeps the box's selection: that selection is the word to fix.
  el.querySelector('[data-fix]').onpointerdown = (e) => e.preventDefault();
  el.querySelector('[data-fix]').onclick = () => { el.remove(); wordFixSheet(box, sync); };
  setTimeout(() => el.remove(), 9000);
}

function confirmBusy(message, go) {
  const el = note(message);
  el.innerHTML = `${message}<div class="acts">
    <button type="button" data-no>Wait</button>
    <button type="button" class="go" data-yes>Send now</button></div>`;
  el.querySelector('[data-no]').onclick = () => el.remove();
  el.querySelector('[data-yes]').onclick = () => { el.remove(); go(); };
}

window.addEventListener('popstate', (e) => {
  // The full-size picture: Back closes it and the chat stays exactly as it was.
  if(mediaPopSkip){mediaPopSkip=false;return;}
  const full=document.getElementById('media-full');
  if(full?.open){full.close();return;}
  const ask=document.querySelector('.askbox'),editor=ask?.querySelector('.custom-answer');
  if(ask?.localEditorNavigation){ask.localEditorNavigation=false;return;}
  if(editor && !editor.hidden && !e.state?.answerEditor){ask.closeAnswerEditor(false);return;}
  if(ask && e.state?.answerEditor===ask.dataset.askId){ask.openAnswerEditor(false);return;}
  if(e.state?.inbox || location.hash==='#inbox'){openInbox();return;}
  const botId = e.state?.bot ?? (location.hash.startsWith('#bot:') ? location.hash.slice(5) : null);
  if(botId){openBot(botId);return;}
  const groupId = e.state?.group ?? (location.hash.startsWith('#group:') ? location.hash.slice(7) : null);
  if(groupId){openGroup(groupId);return;}
  const roomId = e.state?.room ?? (location.hash.startsWith('#room:') ? location.hash.slice(6) : null);
  if(roomId){openRoom(roomId);return;}
  const id = e.state?.pane ?? location.hash.slice(1);
  if(id){if(id!==focusedPane)recordVisit(id);chat(id);}else fleet();
});

// Following a link to #<terminal> while the app is already open changes only
// the hash — no navigation, no popstate — so listen for that too.
window.addEventListener('hashchange', () => {
  if(location.hash.startsWith('#cleanup')){history.replaceState({},'',location.pathname);fleet();openCleanup();return;}
  if(location.hash==='#inbox'){openInbox();return;}
  if(location.hash.startsWith('#room:')){openRoom(location.hash.slice(6));return;}
  if(location.hash.startsWith('#bot:')){openBot(location.hash.slice(5));return;}
  if(location.hash.startsWith('#group:')){openGroup(location.hash.slice(7));return;}
  const id = location.hash.slice(1);
  if(id){if(id!==focusedPane)recordVisit(id);chat(id);}else fleet();
});

// The PC map's "Clean up idle terminals" opens this page at #cleanup.
const cleanupOnOpen=location.hash.startsWith('#cleanup');if(cleanupOnOpen)history.replaceState({},'',location.pathname);
const opening = location.hash.startsWith('#room:') || location.hash.startsWith('#bot:') || location.hash.startsWith('#group:') || location.hash==='#inbox' ? '' : location.hash.slice(1);
if(location.hash==='#inbox'){history.replaceState({inbox:true},'',location.hash);openInbox();}
else if(location.hash.startsWith('#room:')){history.replaceState({room:location.hash.slice(6)},'',location.hash);openRoom(location.hash.slice(6));}
else if(location.hash.startsWith('#bot:')){history.replaceState({bot:location.hash.slice(5)},'',location.hash);openBot(location.hash.slice(5));}
else if(location.hash.startsWith('#group:')){history.replaceState({group:location.hash.slice(7)},'',location.hash);openGroup(location.hash.slice(7));}
else if(opening && performance.getEntriesByType('navigation')[0]?.type==='navigate')recordVisit(opening);
if (opening) { history.replaceState({ pane: opening }, '', location.hash); chat(opening); }
else if(!location.hash.startsWith('#room:') && !location.hash.startsWith('#bot:') && !location.hash.startsWith('#group:') && location.hash!=='#inbox') fleet();
if(cleanupOnOpen)openCleanup();
</script>
