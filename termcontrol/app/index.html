<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<title>TermControl</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#141413; --surface:#1c1c1a; --surface-2:#232320; --line:#2f2f2b;
    --text:#f0eee6; --muted:#9a9993; --dim:#8b8a85;
    --accent:#d97757; --waiting:#e0a458; --working:#7aa2a0; --idle:#63625d;
    --radius:14px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  }
  @supports not (height: 100dvh){ body{height:100vh} }
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);
    font-size:15px;line-height:1.5;overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top);
  }
  header{
    flex:none;z-index:5;background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:56px;
  }
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sub{font-size:12px;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{
    appearance:none;background:none;border:0;color:var(--accent);
    font-size:15px;min-width:56px;min-height:44px;padding:8px 10px;margin:-8px -10px;
    cursor:pointer;font-family:var(--ui);text-align:left;
  }
  main{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    overflow-anchor:auto;
    -webkit-overflow-scrolling:touch;
    padding:12px 12px 20px;max-width:720px;width:100%;margin:0 auto;
  }

  :focus-visible{
    outline:none;
    box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    border-radius:10px;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }

  .pane{
    position:relative;display:block;width:100%;text-align:left;appearance:none;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:8px;color:inherit;font:inherit;
    transition:background .15s ease;
  }
  .pane:active{background:var(--surface-2)}

  .attention-panel{
    margin:0 0 14px;border:1px solid #6b5029;border-radius:var(--radius);
    background:#1e1c17;overflow:hidden;
  }
  .attention-panel summary{
    min-height:48px;padding:11px 14px;display:flex;align-items:center;gap:9px;
    cursor:pointer;list-style:none;color:var(--waiting);font-weight:600;
  }
  .attention-panel summary::-webkit-details-marker{display:none}
  .attention-panel summary::after{
    content:'›';margin-left:auto;color:var(--muted);font-size:20px;line-height:1;
    transform:rotate(90deg);transition:transform .15s ease;
  }
  .attention-panel:not([open]) summary::after{transform:rotate(0)}
  .attention-count{
    min-width:22px;height:22px;padding:0 7px;border-radius:11px;
    display:inline-grid;place-items:center;background:var(--waiting);color:#211a0d;
    font-size:12px;font-weight:700;
  }
  .attention-list{border-top:1px solid #49391f;max-height:42dvh;overflow-y:auto}
  .attention-item{
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
    padding:10px 12px;border-bottom:1px solid #393025;
  }
  .attention-item:last-child{border-bottom:0}
  .attention-copy{min-width:0}
  .attention-project{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attention-reason{
    margin-top:2px;color:var(--muted);font-size:12px;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .attention-review{
    min-width:72px;min-height:44px;padding:9px 13px;border:1px solid #76592d;
    border-radius:10px;background:#2a2216;color:#f2c57c;font:600 13px var(--ui);cursor:pointer;
  }
  .attention-review:active{transform:translateY(1px);background:#352a19}

  /* Waiting: the only card that should stop your thumb. */
  .pane.waiting{
    border-color:#6b5029;
    background:linear-gradient(180deg,#26200f,#1e1c17);
    padding-left:19px;
  }
  .pane.waiting::before{
    content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
    border-radius:0 3px 3px 0;background:var(--waiting);
  }
  .pane.waiting .project{color:#fff}

  /* Idle: present, but quieter than everything above it. */
  .pane.idle{background:transparent;border-color:#262622}
  .pane.idle .project{color:var(--muted);font-weight:500}
  .pane.idle .task{color:var(--dim)}
  .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .emoji{font-size:17px;line-height:1;flex:none}
  .titleEmoji{font-size:15px;margin-right:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.waiting{background:var(--waiting);box-shadow:0 0 0 3px rgba(224,164,88,.16)}
  .dot.working{background:var(--working)}

  /* A terminal that is genuinely producing output right now. The pulse is the
     only motion in the app, and it stops the moment the output does. */
  .dot.producing{
    background:var(--working);
    box-shadow:0 0 0 0 rgba(122,162,160,.55);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 7px rgba(122,162,160,0)}
    100%{box-shadow:0 0 0 0 rgba(122,162,160,0)}
  }
  @media (prefers-reduced-motion: reduce){ .dot.producing{animation:none} }

  /* The terminal's own last line, changing as it prints. */
  .tail{
    display:flex;align-items:center;gap:8px;margin-top:9px;
    font-family:var(--mono);font-size:12px;color:var(--working);
    overflow:hidden;white-space:nowrap;
  }
  .tail .text{overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* A trace of how much output arrived over the last minute. */
  .trace{display:flex;align-items:flex-end;gap:2px;height:14px;flex:none}
  .trace i{
    display:block;width:3px;border-radius:1px;background:var(--working);
    opacity:.5;transition:height .3s ease, opacity .3s ease;
  }
  .trace i.on{opacity:1}

  .headtail{
    display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;
    color:var(--working);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .livemark{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;color:var(--working);
  }
  .livemark.quiet{color:var(--dim);font-weight:500}
  .livemark.gone{color:var(--waiting)}
  .agentstatus{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;color:var(--dim);font-size:12px}
  .agentstatus .workingtime{color:var(--working);font-weight:600}
  .agentstatus .quota{white-space:nowrap}
  .chatstatus:empty{display:none}
  .chatstatus .agentstatus{margin-top:3px;gap:3px 8px;font-size:12px}

  .headlive{
    display:inline-flex;align-items:center;gap:5px;margin-left:8px;
    font-size:12px;font-weight:600;color:var(--working);vertical-align:middle;
  }
  .headlive.quiet{color:var(--dim);font-weight:500}
  .dot.idle{background:var(--idle)}
  .project{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .badge{
    margin-left:auto;font-size:12px;color:var(--dim);font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
  }
  .task{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .task.none{color:var(--dim);font-style:italic}
  .state{
    display:inline-block;margin-top:9px;padding:3px 9px;border-radius:99px;
    font-size:12px;font-weight:600;letter-spacing:.01em;
    background:rgba(224,164,88,.15);color:var(--waiting);
  }
  .runmark{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:12px;font-weight:500;color:var(--working);
  }

  .switch{
    display:flex;gap:2px;padding:3px;margin:2px 2px 14px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line);
  }
  .switch button{
    flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;
    color:var(--muted);font:600 13px var(--ui);cursor:pointer;
  }
  .switch button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}

  .projgroup{margin-bottom:22px}
  .projhead{
    display:flex;align-items:center;gap:8px;margin:0 4px 9px;
    font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em;
  }
  .projhead .pemoji{font-size:16px}
  .projhead .count{
    margin-left:auto;font-size:12px;color:var(--dim);background:var(--surface-2);
    padding:2px 8px;border-radius:99px;font-weight:600;
  }
  .projhead.needs .count{background:rgba(224,164,88,.16);color:var(--waiting)}

  .rowwrap{display:flex;align-items:stretch;gap:8px}
  .rowwrap .pane{flex:1;min-width:0}
  .moves{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
  .moves button{
    width:44px;flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--muted);font:600 16px var(--ui);cursor:pointer;
  }
  .moves button:disabled{opacity:.35}

  h2.section{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    margin:20px 4px 9px;font-weight:600;
  }
  h2.section .count{
    font-size:12px;color:var(--dim);background:var(--surface-2);
    padding:1px 7px;border-radius:99px;font-weight:600;letter-spacing:0;
  }
  h2.section:first-child{margin-top:4px}

  .msg{margin-bottom:18px}
  .msg.mine .bubble{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;
  }
  .msg.mine.pendingmsg .bubble{opacity:.72;border-style:dashed}
  .msg.mine .who .when{color:var(--dim)}
  .who{
    display:flex;align-items:baseline;gap:8px;
    font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:6px;font-weight:600;
  }
  .who .when{text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim)}
  .msg.user .bubble{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;
  }
  .msg.assistant .bubble{padding:0 2px;font-size:15.5px;line-height:1.55;color:var(--text)}
  .bubble{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .richbubble{white-space:normal}
  .rich > *{margin:0 0 10px}
  .rich > *:last-child{margin-bottom:0}
  .rich ul, .rich ol{padding-inline-start:22px}
  .rich li{margin:0 0 4px}
  .rich h4{font-size:15.5px;font-weight:600;margin-top:14px}
  .rich hr{border:0;border-top:1px solid var(--line)}
  .rich a{color:var(--accent)}
  .rich code{
    font-family:var(--mono);font-size:.88em;background:var(--surface-2);
    border:1px solid var(--line);border-radius:5px;padding:0 4px;
  }
  .rich pre{
    font-family:var(--mono);font-size:12.5px;line-height:1.45;background:#0f0f0e;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch;
  }
  .rich pre code{background:none;border:0;padding:0;font-size:inherit}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  /* Words never split mid-word; a wide table scrolls sideways instead, the way
     chat apps show tables on a phone. */
  .rich table{border-collapse:collapse;width:max-content;min-width:100%;font-size:14px;line-height:1.4}
  .rich th, .rich td{
    padding:8px 10px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line);
    overflow-wrap:normal;word-break:normal;min-width:4.5em;max-width:15em;unicode-bidi:plaintext;
  }
  .rich td code{white-space:nowrap}
  @media (max-width:640px){
    .stacked{border:0;overflow:visible}
    .stacked table{width:100%;min-width:0}
    .stacked thead{display:none}
    .stacked tr{
      display:block;margin:0 0 10px;padding:10px 12px;
      background:var(--surface);border:1px solid var(--line);border-radius:10px;
    }
    .stacked td{display:block;max-width:none;min-width:0;padding:3px 0;border:0;overflow-wrap:break-word}
    .stacked td:has(> div:empty){display:none}
    .stacked td::before{
      content:attr(data-label);display:block;
      font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;
    }
    .stacked td:first-child{font-weight:600}
  }
  .rich code{unicode-bidi:plaintext}
  .rich th{background:var(--surface-2);font-weight:600;white-space:nowrap}
  .rich tr:last-child td{border-bottom:0}
  .tool{
    font-family:var(--mono);font-size:13px;color:var(--muted);
    background:transparent;border:0;border-left:2px solid #33332e;
    border-radius:0;padding:5px 0 5px 11px;margin:0 0 4px 2px;
    overflow-x:auto;white-space:nowrap;
  }
  .tool b{color:var(--muted);font-weight:500}
  .tool + .tool{margin-top:-2px}
  .msg + .tool{margin-top:10px}
  .tool + .msg{margin-top:14px}
  .pending{border-left-color:var(--working);color:var(--working)}
  .pending b{color:var(--working)}
  .empty{color:var(--dim);text-align:center;padding:48px 24px;font-size:14px}

  .earlier, .start{overflow-anchor:none}
  .earlier{
    display:block;width:100%;min-height:44px;margin:0 0 14px;
    border:1px solid var(--line);border-radius:12px;background:var(--surface);
    color:var(--muted);font:600 13px var(--ui);cursor:pointer;
  }
  .earlier:disabled{opacity:.6}
  .start{text-align:center;color:var(--dim);font-size:12.5px;margin:0 0 14px}

  /* The terminal's own screen. Menus an agent draws live only here. */
  .note{
    color:var(--muted);font-size:12.5px;line-height:1.4;
    margin:0 0 10px;padding:9px 11px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
  }
  .screen{
    font-family:var(--mono);font-size:12px;line-height:1.45;color:var(--text);
    background:#0f0f0e;border:1px solid var(--line);border-radius:12px;
    padding:12px;margin:0 0 12px;white-space:pre;overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .modeswitch{
    display:flex;gap:2px;padding:3px;border-radius:10px;flex:none;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .modeswitch button{
    min-width:56px;min-height:44px;padding:0 10px;border:0;border-radius:7px;
    background:transparent;color:var(--muted);font:600 12px var(--ui);cursor:pointer;
  }
  .modeswitch button[aria-pressed="true"]{background:var(--accent);color:#191512}

  /* The row that carries the view switch: always on screen, above the
     keyboard, because a sticky header is not reachable once a phone keyboard
     is open. */
  .toolrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .toolrow .keys{margin:0;flex:1;min-width:0}

  .composer{
    flex:none;z-index:6;background:var(--bg);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:flex-end;
    max-width:720px;width:100%;margin:0 auto;
  }
  .composer textarea{
    /* The stack around it is the flexible one; the box sets its own height as
       you type, so it must not be stretched to fit. */
    flex:none;width:100%;resize:none;min-height:44px;max-height:140px;
    padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font:16px/1.4 var(--ui);
  }
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer .attach{
    flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .composer input[type=file]{display:none}

  .attached{
    display:flex;align-items:center;gap:8px;margin:0 0 8px;
    padding:5px 5px 5px 8px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);
  }
  .attached img{width:30px;height:30px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2)}
  .attached img:not([src]){display:none}
  /* `display:flex` above beats the hidden attribute, which left an empty box
     sitting above the reply row with nothing in it. */
  .attached[hidden]{display:none}
  .attached .name{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attached button{
    flex:none;width:44px;height:44px;border:0;border-radius:8px;background:transparent;
    color:var(--muted);font-size:17px;cursor:pointer;
  }
  .composer .stack{flex:1;min-width:0;display:flex;flex-direction:column}

  /* The characters a phone keyboard hides behind two taps, and the keys a
     terminal needs. One tap each. */
  .keys{
    display:none;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .composer.typing .keys,
  .composer.always .keys{display:flex}
  .keys::-webkit-scrollbar{display:none}
  .keys button{
    flex:none;min-width:44px;height:44px;padding:0 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--surface);
    color:var(--text);font:600 15px var(--mono);cursor:pointer;
  }
  .keys button.wide{font-family:var(--ui);font-size:13px}
  .keys button:active{background:var(--surface-2)}

  /* The command list, the way an agent shows it: above what you are typing,
     narrowing as you go. */
  .cmdlist{
    max-height:44vh;overflow-y:auto;margin:0 0 8px;padding:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    -webkit-overflow-scrolling:touch;
  }
  .cmdlist[hidden]{display:none}
  .cmdlist button{
    display:block;width:100%;text-align:left;min-height:52px;padding:9px 12px;
    border:0;border-radius:9px;background:transparent;color:var(--text);
    font:inherit;cursor:pointer;
  }
  .cmdlist button:active{background:var(--surface-2)}
  .cmdlist .cmd{font-family:var(--mono);font-size:14.5px;color:var(--accent)}
  .cmdlist .what{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:3px;
    overflow:hidden;
  }
  .cmdlist .path{font-family:var(--mono);font-size:14px;color:var(--text)}
  .cmdlist .dir{color:var(--muted)}
  .cmdlist .hint{padding:12px;color:var(--muted);font-size:13px;line-height:1.45}
  .cmdlist .none{padding:14px 12px;color:var(--dim);font-size:13.5px}

  .askbox{
    flex:none;z-index:6;max-width:720px;width:100%;margin:0 auto;
    max-height:min(52dvh,420px);overflow-y:auto;overscroll-behavior:contain;
    display:flex;flex-direction:column;min-height:0;
    background:rgba(20,20,19,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:14px 12px 12px;
  }
  .askbox.hasscreen{height:min(52dvh,420px);overflow:hidden}
  .askbox > h3,.askbox > p,.askbox .opts{flex:none}
  .askbox h3{margin:0 0 3px;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .askbox p{margin:0 0 12px;font-size:13px;color:var(--muted)}
  .askbox.hasscreen > p.detail{max-height:44px;overflow:auto}
  .askbox .askscreen{
    flex:1 1 auto;min-height:44px;max-height:none;overflow:auto;margin:0 0 12px;padding:10px;border-radius:10px;
    background:#10100f;border:1px solid var(--line);color:var(--muted);
    font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .askbox .opts{display:flex;flex-direction:column;gap:8px}
  .askbox .opts button{
    width:100%;min-height:48px;padding:11px 14px;text-align:left;
    border:1px solid var(--line);border-radius:12px;background:var(--surface);
    color:var(--text);font:600 15px var(--ui);cursor:pointer;
  }
  .askbox .opts button .detail{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px}
  .askbox .opts button:first-child{border-color:var(--accent)}
  .askbox .typeinstead{
    display:block;width:100%;margin-top:10px;padding:10px;border:0;background:none;
    color:var(--muted);font:500 13px var(--ui);cursor:pointer;
  }
  .composer button.send{
    /* Stays a full-size target even when the attachment row makes the
       composer taller. */
    flex:none;align-self:flex-end;height:44px;min-height:44px;min-width:66px;
    border:0;border-radius:12px;background:var(--accent);color:#191512;
    font:600 15px var(--ui);cursor:pointer;
  }
  .composer button.send:disabled{opacity:.45}
  .composer.dead{justify-content:center;color:var(--dim);font-size:14px;padding-top:14px}
  .sendstate{
    position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:7;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;font-size:14px;color:var(--text);
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .sendstate.err{border-color:#5a3a26;background:#241d16;color:#f0c9a6}
  .sendstate .acts{display:flex;gap:8px;margin-top:10px}
  .sendstate .acts button{
    flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font:600 14px var(--ui);
  }
  .sendstate .acts button.go{background:var(--accent);color:#191512;border-color:transparent}
  .prompt{
    display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .prompt button{flex:1;padding:13px 8px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font:600 14px var(--ui)}
  .prompt button.yes{background:var(--accent);color:#191512;border-color:transparent}

  .spin{color:var(--dim);text-align:center;padding:40px;font-size:14px}
</style>
</head>
<body>
<header role="banner">
  <nav id="nav" aria-label="Back"></nav>
  <div style="min-width:0">
    <h1 id="title">TermControl</h1>
    <div class="sub" id="sub">loading…</div>
    <div class="chatstatus" id="chat-status"></div>
  </div>
</header>
<main id="main" role="main" aria-live="polite" aria-relevant="additions text"><div class="spin">loading…</div></main>
<noscript><p style="padding:24px;text-align:center;color:#9a9993">TermControl needs JavaScript to show your terminals.</p></noscript>

<script type="module">
const main = document.getElementById('main');
// Every navigation takes a ticket; a response that arrives after you have
// moved on is discarded instead of painting over the screen you are on.
let view = 0;

// The page a phone is running can be days old — it only changes when the
// browser is made to fetch it again. The bridge reports which version it
// holds; if that moves while you are looking, pick it up straight away.
let seenVersion = null;
function checkVersion(reported) {
  if (!reported) return;
  if (seenVersion === null) { seenVersion = reported; return; }
  if (reported !== seenVersion) location.reload();
}
let releaseChatScroll = null;
let releaseChatWake = null;
const title = document.getElementById('title');
const sub = document.getElementById('sub');
const chatStatus = document.getElementById('chat-status');
const nav = document.getElementById('nav');
let timer = null;
let clockTimer = null;

const ago = (ms) => {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
};
const trace = (pulse = []) => {
  const recent = pulse.slice(-10);
  if (!recent.length) return '';
  const peak = Math.max(...recent, 1);
  const bars = recent.map((v) => {
    const height = Math.max(2, Math.round((v / peak) * 14));
    return `<i class="${v > 0 ? 'on' : ''}" style="height:${height}px"></i>`;
  }).join('');
  return `<span class="trace" aria-hidden="true">${bars}</span>`;
};

const quietFor = (ms) => {
  if (ms == null) return 'a moment';
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.round(s / 60)}m`;
  return `${Math.round(s / 3600)}h`;
};
const duration = (ms) => {
  const total = Math.max(0, Math.floor(ms / 1000));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;
  return `${hours ? hours + 'h ' : ''}${minutes}m ${seconds}s`;
};
const quotaHtml = (limits) => {
  const five = limits?.fiveHour?.remainingPercent;
  const weekly = limits?.weekly?.remainingPercent;
  return [
    five != null ? `<span class="quota">5-hour ${Math.round(five)}% left</span>` : '',
    weekly != null ? `<span class="quota">weekly ${Math.round(weekly)}% left</span>` : '',
  ].filter(Boolean).join('');
};
const statusHtml = (pane) => {
  const working = pane.workingSince
    ? `<span class="workingtime" data-working-since="${Number(pane.workingSince)}">Working (${duration(Date.now() - pane.workingSince)})</span>`
    : '';
  const quotas = quotaHtml(pane.limits);
  return working || quotas ? `<div class="agentstatus">${working}${quotas}</div>` : '';
};
const updateClocks = () => {
  document.querySelectorAll('[data-working-since]').forEach((el) => {
    const since = Number(el.dataset.workingSince);
    if (Number.isFinite(since)) el.textContent = `Working (${duration(Date.now() - since)})`;
  });
};
clockTimer = setInterval(updateClocks, 1000);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// Agents answer in Markdown and terminals draw tables with box lines. Read as
// raw text on a phone both look like a terminal, not a conversation, so the
// chat turns them into real paragraphs, lists, code blocks and tables.
const BOX_RULE = /^[\s─━═┌┐└┘├┤┬┴┼╭╮╰╯╞╡╪+\-|:]+$/;
// A line reads right-to-left only when it is mostly Hebrew/Arabic. Going by the
// first letter flips an English line that merely starts with a Hebrew name.
const dirOf = (s) => {
  const text = String(s || '');
  const rtl = (text.match(/[֐-׿؀-ۿ]/g) || []).length;
  const ltr = (text.match(/[A-Za-zÀ-ɏ]/g) || []).length;
  return rtl > ltr ? 'rtl' : 'ltr';
};
const inlineRich = (s) => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
const tableHtml = (rows, header) => {
  const width = Math.max(...rows.map((r) => r.length));
  const cells = (row, tag) => Array.from({ length: width }, (_, i) =>
    `<${tag} dir="${dirOf(row[i])}">${inlineRich((row[i] || '').trim())}</${tag}>`).join('');
  const [head, ...body] = header ? rows : [null, ...rows];
  // Three or more columns do not fit a phone side by side, so each row becomes
  // a small card with every value under its column name.
  const stack = Boolean(head) && width >= 3;
  const labelled = (row) => Array.from({ length: width }, (_, i) =>
    `<td data-label="${esc((head[i] || '').trim()).replace(/"/g, '&quot;')}"><div dir="${dirOf(row[i])}">${inlineRich((row[i] || '').trim())}</div></td>`).join('');
  return `<div class="tablewrap${stack ? ' stacked' : ''}"><table>${head ? `<thead><tr>${cells(head, 'th')}</tr></thead>` : ''}`
    + `<tbody>${body.map((r) => `<tr>${stack ? labelled(r) : cells(r, 'td')}</tr>`).join('')}</tbody></table></div>`;
};
const pipeCells = (line) => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
function richText(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  const out = [];
  let para = [];
  const flush = () => {
    if (para.length) out.push(`<p dir="${dirOf(para.join(' '))}">${para.map(inlineRich).join('<br>')}</p>`);
    para = [];
  };
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flush();
      const code = [];
      i += 1;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i += 1;
      out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
      continue;
    }
    // Markdown table: a pipe row followed by a --- separator row.
    if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || '')) {
      flush();
      const rows = [pipeCells(line)];
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(pipeCells(lines[i++]));
      out.push(tableHtml(rows, true));
      continue;
    }
    // Box-drawn table: rows split by │, rule lines between them.
    if (/│.*│|│.+/.test(line) && (line.match(/│/g) || []).length >= 2) {
      flush();
      const rows = [];
      let header = false;
      while (i < lines.length && ((lines[i].match(/│/g) || []).length >= 2 || (BOX_RULE.test(lines[i]) && /[─━═]/.test(lines[i])))) {
        if ((lines[i].match(/│/g) || []).length >= 2) {
          rows.push(lines[i].trim().replace(/^│/, '').replace(/│$/, '').split('│'));
        } else if (rows.length === 1) {
          header = true;
        }
        i += 1;
      }
      out.push(tableHtml(rows, header && rows.length > 1));
      continue;
    }
    if (BOX_RULE.test(line) && /[─━═]{3,}|-{3,}/.test(line)) { flush(); out.push('<hr>'); i += 1; continue; }
    const heading = line.match(/^\s*#{1,6}\s+(.*)$/);
    if (heading) { flush(); out.push(`<h4 dir="${dirOf(heading[1])}">${inlineRich(heading[1])}</h4>`); i += 1; continue; }
    const bullet = /^\s*(?:[-*•]|\d+[.)])\s+/;
    if (bullet.test(line)) {
      flush();
      const ordered = /^\s*\d+[.)]/.test(line);
      const items = [];
      while (i < lines.length && bullet.test(lines[i])) items.push(lines[i++].replace(bullet, ''));
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>${items.map((item) => `<li dir="${dirOf(item)}">${inlineRich(item)}</li>`).join('')}</${tag}>`);
      continue;
    }
    if (!line.trim()) { flush(); i += 1; continue; }
    para.push(line.trim());
    i += 1;
  }
  flush();
  return `<div class="rich">${out.join('')}</div>`;
}
const approvalHistoryKey = (id) => `termcontrol-approval-history:${id}`;
const readApprovalHistory = (id) => {
  try {
    const entries = JSON.parse(localStorage.getItem(approvalHistoryKey(id)) || '[]');
    return Array.isArray(entries) ? entries.slice(-20) : [];
  } catch {
    return [];
  }
};
const rememberApproval = (id, entry) => {
  const entries = readApprovalHistory(id).filter((item) => item.askId !== entry.askId);
  entries.push(entry);
  try {
    localStorage.setItem(approvalHistoryKey(id), JSON.stringify(entries.slice(-20)));
  } catch {
    // The current chat still records the answer when private storage is unavailable.
  }
  return entries.slice(-20);
};

function openFleetPane(el) {
  const id = el.dataset.id;
  const mainRect = main.getBoundingClientRect();
  const paneRect = el.getBoundingClientRect();
  const fleetState = { ...(history.state || {}) };
  delete fleetState.pane;
  fleetState.fleetReturn = {
    id,
    origin: el.classList.contains('attention-review') ? 'review' : 'pane',
    offset: paneRect.top - mainRect.top,
    scrollTop: main.scrollTop,
  };
  history.replaceState(fleetState, '', location.href);
  history.pushState({ pane: id }, '', '#' + id);
  chat(id);
}

function restoreFleetReturn() {
  const restore = history.state?.fleetReturn;
  if (!restore) return;

  main.scrollTop = Number(restore.scrollTop) || 0;
  const state = { ...(history.state || {}) };
  delete state.fleetReturn;
  history.replaceState(state, '', location.href);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const preferred = restore.origin === 'review' ? '.attention-review' : '.pane';
    const pane = [...main.querySelectorAll(preferred)]
      .find((candidate) => candidate.dataset.id === restore.id);
    if (!pane) return;
    main.scrollTop += pane.getBoundingClientRect().top
      - main.getBoundingClientRect().top
      - Number(restore.offset || 0);
  }));
}

async function fleet() {
  const mine = ++view;
  clearInterval(timer);
  releaseChatScroll?.();
  releaseChatWake?.();
  document.body.classList.remove('chat');
  document.querySelector('.composer')?.remove();
  document.querySelector('.askbox')?.remove();
  document.querySelector('.sendstate')?.remove();
  nav.innerHTML = '';
  title.textContent = 'TermControl';
  chatStatus.innerHTML = '';
  let r;
  try {
    const resp = await fetch('/api/panes', { signal: AbortSignal.timeout(12000) });
    if (!resp.ok) throw new Error(resp.status === 401 ? 'Signed out — reload to sign in.' : 'Your machine did not answer.');
    r = await resp.json();
  } catch (e) {
    main.innerHTML = `<div class="empty">${esc(e.name === 'TimeoutError' ? 'Your machine is taking too long to answer.' : e.message)}<br><br>Pull down to try again.</div>`;
    sub.textContent = 'not connected';
    return;
  }
  if (mine !== view) return;
  checkVersion(r.version);
  const panes = r.panes;
  const waiting = panes.filter((p) => p.turn === 'waiting');
  sub.textContent = r.daemon === false
    ? 'TermFleet is not running — showing the last known list'
    : waiting.length
      ? `${waiting.length} waiting for you`
      : `${panes.length} terminal${panes.length === 1 ? '' : 's'}`;

  if (!panes.length) { main.innerHTML = '<div class="empty">No agent terminals in the last day.</div>'; return; }

  const attention = panes.filter((p) => p.attention);
  const attentionOpen = sessionStorage.getItem('termcontrol-attention-open') !== 'closed';
  const attentionPanel = attention.length ? `<details class="attention-panel"${attentionOpen ? ' open' : ''}>
      <summary><span>Needs you</span><span class="attention-count">${attention.length}</span></summary>
      <div class="attention-list">
        ${attention.map((p) => `<div class="attention-item">
          <div class="attention-copy">
            <div class="attention-project">${esc(p.project)} · ${esc(p.provider)}</div>
            <div class="attention-reason">${esc(p.attention.title || 'Waiting for your answer')}</div>
          </div>
          <button class="attention-review" data-id="${esc(p.id)}" aria-label="Review ${esc(p.project)} approval">Review</button>
        </div>`).join('')}
      </div>
    </details>` : '';

  const mode = r.view === 'manual' ? 'manual' : 'projects';
  if (mode === 'manual') {
    main.innerHTML = attentionPanel + panes.map(card).join('');
  } else {
    main.innerHTML = attentionPanel + (r.groups || []).map((g) => `<section class="projgroup">
        <h2 class="projhead${g.attention === 0 ? ' needs' : ''}">
          ${g.emoji ? `<span class="pemoji" aria-hidden="true">${esc(g.emoji)}</span>` : ''}
          <span>${esc(g.project)}</span>
          <span class="count">${g.attention === 0 ? 'needs you' : g.panes.length}</span>
        </h2>
        ${g.panes.map(card).join('')}
      </section>`).join('');
  }

  main.querySelectorAll('.attention-review').forEach((el) => {
    el.onclick = () => openFleetPane(el);
  });

  const attentionDetails = main.querySelector('.attention-panel');
  attentionDetails?.querySelector('summary')?.addEventListener('click', () => {
    sessionStorage.setItem('termcontrol-attention-open', attentionDetails.open ? 'closed' : 'open');
  });

  main.querySelectorAll('.pane').forEach((el) => {
    el.onclick = () => openFleetPane(el);
  });
  restoreFleetReturn();
  timer = setInterval(fleet, 15000);
}

function card(p) {
  const state = p.turn === 'waiting'
    ? 'needs your answer'
    : p.producing ? 'live now' : p.turn === 'working' ? 'running but quiet' : 'idle';
  return `<button class="pane ${p.turn}" data-id="${esc(p.id)}"
    aria-label="${esc(p.project)}, ${esc(p.provider)}, ${state}${p.task ? '. ' + esc(p.task) : ''}">
    <div class="row1">
      <span class="dot ${p.turn}" aria-hidden="true"></span>
      ${p.emoji ? `<span class="emoji" aria-hidden="true">${esc(p.emoji)}</span>` : ''}
      <span class="project">${esc(p.project)}</span>
      <span class="badge">${esc(p.provider)} · ${ago(p.updatedAt)}</span>
    </div>
    <div class="task${p.task ? '' : ' none'}">${esc(p.task || 'no task declared')}</div>
    ${p.turn === 'waiting' ? '<div class="state">Needs your answer</div>' : ''}
    ${statusHtml(p)}
    ${p.producing
        ? `<div class="livemark"><span class="dot producing" aria-hidden="true"></span>Live now</div>
           ${p.lastLine ? `<div class="tail">${trace(p.pulse)}<span class="text">${esc(p.lastLine)}</span></div>` : ''}`
        : p.turn === 'working'
          ? '<div class="livemark quiet"><span class="dot working" aria-hidden="true"></span>Running, quiet for ' + quietFor(p.quietForMs) + '</div>'
          : ''}
  </button>`;
}

async function chat(id) {
  const mine = ++view;
  clearInterval(timer);
  releaseChatWake?.();
  nav.innerHTML = '<button class="back">‹ Fleet</button>';
  nav.querySelector('.back').onclick = () => history.back();
  main.innerHTML = '<div class="spin">loading…</div>';
  chatStatus.innerHTML = '';

  let lastSignature = '';
  // A message typed into an agent only turns up in its record once the agent
  // reads it — sometimes a minute later. Until then, show it as yours, marked
  // as on its way, so it never looks like the message vanished.
  let justSent = null;
  let approvalHistory = readApprovalHistory(id);
  let shown = 60;                     // how far back this chat is showing
  let mode = sessionStorage.getItem('tc-mode') === 'screen' ? 'screen' : 'chat';

  // Follow the newest message until the reader scrolls away from the end.
  // Deciding "are we at the bottom?" afresh on every refresh gets it wrong
  // when a refresh lands while the layout is still settling.
  let following = true;
  const onScroll = () => {
    following = main.scrollHeight - main.scrollTop - main.clientHeight <= 80;
  };
  main.addEventListener('scroll', onScroll, { passive: true });
  releaseChatScroll?.();
  releaseChatScroll = () => {
    window.removeEventListener('scroll', onScroll);
    releaseChatScroll = null;
  };

  const render = async () => {
    let d;
    try {
      const r = await fetch(`/api/feed?pane=${encodeURIComponent(id)}&limit=${shown}`, {
        signal: AbortSignal.timeout(12000),
      });
      if (!r.ok) throw new Error(r.status === 401 ? 'Signed out — reload to sign in.' : 'Your machine did not answer.');
      d = await r.json();
    } catch (e) {
      if (lastSignature) return;                       // keep what is on screen
      main.innerHTML = `<div class="empty">${esc(e.name === 'TimeoutError' ? 'Your machine is taking too long to answer.' : e.message)}<br><br>Pull down to try again.</div>`;
      return;
    }
    if (mine !== view) return;
    checkVersion(d.version);
    if (d.error) { main.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
    title.innerHTML = (d.pane.emoji ? `<span class="titleEmoji">${esc(d.pane.emoji)}</span>` : '') + esc(d.pane.project)
      + (d.producing
          ? '<span class="headlive"><span class="dot producing" aria-hidden="true"></span>live</span>'
          : '<span class="headlive quiet"><span class="dot idle" aria-hidden="true"></span>quiet</span>');
    sub.innerHTML = esc(`${d.pane.provider}${d.pane.task ? ' · ' + d.pane.task : ''}`)
      + (d.producing && d.lastLine ? `<span class="headtail">${esc(d.lastLine)}</span>` : '');
    chatStatus.innerHTML = statusHtml(d.pane);

    if (!document.querySelector('.composer')) {
      mountComposer(
        id,
        (entry) => {
          if (entry?.refresh) { lastSignature = ''; return render(); }
          justSent = entry; following = true; render();
        },
        (next) => {
          mode = next;
          sessionStorage.setItem('tc-mode', mode);
          lastSignature = '';
          following = true;
          clearInterval(timer);
          timer = setInterval(render, mode === 'screen' ? 2000 : 8000);
          render();
        },
        () => mode,
      );
    }
    if (d.ask) {
      mountAsk(id, d.ask, (answer) => {
        approvalHistory = rememberApproval(id, answer);
        lastSignature = '';
        following = true;
        return render();
      });
    } else {
      document.querySelector('.askbox')?.remove();
    }

    if (!d.events.length) {
      // Some terminals keep no conversation of their own — a side session, a
      // plain shell. Showing what is on their screen is far more use than
      // telling someone there is nothing here.
      const shown = await fetch(`/api/screen?pane=${encodeURIComponent(id)}`)
        .then((x) => x.json()).catch(() => ({}));
      const screen = shown.screen || '';
      const pending = justSent
        ? `<div class="msg user mine pendingmsg">
             <div class="who">you<span class="when">${justSent.delivered ? 'sent — waiting for the agent to read it' : 'sending…'}</span></div>
             <div class="bubble">${esc(justSent.text)}</div>
           </div>`
        : '';
      const approvals = approvalHistory.map((entry) => `<div class="msg user mine approvalmsg">
          <div class="who">you<span class="when">${entry.at ? ago(entry.at) : ''}</span></div>
          <div class="bubble">${esc(entry.text)}</div>
        </div>`).join('');
      // Chat mode stays a chat even here: the screen is shown as the
      // terminal's latest message, with its tables and lists made readable.
      // The raw character grid is one tap away under Screen.
      main.innerHTML = (screen
        ? mode === 'screen'
          ? `<div class="screen">${esc(screen)}</div>`
          : `<div class="msg assistant">
               <div class="who">${esc(d.pane.provider)}<span class="when">on screen now</span></div>
               <div class="bubble richbubble">${richText(screen.replace(/[ \t]+$/gm, ''))}</div>
             </div>`
        : approvalHistory.length ? '' : '<div class="empty">Nothing recorded for this terminal yet.</div>') + approvals + pending;
      main.scrollTop = main.scrollHeight;
      return;
    }

    if (mode === 'screen') {
      const shown = await fetch(`/api/screen?pane=${encodeURIComponent(id)}`)
        .then((x) => x.json()).catch(() => ({}));
      const screenHtml = `<div class="screen">${esc(shown.screen || 'Nothing on the screen yet.')}</div>`;
      if (screenHtml !== lastSignature) {
        lastSignature = screenHtml;
        main.innerHTML = screenHtml;
        main.scrollTop = main.scrollHeight;
      }
      return;
    }

    const older = d.reachedStart
      ? '<div class="start">That is the start of this conversation.</div>'
      : '<button type="button" class="earlier">Show earlier messages</button>';

    const visibleEvents = d.events.filter((event) => event.kind !== 'tool');
    // Approval answers are local chat events, but they still belong at their
    // real time in the conversation. Appending them after every transcript
    // event makes an old answer cover newer agent replies and looks frozen.
    const displayEvents = [
      ...visibleEvents.map((event, index) => ({ ...event, localApproval: false, order: index })),
      ...approvalHistory.map((entry, index) => ({
        kind: 'user', text: entry.text, at: entry.at,
        localApproval: true, order: visibleEvents.length + index,
      })),
    ].sort((a, b) => {
      const aTime = new Date(a.at || 0).getTime();
      const bTime = new Date(b.at || 0).getTime();
      return aTime - bTime || a.order - b.order;
    });
    const html = older + displayEvents.map((e) => {
      const when = e.at ? ago(new Date(e.at).getTime()) : '';
      return `<div class="msg ${e.kind}${e.localApproval ? ' mine approvalmsg' : ''}">
        <div class="who">${e.kind === 'user' ? 'you' : esc(d.pane.provider)}${when ? `<span class="when">${when}</span>` : ''}</div>
        ${e.kind === 'user'
          ? `<div class="bubble" dir="auto">${esc(e.text)}</div>`
          : `<div class="bubble richbubble">${richText(e.text)}</div>`}
      </div>`;
    }).join('')
      + (justSent && !visibleEvents.some((e) => e.kind === 'user' && (e.text || '').includes(justSent.text))
        ? `<div class="msg user mine pendingmsg">
             <div class="who">you<span class="when">${justSent.delivered ? 'sent — waiting for the agent to read it' : 'sending…'}</span></div>
             <div class="bubble">${esc(justSent.text)}</div>
           </div>`
        : '');

    // Once the agent's own record shows it, stop holding our copy.
    if (justSent && visibleEvents.some((e) => e.kind === 'user' && (e.text || '').includes(justSent.text))) {
      justSent = null;
    }

    // Re-rendering identical content would throw away the reader's position.
    if (html === lastSignature) return;
    const first = lastSignature === '';
    const nearBottom = following;

    lastSignature = html;
    main.innerHTML = html;

    const earlier = main.querySelector('.earlier');
    if (earlier) {
      earlier.onclick = async () => {
        earlier.disabled = true;
        earlier.textContent = 'Loading…';
        shown += 60;
        lastSignature = '';
        following = false;
        // Keep the message you were reading in place as older ones arrive.
        const height = main.scrollHeight;
        await render();
        main.scrollTop += main.scrollHeight - height;
      };
    }

    if (first || nearBottom) {
      main.scrollTop = main.scrollHeight;
    } else if (false) {
      // Wait for layout: text rewraps and heights settle a frame after the
      // content is swapped in, so measuring immediately corrects by the wrong
      // amount and the page still drifts.
      const settle = () => {
        const rows = [...main.children];
        // Tool lines repeat verbatim ("exec · npm run build"), so matching on
        // text alone can land on a different copy further up or down the list.
        // Among equal matches, take the one closest to where it used to be.
        let best = -1;
        let bestDistance = Infinity;
        rows.forEach((r, i) => {
          if ((r.textContent || '').slice(0, 60) !== anchor.text) return;
          const distance = Math.abs(i - anchor.index);
          if (distance < bestDistance) { best = i; bestDistance = distance; }
        });
        const row = rows[best >= 0 ? best : anchor.index];
        if (row) main.scrollTop += row.getBoundingClientRect().top - anchor.offset;
        else main.scrollTop = wasAt;
      };
      requestAnimationFrame(() => requestAnimationFrame(settle));
    } else {
      main.scrollTop = wasAt;
    }
  };

  // Mobile browsers pause polling while this page is in the background. Fetch
  // immediately when the operator returns so a waiting permission is visible
  // without waiting for the next interval.
  const refreshWhenVisible = () => {
    if (mine === view && document.visibilityState !== 'hidden') render();
  };
  window.addEventListener('focus', refreshWhenVisible);
  window.addEventListener('pageshow', refreshWhenVisible);
  document.addEventListener('visibilitychange', refreshWhenVisible);
  releaseChatWake = () => {
    window.removeEventListener('focus', refreshWhenVisible);
    window.removeEventListener('pageshow', refreshWhenVisible);
    document.removeEventListener('visibilitychange', refreshWhenVisible);
    releaseChatWake = null;
  };

  await render();
  // The composer reserves space after the first paint, so land on the newest
  // message once the layout has actually settled.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (mine !== view) return;
    window.scrollTo(0, document.body.scrollHeight);
    following = true;                       // opening always lands at the end
  }));
  timer = setInterval(render, mode === 'screen' ? 2000 : 8000);
}

function mountAsk(id, ask, onDone) {
  document.body.classList.add('chat');
  const current = document.querySelector('.askbox');
  if (current?.dataset.askId === ask.id) return;
  current?.remove();

  const box = document.createElement('section');
  box.className = ask.screen ? 'askbox hasscreen' : 'askbox';
  box.dataset.askId = ask.id;
  box.setAttribute('aria-label', ask.kind === 'permission' ? 'Permission request' : 'Question from the agent');
  box.innerHTML = `
    <h3>${esc(ask.header || (ask.kind === 'permission' ? 'Permission requested' : 'Your answer is needed'))}</h3>
    ${ask.screen ? '' : `<p>${esc(ask.title)}</p>`}
    ${ask.detail ? `<p class="detail">${esc(ask.detail)}</p>` : ''}
    ${ask.screen ? `<div class="askscreen">${esc(ask.screen)}</div>` : ''}
    <div class="opts">${ask.options.map((option) => `
      <button type="button" data-choice="${esc(option.key)}">
        ${esc(option.label)}
        ${option.detail ? `<span class="detail">${esc(option.detail)}</span>` : ''}
      </button>`).join('')}</div>
    <p class="askresult" role="status"></p>`;
  const composer = document.querySelector('.composer');
  if (composer) composer.before(box);
  else document.body.appendChild(box);

  box.querySelectorAll('[data-choice]').forEach((button) => {
    button.onclick = async () => {
      box.querySelectorAll('button').forEach((item) => { item.disabled = true; });
      const result = box.querySelector('.askresult');
      result.textContent = 'Sending your answer…';
      let response;
      try {
        const sent = await fetch('/api/send', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ pane: id, choice: button.dataset.choice, askId: ask.id }),
          signal: AbortSignal.timeout(8000),
        });
        response = await sent.json();
      } catch {
        response = { error: 'Could not reach your machine. Nothing was approved.' };
      }
      if (response.error) {
        result.textContent = response.error;
        box.querySelectorAll('button').forEach((item) => { item.disabled = false; });
        return;
      }
      result.textContent = 'Answer delivered.';
      box.remove();
      const option = ask.options.find((item) => item.key === button.dataset.choice);
      onDone?.({
        askId: ask.id,
        text: `Permission answer: ${option?.label || button.dataset.choice}`,
        at: Date.now(),
      });
    };
  });
}

function mountComposer(id, onSent, onMode, view = () => 'chat') {
  document.body.classList.add('chat');
  document.querySelector('.askbox')?.remove();
  const old = document.querySelector('.composer');
  if (old) old.remove();

  const bar = document.createElement('div');
  bar.className = 'composer';
  bar.innerHTML = `
    <button type="button" class="attach" aria-label="Attach an image">＋</button>
    <input type="file" accept="image/*" aria-hidden="true">
    <div class="stack">
      <div class="toolrow">
        <div class="modeswitch" role="group" aria-label="What to show">
          <button type="button" data-mode="chat">Chat</button>
          <button type="button" data-mode="screen">Screen</button>
        </div>
        <div class="keys" role="group" aria-label="Terminal keys">
        <button type="button" data-ins="/" aria-label="Slash">/</button>
        <button type="button" data-ins="$" aria-label="Dollar">$</button>
        <button type="button" data-ins="-" aria-label="Dash">-</button>
        <button type="button" data-ins="_" aria-label="Underscore">_</button>
        <button type="button" data-ins="|" aria-label="Pipe">|</button>
        <button type="button" data-ins="~" aria-label="Tilde">~</button>
        <button type="button" data-ins="&amp;" aria-label="Ampersand">&amp;</button>
        <button type="button" class="wide" data-key="enter" aria-label="Enter key">Enter</button>
        <button type="button" class="wide" data-key="up" aria-label="Arrow up">↑</button>
        <button type="button" class="wide" data-key="down" aria-label="Arrow down">↓</button>
        <button type="button" class="wide" data-key="tab" aria-label="Tab key">Tab</button>
        <button type="button" class="wide" data-key="esc" aria-label="Escape key">Esc</button>
          <button type="button" class="wide" data-key="interrupt" aria-label="Interrupt the agent">Stop</button>
        </div>
      </div>
      <div class="cmdlist" hidden></div>
      <div class="attached" hidden>
        <img alt="">
        <span class="name"></span>
        <button type="button" class="drop" aria-label="Remove the image">✕</button>
      </div>
      <textarea rows="1" placeholder="Reply to this agent…" enterkeyhint="send" aria-label="Your reply"></textarea>
    </div>
    <button type="button" class="send" disabled>Send</button>`;
  document.body.appendChild(bar);

  const cmdlist = bar.querySelector('.cmdlist');
  let commands = null;

  // An agent's own commands, offered as you type a slash — the same list its
  // terminal menu shows, without needing to drive the terminal.
  async function loadCommands() {
    if (commands) return commands;
    const r = await fetch(`/api/commands?pane=${encodeURIComponent(id)}`)
      .then((x) => x.json()).catch(() => ({}));
    commands = r.commands || [];
    return commands;
  }

  async function showCommands(typed) {
    const list = await loadCommands();
    const query = typed.slice(1).toLowerCase();
    const matches = list
      .filter((c) => c.name.toLowerCase().includes(query))
      .sort((a, b) => {
        const aStarts = a.name.toLowerCase().startsWith(query) ? 0 : 1;
        const bStarts = b.name.toLowerCase().startsWith(query) ? 0 : 1;
        return aStarts - bStarts || a.name.localeCompare(b.name);
      })
      .slice(0, 40);

    cmdlist.hidden = false;
    cmdlist.innerHTML = matches.length
      ? matches.map((c) => `<button type="button" data-cmd="${esc(c.name)}">
            <span class="cmd">/${esc(c.name)}</span>
            ${c.detail ? `<span class="what">${esc(c.detail)}</span>` : ''}
          </button>`).join('')
      : '<div class="none">No command matches that.</div>';

    cmdlist.querySelectorAll('[data-cmd]').forEach((el) => {
      el.onclick = () => {
        box.value = `/${el.dataset.cmd} `;
        hideCommands();
        box.focus();
        sync();
      };
    });
  }

  // Files in this terminal's project, for "@". Typing a path on a phone is
  // miserable; picking one is not.
  async function showFiles(typed) {
    const query = typed.slice(typed.lastIndexOf('@') + 1);
    const r = await fetch(`/api/files?pane=${encodeURIComponent(id)}&q=${encodeURIComponent(query)}`)
      .then((x) => x.json()).catch(() => ({}));
    const files = r.files || [];

    cmdlist.hidden = false;
    cmdlist.innerHTML = files.length
      ? files.map((f) => {
          const cut = f.lastIndexOf('/');
          const dir = cut > 0 ? f.slice(0, cut + 1) : '';
          const name = cut > 0 ? f.slice(cut + 1) : f;
          return `<button type="button" data-file="${esc(f)}">
              <span class="path"><span class="dir">${esc(dir)}</span>${esc(name)}</span>
            </button>`;
        }).join('')
      : '<div class="none">No file matches that.</div>';

    cmdlist.querySelectorAll('[data-file]').forEach((el) => {
      el.onclick = () => {
        const at = box.value.lastIndexOf('@');
        box.value = `${box.value.slice(0, at)}@${el.dataset.file} `;
        hideCommands();
        box.focus();
        sync();
      };
    });
  }

  // A leading "!" runs the rest in the shell, so say so rather than leaving it
  // to be discovered.
  function showShellHint() {
    cmdlist.hidden = false;
    cmdlist.innerHTML = '<div class="hint">Starting with <b>!</b> runs the rest as a shell command in this terminal.</div>';
  }

  function hideCommands() {
    cmdlist.hidden = true;
    cmdlist.innerHTML = '';
  }

  const box = bar.querySelector('textarea');
  const btn = bar.querySelector('button.send');
  const file = bar.querySelector('input[type=file]');
  const attached = bar.querySelector('.attached');
  const preview = attached.querySelector('img');
  const nameEl = attached.querySelector('.name');

  // An image is held here until you send; the agent is given its path on the
  // machine, because a terminal cannot be handed a file any other way.
  let image = null;

  const showImage = async (blob, label) => {
    attached.hidden = false;
    preview.removeAttribute('src');
    nameEl.textContent = 'preparing…';
    sync();

    // Phone photos are huge; sending one raw over mobile data is what makes an
    // upload look stuck. Shrink it first, and fall back to the original if the
    // browser cannot decode it.
    const prepared = await shrink(blob).catch(() => blob);
    image = { blob: prepared, label };

    if (preview.src) URL.revokeObjectURL(preview.src);
    preview.src = URL.createObjectURL(prepared);
    preview.onerror = () => { preview.removeAttribute('src'); };
    nameEl.textContent = `${label} · ${Math.max(1, Math.round(prepared.size / 1024))} KB`;
    sync();
  };

  async function shrink(blob, max = 1600) {
    if (!/^image\//.test(blob.type) || blob.size < 400 * 1024) return blob;
    const bitmap = await createImageBitmap(blob);
    const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
    if (scale === 1 && blob.size < 2 * 1024 * 1024) { bitmap.close?.(); return blob; }

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close?.();

    const smaller = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85));
    return smaller && smaller.size < blob.size ? smaller : blob;
  }
  const clearImage = () => {
    if (preview.src) URL.revokeObjectURL(preview.src);
    image = null;
    attached.hidden = true;
    preview.removeAttribute('src');
    sync();
  };

  // Characters go into the box you are composing; control keys go straight to
  // the terminal, because that is what they mean.
  bar.querySelectorAll('[data-ins]').forEach((key) => {
    key.onclick = () => {
      // In Terminal view the character is meant for the terminal itself: a
      // slash there opens the agent's command list, which is the whole point.
      if (bar.classList.contains('always')) return sendRaw(`type:${key.dataset.ins}`, key.dataset.ins);

      const at = box.selectionStart ?? box.value.length;
      const end = box.selectionEnd ?? at;
      box.value = box.value.slice(0, at) + key.dataset.ins + box.value.slice(end);
      box.selectionStart = box.selectionEnd = at + key.dataset.ins.length;
      box.focus();
      sync();
    };
  });

  async function sendRaw(which, label) {
    note(`Sent ${label}`);
    const r = await fetch('/api/send', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pane: id, key: which }),
    }).then((x) => x.json()).catch(() => ({ error: 'Could not reach your machine.' }));
    if (r.error) return note(r.error, true);
    setTimeout(() => document.querySelector('.sendstate')?.remove(), 900);
    onSent?.({ refresh: true });
  }

  bar.querySelectorAll('[data-key]').forEach((key) => {
    key.onclick = async () => {
      const which = key.dataset.key;
      note(which === 'interrupt' ? 'Stopping…' : `Sent ${key.textContent.trim()}`);
      const r = await fetch('/api/send', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pane: id, key: which }),
      }).then((x) => x.json()).catch(() => ({ error: 'Could not reach your machine.' }));
      if (r.error) return note(r.error, true);
      setTimeout(() => document.querySelector('.sendstate')?.remove(), 1200);
    };
  });

  bar.querySelector('.attach').onclick = () => file.click();
  bar.querySelector('.drop').onclick = clearImage;
  file.onchange = () => {
    const chosen = file.files?.[0];
    if (chosen) showImage(chosen, chosen.name || 'image').catch(() => { clearImage(); note('That image could not be read.', true); });
    file.value = '';
  };

  // Pasting a screenshot straight into the box.
  box.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (!item) return;
    const blob = item.getAsFile();
    if (blob) { e.preventDefault(); showImage(blob, 'pasted image').catch(() => { clearImage(); note('That image could not be read.', true); }); }
  });

  const sync = () => {
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 140) + 'px';
    btn.disabled = box.value.trim().length === 0 && !image;
  };
  box.addEventListener('input', () => {
    sync();
    const typed = box.value;
    if (/^\/[^\s]*$/.test(typed)) showCommands(typed);
    else if (/@[^\s]*$/.test(typed)) showFiles(typed);
    else if (/^![^\n]*$/.test(typed)) showShellHint();
    else hideCommands();
  });

  // The extra keys are only useful while you are actually typing, so they do
  // not sit there taking up the screen the rest of the time.
  box.addEventListener('focus', () => bar.classList.add('typing'));
  box.addEventListener('blur', () => {
    // Give a tap on one of the keys time to land before hiding them.
    setTimeout(() => {
      if (!bar.contains(document.activeElement)) bar.classList.remove('typing');
    }, 150);
  });

  const send = async (force = false) => {
    let text = box.value.trim();
    if (!text && !image) return;
    btn.disabled = true;

    if (image) {
      note('Sending the image…');
      const form = new FormData();
      form.append('file', image.blob, image.label);
      let saved;
      try {
        saved = await upload(form, (percent) => note(`Sending the image… ${percent}%`));
      } catch (e) {
        btn.disabled = false;
        return note(e.message || 'Could not send the image. It is still here.', true);
      }

      if (saved.error) { btn.disabled = false; return note(saved.error, true); }
      // Hand the agent the path it can actually open.
      text = text ? `${text}\n${saved.path}` : saved.path;
      clearImage();
    }

    note('Sending…');
    const slow = setTimeout(() => note('Still trying to reach your machine…'), 3000);
    let r;
    try {
      const resp = await fetch('/api/send', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pane: id, text, force }),
        signal: AbortSignal.timeout(8000),
      });
      r = await resp.json();
      if (resp.status === 401) r = { error: 'Signed out — reload to sign in.' };
    } catch {
      r = { error: 'Could not reach your machine. Your message is still here.' };
    }
    clearTimeout(slow);
    btn.disabled = false;

    if (r.busy) return confirmBusy(r.message, () => send(true));
    if (r.error) return note(r.error, true);
    onSent?.({ text, delivered: r.delivered !== false, at: Date.now() });
    box.value = '';
    hideCommands();
    sync();

    if (r.delivered === false) {
      // The write succeeded but the text never showed up in the terminal.
      note('Sent, but it did not appear in the terminal. Check it on your computer.', true);
      return;
    }
    note('Delivered');
    setTimeout(() => { const n = document.querySelector('.sendstate'); if (n) n.remove(); }, 1400);
  };

  // The view switch lives in this bar, so it is wired when the bar is built.
  const paintSwitch = () => {
    bar.querySelectorAll('.modeswitch button').forEach((el) => {
      el.setAttribute('aria-pressed', String(el.dataset.mode === view()));
    });
    const screening = view() === 'screen';
    bar.classList.toggle('always', screening);
    btn.textContent = screening ? 'Type' : 'Send';
    box.placeholder = screening ? 'Type into the terminal…' : 'Reply to this agent…';
  };

  bar.querySelectorAll('.modeswitch button').forEach((el) => {
    el.onclick = () => { onMode?.(el.dataset.mode); paintSwitch(); };
  });
  paintSwitch();

  btn.onclick = () => {
    if (bar.classList.contains('always')) {
      const text = box.value;
      if (!text) return;
      box.value = ''; sync();
      return sendRaw(`type:${text}`, 'text');
    }
    send(false);
  };
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(false); }
  });
}

/** Upload with real progress, so a slow connection looks slow rather than stuck. */
function upload(form, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.timeout = 120000;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress?.(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText || '{}'); } catch { /* ignore */ }
      if (xhr.status === 200) resolve(body);
      else reject(new Error(body.error || 'The image was refused.'));
    };
    xhr.onerror = () => reject(new Error('Could not reach your machine. The image is still here.'));
    xhr.ontimeout = () => reject(new Error('That took too long. The image is still here.'));
    xhr.send(form);
  });
}

function note(text, isError = false) {
  const old = document.querySelector('.sendstate');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'sendstate' + (isError ? ' err' : '');
  el.textContent = text;
  document.body.appendChild(el);
  if (!isError) return el;
  setTimeout(() => el.remove(), 5000);
  return el;
}

function confirmBusy(message, go) {
  const el = note(message);
  el.innerHTML = `${message}<div class="acts">
    <button type="button" data-no>Wait</button>
    <button type="button" class="go" data-yes>Send now</button></div>`;
  el.querySelector('[data-no]').onclick = () => el.remove();
  el.querySelector('[data-yes]').onclick = () => { el.remove(); go(); };
}

window.addEventListener('popstate', (e) => {
  const id = e.state?.pane ?? location.hash.slice(1);
  if (id) chat(id); else fleet();
});

// Following a link to #<terminal> while the app is already open changes only
// the hash — no navigation, no popstate — so listen for that too.
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id) chat(id); else fleet();
});

const opening = location.hash.slice(1);
if (opening) { history.replaceState({ pane: opening }, '', location.hash); chat(opening); }
else fleet();
</script>
</body>
</html>
